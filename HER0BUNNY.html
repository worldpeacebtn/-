<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Holo Rabbit Lab · v0.4</title>
<style>
:root{
  --hue:0;
  --o:hsl(30 100% 55%); --y:hsl(45 100% 60%);
  --r:44px; --pulse:.35;
  --glass:rgba(255,255,255,.16); --stroke:rgba(255,255,255,.55);
  --ink:#4a2400;
  --bg1:#fffaf2; --bg2:#ffe9a8; --bg3:#ffc93f; --bg4:#ff8a1f; --bg5:#ff6a00;
  --bunny:#fff6ea; --bunnyEar:#fff;
  --neon:hsl(25 100% 60%);
  --rainbow:conic-gradient(from 0deg,#ff4d4d,#ffb84d,#ffee4d,#4dff88,#4dd2ff,#a64dff,#ff4dd2,#ff4d4d);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);overscroll-behavior:none;touch-action:manipulation}

/* --- BACKGROUND (hue-rotated twilight) --- */
#bg{position:fixed;inset:0;z-index:0;filter:hue-rotate(calc(var(--hue)*1deg));
  background:radial-gradient(130% 100% at 25% 0%,var(--bg1) 0%,var(--bg2) 22%,var(--bg3) 48%,
    var(--bg4) 76%,var(--bg5) 100%);transition:filter .15s}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.13;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.85'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.cloud{position:fixed;z-index:1;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0) 72%);
  filter:blur(10px);will-change:transform;opacity:.75}

/* --- Bunny silhouette --- */
#bunny{position:fixed;z-index:0;left:50%;top:-8vh;transform:translateX(-50%);
  width:min(72vw,560px);height:52vh;pointer-events:none;opacity:.45;
  filter:blur(2px) hue-rotate(calc(var(--hue)*1deg))}
#bunny .ear{position:absolute;width:22%;height:78%;top:0;border-radius:50%;
  background:radial-gradient(closest-side,var(--bunnyEar),transparent 72%)}
#bunny .ear.l{left:24%} #bunny .ear.r{right:24%}
#bunny .head{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:56%;height:52%;border-radius:50%;
  background:radial-gradient(closest-side,var(--bunny),transparent 72%)}

/* --- LED frame --- */
#frame{position:fixed;inset:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right))
  max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  z-index:8;pointer-events:none;border-radius:calc(var(--r) + 18px);
  filter:hue-rotate(calc(var(--hue)*1deg));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),
    inset 0 0 34px rgba(255,170,80,calc(var(--pulse)*1.1)),
    inset 0 0 90px rgba(255,120,20,calc(var(--pulse)*.5)),
    0 0 70px rgba(255,150,60,calc(var(--pulse)*.9));
  transition:box-shadow .15s linear}
#frame::after{content:"";position:absolute;inset:-2px;border-radius:inherit;
  background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.5),transparent 40%);
  animation:spin 9s linear infinite;opacity:.45;mix-blend-mode:screen}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- Device --- */
#device{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(96vw,440px);height:min(94vh,940px);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.14));
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 30px 80px rgba(120,50,0,.45),inset 0 1px 0 rgba(255,255,255,.7);
  display:flex;flex-direction:column}
@media (orientation:landscape){#device{width:min(92vw,1000px);height:min(92vh,580px);--r:36px}}

/* --- Top bar (minimal) --- */
#top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;
  font-size:12px;font-weight:700}
#top .logo{font-size:18px}
#top .spacer{flex:1}
#top button{border:0;background:rgba(255,255,255,.4);font:inherit;font-size:14px;
  cursor:pointer;padding:5px 8px;color:inherit;border-radius:10px;
  border:1px solid var(--stroke)}
#top button:active{transform:scale(.94)}
#clock{font-size:11px;opacity:.7}

/* --- Hue circle --- */
#hueWrap{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.35);
  border-radius:20px;padding:3px 8px 3px 3px;border:1px solid var(--stroke)}
#hueCircle{width:26px;height:26px;border-radius:50%;
  background:conic-gradient(from 0deg,#ff4d4d,#ffb84d,#ffee4d,#4dff88,#4dd2ff,#a64dff,#ff4dd2,#ff4d4d);
  position:relative;cursor:grab;box-shadow:inset 0 0 4px rgba(0,0,0,.4)}
#hueDot{position:absolute;top:-3px;left:50%;width:7px;height:7px;margin-left:-3.5px;
  border-radius:50%;background:#fff;border:2px solid #333;pointer-events:none}

/* --- Screen --- */
#screen{flex:1;position:relative;overflow:hidden}

/* --- Lab view (JRPG style) --- */
#lab{position:absolute;inset:0;display:flex;flex-direction:column;
  transition:transform .3s;transform-origin:center}
#lab.zoomed{transform:scale(1.15)}

/* infinity table in middle */
#infinity{position:relative;flex:1;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.18));
  border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.3)}
#infinity::before,#infinity::after{
  content:"";position:absolute;top:50%;left:50%;
  width:min(56vw,240px);height:min(36vw,150px);border-radius:50%;
  transform:translate(-50%,-50%) translateX(-25%);
  background:radial-gradient(closest-side,rgba(255,220,120,.4),rgba(255,150,60,.15) 60%,transparent 75%);
  box-shadow:0 0 40px rgba(255,180,80,.6),inset 0 0 30px rgba(255,220,150,.5);
  border:1.5px dashed rgba(255,255,255,.55)}
#infinity::after{transform:translate(-50%,-50%) translateX(25%)}
#infinityLabel{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:800;letter-spacing:2px;opacity:.55}
/* side neon lines (audio-reactive) */
.neonLine{position:absolute;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--neon),transparent);
  opacity:calc(.3 + var(--pulse)*.7);box-shadow:0 0 12px var(--neon)}
.neonLine.l{left:6px} .neonLine.r{right:6px}
/* side shelf for cards */
#shelfL,#shelfR{position:absolute;top:20%;bottom:20%;width:56px;
  display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding:4px;
  scrollbar-width:none}
#shelfL::-webkit-scrollbar,#shelfR::-webkit-scrollbar{display:none}
#shelfL{left:8px} #shelfR{right:8px}
.shelfCard{width:100%;aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.7);
  border:1.5px solid var(--stroke);display:grid;place-items:center;font-size:20px;
  cursor:pointer;transition:transform .15s}
.shelfCard:active{transform:scale(.9)}

/* --- Decks (square grid, TikTok swipe) --- */
#deckBar{flex:0 0 auto;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
#deckBar .label{font-size:10px;font-weight:800;letter-spacing:1px;opacity:.55;
  display:flex;align-items:center;gap:6px}
#deckBar .label button{margin-left:auto;border:0;background:rgba(255,255,255,.5);
  border-radius:8px;padding:3px 8px;font:inherit;font-size:10px;font-weight:700;
  cursor:pointer;color:inherit;border:1px solid var(--stroke)}
#decks{display:grid;grid-auto-flow:column;grid-auto-columns:min(28%,110px);
  grid-template-rows:1fr;gap:8px;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
#decks::-webkit-scrollbar{display:none}
@media (orientation:landscape){#decks{grid-auto-columns:min(14%,110px)}}
.sqCard{scroll-snap-align:start;aspect-ratio:1;border-radius:14px;position:relative;
  border:1.5px solid var(--stroke);background:linear-gradient(150deg,rgba(255,255,255,.7),rgba(255,255,255,.25));
  backdrop-filter:blur(12px);display:grid;place-items:center;padding:8px;
  cursor:pointer;user-select:none;touch-action:none;overflow:hidden;
  box-shadow:0 4px 14px rgba(120,50,0,.2),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .18s}
.sqCard:active{transform:scale(.94)}
.sqCard .emo{font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(120,50,0,.35))}
.sqCard .nm{position:absolute;left:4px;right:4px;bottom:3px;font-size:9px;font-weight:700;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.sqCard .thumb{position:absolute;inset:0;object-fit:cover;width:100%;height:100%}
.sqCard.add{border-style:dashed;opacity:.7}

/* --- Stage (opened deck) --- */
#stageWrap{position:absolute;inset:0;z-index:14;display:none;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.1));
  backdrop-filter:blur(10px)}
#stageWrap.on{display:flex}
#stageHead{flex:0 0 auto;padding:6px 12px;display:flex;align-items:center;gap:6px;
  font-weight:700;font-size:12px;border-bottom:1px solid rgba(255,255,255,.35)}
#stageHead button{border:0;background:rgba(255,255,255,.5);border-radius:10px;
  padding:5px 9px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;color:inherit;
  border:1px solid var(--stroke)}
#stageGrid{flex:1;overflow-y:auto;display:grid;gap:8px;padding:10px;
  grid-template-columns:repeat(2,1fr);align-content:start;scrollbar-width:none}
#stageGrid::-webkit-scrollbar{display:none}
@media (orientation:landscape){#stageGrid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:700px) and (orientation:portrait){#stageGrid{grid-template-columns:repeat(3,1fr)}}

/* card themes */
.cardFace{border-radius:16px;position:relative;overflow:hidden;aspect-ratio:3/4;
  border:1.5px solid var(--stroke);display:flex;flex-direction:column;
  box-shadow:0 6px 20px rgba(120,50,0,.25),inset 0 1px 0 rgba(255,255,255,.6);
  cursor:pointer;user-select:none;touch-action:none;transition:transform .18s}
.cardFace:active{transform:scale(.96)}
.cardFace .thumb{flex:1;overflow:hidden;display:grid;place-items:center;
  background:rgba(255,255,255,.35);font-size:34px}
.cardFace .thumb img,.cardFace .thumb video{width:100%;height:100%;object-fit:cover}
.cardFace .foot{padding:5px 6px;font-size:9px;font-weight:700;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.15))}
.cardFace .suitT{position:absolute;top:4px;left:5px;font-size:12px;opacity:.85;z-index:2}
.cardFace .suitB{position:absolute;top:4px;right:5px;font-size:12px;opacity:.85;z-index:2}

/* 8 card themes */
.t-hearts   {background:linear-gradient(150deg,#ffe4ee,#ff9ec3)}
.t-hearts   .suitT,.t-hearts .suitB{color:#c11b5a}
.t-spades   {background:linear-gradient(150deg,#e6e6f5,#9b9bc9)}
.t-spades   .suitT,.t-spades .suitB{color:#2a2a55}
.t-nature   {background:linear-gradient(150deg,#e7ffe7,#8fe0a1)}
.t-nature   .suitT,.t-nature .suitB{color:#1f7a3a}
.t-animal   {background:linear-gradient(150deg,#fff2dc,#ffcb85)}
.t-animal   .suitT,.t-animal .suitB{color:#a05a00}
.t-insect   {background:linear-gradient(150deg,#dfffea,#7ee0b1)}
.t-insect   .suitT,.t-insect .suitB{color:#0a6640}
.t-cyber    {background:linear-gradient(150deg,#1a0a2e,#4a1e6b);color:#e8d8ff}
.t-cyber    .suitT,.t-cyber .suitB{color:#aaffff}
.t-eco      {background:linear-gradient(150deg,#f0fff0,#b0ffd0)}
.t-eco      .suitT,.t-eco .suitB{color:#006644}
.t-neon     {background:linear-gradient(150deg,#0a0a2a,#4a1aff);color:#fff}
.t-neon     .suitT,.t-neon .suitB{color:#4dffff}
.t-paper    {background:linear-gradient(150deg,#fffaf0,#ffe8c8)}
.t-paper    .suitT,.t-paper .suitB{color:#a05a00}
.cardFace.pinned::after{content:"📌";position:absolute;top:2px;right:2px;font-size:10px;z-index:3}

/* --- Stickers + foils --- */
#stage{position:absolute;inset:0;z-index:16;pointer-events:none;overflow:hidden}
body.edit #stage{pointer-events:auto;background:rgba(255,255,255,.04)}
.item{position:absolute;pointer-events:auto;touch-action:none;transform-origin:center;cursor:grab}
.item img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.bubble{padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.9);
  border:2px solid rgba(255,255,255,.95);box-shadow:0 5px 14px rgba(140,60,0,.28);
  font-size:12px;font-weight:600;max-width:60vw}
body.edit .item{outline:1.5px dashed var(--o);outline-offset:3px}

#foils{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.foil{position:absolute;width:78%;height:76%;border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px);
  box-shadow:0 12px 40px rgba(120,50,0,.4);
  border:1.5px solid var(--stroke);pointer-events:auto;touch-action:none}
.foil-bar{display:flex;align-items:center;gap:5px;padding:5px 8px;font-size:10px;font-weight:700;
  background:linear-gradient(180deg,rgba(255,210,63,.5),rgba(255,138,31,.3));cursor:grab}
.foil-bar .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foil-bar button{border:0;background:transparent;font:inherit;font-size:12px;cursor:pointer;color:inherit}
.foil-body{width:100%;height:calc(100% - 26px);background:#fff}
.foil-body iframe,.foil-body img,.foil-body video{width:100%;height:100%;border:0;object-fit:contain}

/* --- Edit panel --- */
#panel{position:absolute;z-index:22;left:8px;right:8px;bottom:8px;display:none;
  padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(120,50,0,.35);
  font-size:11px;font-weight:600}
body.edit #panel.on{display:block}
#panel .row{display:flex;align-items:center;gap:8px;margin:4px 0}
#panel input[type=range]{flex:1;accent-color:var(--o)}
#panel button{border:0;border-radius:10px;padding:6px 10px;font:inherit;font-weight:700;
  background:linear-gradient(180deg,var(--y),var(--o));color:#4a2400;cursor:pointer}

/* --- HUD corners --- */
.hudGroup{position:fixed;z-index:10;display:flex;gap:5px;padding:5px;
  background:rgba(255,255,255,.3);backdrop-filter:blur(14px);border-radius:18px;
  border:1px solid rgba(255,255,255,.45);box-shadow:0 8px 24px rgba(120,50,0,.22);
  user-select:none;touch-action:none}
#hudL{left:max(10px,env(safe-area-inset-left));
  bottom:max(80px,calc(env(safe-area-inset-bottom) + 80px))}
#hudR{right:max(10px,env(safe-area-inset-right));
  bottom:max(80px,calc(env(safe-area-inset-bottom) + 80px));flex-direction:column}
.hudGroup button{border:1.5px solid var(--stroke);background:rgba(255,255,255,.5);
  backdrop-filter:blur(12px);border-radius:12px;padding:6px 8px;font:inherit;
  font-size:11px;font-weight:700;color:inherit;cursor:pointer;min-width:34px;min-height:34px;
  display:inline-flex;align-items:center;justify-content:center;gap:3px}
.hudGroup button:active{transform:scale(.92)}
.hudGroup button.on{background:linear-gradient(180deg,var(--y),var(--o));color:#fff}
.hudGroup.mini button span.lbl{display:none}

/* --- DJ pult (1/3 screen when expanded) --- */
#dock{position:fixed;z-index:9;left:50%;bottom:max(10px,env(safe-area-inset-bottom));
  transform:translateX(-50%);width:min(96vw,440px);height:50px;border-radius:26px;
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:rgba(255,255,255,.42);backdrop-filter:blur(24px);
  border:1.5px solid var(--stroke);box-shadow:0 12px 34px rgba(120,50,0,.3);
  touch-action:pan-x;transition:height .3s,width .3s,border-radius .3s}
@media (orientation:landscape){#dock{width:min(92vw,1000px)}}
#dock .row1{display:flex;align-items:center;gap:6px;flex:0 0 auto;width:100%}
#dock .cov{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  font-size:18px;background:linear-gradient(140deg,#fff3d0,var(--o));
  box-shadow:inset 0 1px 0 #fff;overflow:hidden}
#dock .cov img,#dock .cov video{width:100%;height:100%;object-fit:cover}
#dock .meta{flex:1;min-width:0;line-height:1.1}
#dock .meta b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock .meta span{font-size:9px;opacity:.7}
#dock button{border:0;background:transparent;font-size:16px;padding:3px 5px;cursor:pointer;
  color:var(--ink);border-radius:8px}
#dock button:active{background:rgba(255,255,255,.3)}
#dock .seek{position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.5);overflow:hidden}
#dock .seek i{display:block;height:100%;width:0;background:var(--o)}
#dock.expanded{height:min(33vh,300px);width:min(96vw,440px);border-radius:22px;
  flex-direction:column;align-items:stretch;padding:10px;bottom:max(10px,env(safe-area-inset-bottom))}
#dock.expanded .dj{display:flex}
.dj{display:none;flex:1;flex-direction:column;gap:5px;margin-top:6px;min-height:0}
.dj .rainbowFrame{position:absolute;inset:0;border-radius:20px;padding:2px;
  background:var(--rainbow);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  animation:rainbowSpin 6s linear infinite}
@keyframes rainbowSpin{to{filter:hue-rotate(360deg)}}
.dj .row{display:flex;gap:5px;align-items:center;position:relative;z-index:2}
.dj .labels{flex:0 0 auto;font-size:9px;font-weight:800;opacity:.75;width:44px}
.dj .slider{flex:1;accent-color:var(--o)}
.dj .chip{flex:0 0 auto;font-size:9px;font-weight:700;padding:4px 7px;border-radius:8px;
  background:rgba(255,255,255,.55);cursor:pointer;border:1px solid rgba(255,255,255,.7)}
.dj .chip.on{background:linear-gradient(180deg,var(--y),var(--o));color:#fff}
.dj .voiceList{flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto;
  background:rgba(255,255,255,.35);border-radius:12px;padding:6px;font-size:10px;font-weight:600;min-height:0}
.dj .voiceList::-webkit-scrollbar{display:none}
.dj .vrow{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:8px;
  background:rgba(255,255,255,.55)}
.dj .vrow button{border:0;background:transparent;cursor:pointer;font-size:12px;padding:2px 3px;color:inherit}
.dj .bigbtn{flex:1;padding:9px;border-radius:12px;border:0;cursor:pointer;
  font:inherit;font-weight:800;font-size:11px;color:#3a1e00;
  background:linear-gradient(180deg,var(--y),var(--o))}
.dj .bigbtn.rec{background:linear-gradient(180deg,#ff5a5a,#c00);color:#fff;
  animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{50%{box-shadow:0 0 0 6px rgba(255,60,60,.25)}}
/* vinyl rings */
.vinyl{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);
  width:180px;height:180px;border-radius:50%;pointer-events:none;opacity:.18;
  background:repeating-radial-gradient(circle at center,#000 0 2px,#222 2px 4px);
  animation:spin 4s linear infinite;z-index:0}

/* --- Overlays --- */
.ov{position:fixed;inset:0;z-index:70;display:none;place-items:center;
  background:rgba(40,15,0,.55);backdrop-filter:blur(14px);padding:16px}
.ov.on{display:grid}
.ovPanel{width:min(92vw,480px);max-height:80vh;overflow-y:auto;padding:18px;border-radius:20px;
  background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,255,255,.6));
  box-shadow:0 20px 60px rgba(120,50,0,.5);
  border:1.5px solid rgba(255,255,255,.8);display:flex;flex-direction:column;gap:8px}
.ovPanel h3{margin:0 0 4px 0;font-size:15px}
.ovPanel button{border:0;border-radius:12px;padding:10px;font:inherit;font-weight:700;
  cursor:pointer;background:linear-gradient(180deg,var(--y),var(--o));color:#3a1e00}
.ovPanel button.ghost{background:rgba(255,255,255,.5);color:var(--ink);
  box-shadow:inset 0 0 0 1.5px var(--stroke)}
.ovPanel small{opacity:.7;font-size:10px;text-align:center}

/* preview modal */
#pvBox{width:min(96vw,640px);height:min(88vh,760px);background:#fff;border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;border:1.5px solid var(--stroke);
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#pvHead{flex:0 0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(255,210,63,.6),rgba(255,138,31,.4));
  font-size:12px;font-weight:700}
#pvHead button{margin-left:auto;border:0;background:rgba(255,255,255,.6);border-radius:8px;
  padding:4px 8px;font:inherit;font-size:12px;cursor:pointer;color:inherit}
#pvBody{flex:1;overflow:auto;background:#111;display:grid;place-items:center}
#pvBody iframe,#pvBody img,#pvBody video,#pvBody model-viewer{width:100%;height:100%;border:0;
  object-fit:contain;background:#111}
#pvBody pre{color:#eee;font-size:12px;padding:14px;white-space:pre-wrap;text-align:left;
  width:100%;height:100%;overflow:auto;background:#111;margin:0}

/* char card modal */
.holo{width:min(86vw,330px);aspect-ratio:5/7;border-radius:24px;position:relative;
  background:linear-gradient(150deg,rgba(150,90,255,.55),rgba(255,255,255,.2));
  border:1.5px solid rgba(220,190,255,.85);backdrop-filter:blur(20px);
  box-shadow:0 0 60px rgba(150,90,255,.55);padding:14px;display:flex;flex-direction:column;
  gap:8px;color:#fff}
.holo .suit{position:absolute;top:8px;font-size:20px;opacity:.9}
.holo .suit.l{left:12px}.holo .suit.r{right:12px;transform:rotate(180deg)}
.holo .pic{flex:0 0 40%;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.15);
  display:grid;place-items:center;font-size:48px}
.holo .pic img{width:100%;height:100%;object-fit:cover}
.holo textarea{flex:1;border:0;border-radius:12px;padding:8px;resize:none;
  font:inherit;font-size:11px;background:rgba(255,255,255,.18);color:#fff}
.holo textarea::placeholder{color:rgba(255,255,255,.6)}
.holo .row{display:flex;gap:6px}
.holo button{flex:1;border:0;border-radius:12px;padding:8px;font:inherit;font-weight:700;
  cursor:pointer;background:rgba(255,255,255,.9);color:#4a1e6b;font-size:11px}

/* Themes row */
.themeRow{display:flex;gap:4px;flex-wrap:wrap;padding:6px 0;font-size:10px}
.themeRow .tchip{padding:4px 8px;border-radius:8px;cursor:pointer;font-weight:700;
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.55)}
.themeRow .tchip.on{background:linear-gradient(180deg,var(--y),var(--o));color:#fff}

/* toast */
#toast{position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);
  padding:9px 15px;border-radius:12px;background:rgba(60,25,0,.9);color:#fff;
  font-size:11px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
input[type=file]{display:none}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
/* ============================================================
   HOLO RABBIT LAB v0.4
   ============================================================ */
const $ = s => document.querySelector(s);
const USERNAME = 'worldpeacebtn';
const THEMES = ['t-hearts','t-spades','t-nature','t-animal','t-insect','t-cyber','t-eco','t-neon','t-paper'];
const THEME_SUIT = {'t-hearts':['♥','♥'],'t-spades':['♠','♠'],'t-nature':['🌿','🌸'],
  't-animal':['🐰','🐾'],'t-insect':['🐝','🦋'],'t-cyber':['◢','◣'],
  't-eco':['🌱','♻'],'t-neon':['✧','✧'],'t-paper':['✦','✦']};

const state = {
  hue: parseFloat(localStorage.getItem('holo.hue')||'0'),
  repos: JSON.parse(localStorage.getItem('holo.repos')||'null'),
  openRepo: null,
  cachedFiles: {},
  items: JSON.parse(localStorage.getItem('holo.items')||'[]'),
  foils: JSON.parse(localStorage.getItem('holo.foils')||'[]'),
  cardSets: JSON.parse(localStorage.getItem('holo.sets')||'{}'),
  uploads: [],           // user uploaded blobs: {id, name, kind, url, blob}
  playlist: [],
  voices: [],
  ti:0, edit:false, mini:false, sel:null, mode:null,
  currentTheme: localStorage.getItem('holo.cardTheme') || 't-hearts',
  filter:'none', filterNode:null,
  activeFoilZ: 20
};
const saveAll = () => {
  localStorage.setItem('holo.items', JSON.stringify(state.items));
  localStorage.setItem('holo.foils', JSON.stringify(state.foils));
  localStorage.setItem('holo.sets', JSON.stringify(state.cardSets));
  localStorage.setItem('holo.hue', state.hue);
  localStorage.setItem('holo.cardTheme', state.currentTheme);
  if(state.repos) localStorage.setItem('holo.repos', JSON.stringify(state.repos));
};
const toast = t => { const e=$('#toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1500); };
const esc = s => String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ---------- HUE ---------- */
document.documentElement.style.setProperty('--hue', state.hue);
const hueCircle = $('#hueCircle'), hueDot = $('#hueDot');
function setHueFromEvent(e){
  const r = hueCircle.getBoundingClientRect();
  const cx = r.left+r.width/2, cy = r.top+r.height/2;
  let ang = Math.atan2(e.clientY-cy, e.clientX-cx) * 180/Math.PI + 90;
  if(ang<0) ang += 360;
  state.hue = ang;
  document.documentElement.style.setProperty('--hue', ang);
  hueDot.style.transform = `rotate(${ang}deg) translateY(-13px)`;
  saveAll();
}
hueDot.style.transform = `rotate(${state.hue}deg) translateY(-13px)`;
let hueDrag=false;
hueCircle.addEventListener('pointerdown',e=>{hueDrag=true; hueCircle.setPointerCapture(e.pointerId); setHueFromEvent(e);});
hueCircle.addEventListener('pointermove',e=>{ if(hueDrag) setHueFromEvent(e); });
hueCircle.addEventListener('pointerup',()=>hueDrag=false);

/* ---------- PARALLAX CLOUDS ---------- */
const clouds=[];
for(let i=0;i<8;i++){
  const c=document.createElement('div'); c.className='cloud';
  const s=180+Math.random()*380;
  c.style.width=s+'px'; c.style.height=s*0.55+'px';
  c.style.left=(Math.random()*120-10)+'vw';
  c.style.top=(Math.random()*100)+'vh';
  c.style.opacity=(.3+Math.random()*.5).toFixed(2);
  document.body.appendChild(c);
  clouds.push({el:c, sp:.06+Math.random()*.22});
}
let cy=0, sy=0;
addEventListener('scroll',()=>sy=scrollY,{passive:true});
$('#screen').addEventListener('scroll',e=>sy=e.target.scrollTop,{passive:true});
(function loop(){
  cy += (sy-cy)*0.08;
  clouds.forEach(c=>{ c.el.style.transform=`translate3d(0,${-cy*c.sp - (performance.now()*0.004*c.sp*10)%200}px,0)`; });
  requestAnimationFrame(loop);
})();

/* ---------- REPOS (lazy) ---------- */
async function loadRepos(force){
  const decks=$('#decks');
  if(state.repos && !force){ renderDecks(); return; }
  decks.innerHTML = `<div style="margin:auto;font-size:11px;opacity:.7;padding:10px">⏳ loading…</div>`;
  try{
    const r = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const repos = await r.json();
    if(!Array.isArray(repos)) throw new Error('bad response');
    state.repos = repos.map(rp=>{
      let base = rp.homepage;
      if(!base || !base.startsWith('http')) base = `https://${USERNAME}.github.io/${rp.name}`;
      return { name: rp.name, base: base.replace(/\/+$/,''), desc: rp.description||'' };
    });
    saveAll(); renderDecks();
  }catch(e){
    decks.innerHTML = `<div style="margin:auto;font-size:11px;padding:10px;color:#f0883e">❌ ${e.message}</div>`;
  }
}
$('#bReset').onclick = () => { if(confirm('Reset everything?')){ localStorage.clear(); location.reload(); } };
$('#newSet').onclick = () => {
  const name = prompt('New set name:');
  if(!name) return;
  state.cardSets['__user_'+name] = { name, cards: [] };
  saveAll(); renderDecks(); toast('set created');
};

/* ---------- DECKS as square grid ---------- */
function renderDecks(){
  const d=$('#decks'); d.innerHTML='';
  // user sets first
  Object.entries(state.cardSets).forEach(([k,v])=>{
    if(!k.startsWith('__user_')) return;
    const c=document.createElement('div'); c.className='sqCard';
    c.innerHTML = `<div class="emo">📦</div><div class="nm">${esc(v.name||k)}</div>`;
    c.onclick = () => openUserSet(k);
    d.appendChild(c);
  });
  // repos
  (state.repos||[]).forEach(rp=>{
    const c=document.createElement('div'); c.className='sqCard';
    const em = pickEmoji(rp.name);
    c.innerHTML = `<div class="emo">${em}</div><div class="nm">${esc(rp.name)}</div>`;
    c.onclick = () => openDeck(rp);
    d.appendChild(c);
  });
  // add tile
  const add=document.createElement('div'); add.className='sqCard add';
  add.innerHTML = '<div class="emo">＋</div><div class="nm">upload</div>';
  add.onclick = () => $('#fUp').click();
  d.appendChild(add);
}
function pickEmoji(s){
  const set=['📁','🎴','🌐','✨','🧡','🎮','📖','🎵','🌀','🌸','🐝','🌿'];
  let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0;
  return set[h%set.length];
}

/* ---------- UPLOAD: universal media ---------- */
function kindOf(file){
  const n = file.name.toLowerCase();
  const t = file.type||'';
  if(t.startsWith('image/') || /\.(png|jpe?g|gif|webp|heic|hvec|avif|bmp|svg)$/.test(n)) return 'image';
  if(t.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv)$/.test(n)) return 'video';
  if(t.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|opus|aac|flac)$/.test(n)) return 'audio';
  if(/\.(glb|gltf)$/.test(n)) return '3d';
  if(/\.pdf$/.test(n)) return 'pdf';
  if(t.startsWith('text/') || /\.(txt|md|json|csv|html?|css|js|xml|log)$/.test(n)) return 'text';
  return 'file';
}
$('#fUp').onchange = e => {
  [...e.target.files].forEach((f,i)=>{
    const k = kindOf(f);
    const url = URL.createObjectURL(f);
    state.uploads.push({ id:'u'+Date.now()+i, name:f.name, kind:k, url, blob:f });
  });
  renderShelves(); toast(state.uploads.length+' items uploaded');
  e.target.value='';
};

/* ---------- SHELVES (left/right of infinity table) ---------- */
function renderShelves(){
  const L=$('#shelfL'), R=$('#shelfR');
  L.innerHTML=''; R.innerHTML='';
  state.uploads.forEach((u,i)=>{
    const c=document.createElement('div'); c.className='shelfCard';
    c.textContent = u.kind==='image'?'🖼':u.kind==='video'?'🎬':u.kind==='audio'?'🎵'
      :u.kind==='3d'?'🧊':u.kind==='pdf'?'📄':u.kind==='text'?'📝':'📦';
    c.title = u.name;
    c.onclick = () => previewMedia(u);
    (i%2?R:L).appendChild(c);
  });
}

/* ---------- OPEN DECK ---------- */
async function openDeck(rp){
  if(!state.cachedFiles[rp.name]){
    try{
      const r = await fetch(`https://api.github.com/repos/${USERNAME}/${rp.name}/contents/`);
      if(!r.ok) state.cachedFiles[rp.name] = [];
      else {
        const files = await r.json();
        state.cachedFiles[rp.name] = Array.isArray(files) ? files.filter(f =>
          f.type==='file' && /\.(html?|png|jpe?g|gif|mp4|mp3|m4a|pdf|glb|txt)$/i.test(f.name)
        ) : [];
      }
    }catch(e){ state.cachedFiles[rp.name] = []; }
  }
  state.openRepo = rp;
  renderStage(rp, state.cachedFiles[rp.name]);
  $('#stageWrap').classList.add('on');
}
function openUserSet(key){
  const set = state.cardSets[key];
  if(!set) return;
  const uploadsInSet = state.uploads.filter(u => (set.cards||[]).includes(u.id));
  renderStage({name:set.name, base:''}, uploadsInSet, true);
  state.openRepo = { name: key, base:'', _userSet:true };
  $('#stageWrap').classList.add('on');
}
function renderStage(rp, items, isUser){
  $('#stageTitle').textContent = '🎴 '+rp.name;
  const g=$('#stageGrid'); g.innerHTML='';
  if(!items || !items.length){
    g.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;font-size:11px;opacity:.7">no items — upload media or open a repo with content</div>';
    return;
  }
  items.forEach(f=>{
    const card=document.createElement('div');
    card.className = `cardFace ${state.currentTheme}`;
    const suit = THEME_SUIT[state.currentTheme] || ['♥','♥'];
    const name = isUser ? f.name : f.name;
    const thumb = document.createElement('div'); thumb.className='thumb';
    // try thumbnail for image, else emoji
    if(isUser && f.kind==='image'){ const im=document.createElement('img'); im.src=f.url; thumb.appendChild(im); }
    else if(isUser && f.kind==='video'){
      const v=document.createElement('video'); v.src=f.url; v.muted=true; v.playsInline=true; v.autoplay=true; v.loop=true;
      thumb.appendChild(v);
    }
    else {
      const ext = name.split('.').pop().toLowerCase();
      thumb.textContent = ext==='html'?'🌐':ext==='png'||ext==='jpg'||ext==='jpeg'||ext==='gif'?'🖼'
        :ext==='mp4'?'🎬':ext==='mp3'||ext==='m4a'?'🎵':ext==='pdf'?'📄':ext==='glb'?'🧊':ext==='txt'?'📝':'📦';
    }
    card.appendChild(thumb);
    const foot=document.createElement('div'); foot.className='foot'; foot.textContent = name;
    card.appendChild(foot);
    const st=document.createElement('div'); st.className='suitT'; st.textContent=suit[0]; card.appendChild(st);
    const sb=document.createElement('div'); sb.className='suitB'; sb.textContent=suit[1]; card.appendChild(sb);
    card.onclick = () => {
      if(card._dragged) return;
      if(isUser) previewMedia(f);
      else previewRepoFile(rp, f);
    };
    makeCardDraggable(card);
    g.appendChild(card);
  });
}
$('#backDecks').onclick = () => { $('#stageWrap').classList.remove('on'); state.openRepo=null; };
$('#themeBtn').onclick = () => {
  const i = THEMES.indexOf(state.currentTheme);
  state.currentTheme = THEMES[(i+1)%THEMES.length];
  saveAll(); toast(state.currentTheme.replace('t-',''));
  if(state.openRepo){
    const files = state.openRepo._userSet
      ? state.uploads.filter(u => (state.cardSets[state.openRepo.name]?.cards||[]).includes(u.id))
      : state.cachedFiles[state.openRepo.name];
    renderStage(state.openRepo, files, state.openRepo._userSet);
  }
};
$('#zoomBtn').onclick = () => { $('#lab').classList.toggle('zoomed'); };
$('#sortBtn').onclick = () => {
  if(!state.openRepo) return;
  const g = $('#stageGrid');
  const cards=[...g.children];
  cards.sort((a,b)=>a.querySelector('.foot').textContent.localeCompare(b.querySelector('.foot').textContent));
  g.innerHTML=''; cards.forEach(c=>g.appendChild(c));
  toast('sorted');
};

/* drag-to-reorder cards inside stage */
function makeCardDraggable(el){
  let down=false, sx=0, sy=0, idx=0, rail=null;
  el.addEventListener('pointerdown',e=>{
    down=true; sx=e.clientX; sy=e.clientY; el._dragged=false;
    rail = el.parentElement;
    idx = [...rail.children].indexOf(el);
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>8) el._dragged=true;
    el.style.transform = `translate(${dx}px,${dy}px) scale(1.05)`;
    el.style.zIndex=999;
    // find nearest card under cursor (grid)
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const tCard = target && target.closest('.cardFace');
    if(tCard && tCard!==el && tCard.parentElement===rail){
      const tIdx=[...rail.children].indexOf(tCard);
      if(tIdx>idx){ rail.insertBefore(el, tCard.nextSibling); idx=tIdx; }
      else if(tIdx<idx){ rail.insertBefore(el, tCard); idx=tIdx; }
    }
  });
  el.addEventListener('pointerup',()=>{
    down=false; el.style.transform=''; el.style.zIndex='';
    setTimeout(()=>el._dragged=false, 100);
  });
}

/* ---------- UNIVERSAL PREVIEW ---------- */
function previewMedia(u){
  $('#pvTitle').textContent = u.name;
  const b=$('#pvBody'); b.innerHTML='';
  if(u.kind==='image'){ const im=new Image(); im.src=u.url; b.appendChild(im); }
  else if(u.kind==='video'){ const v=document.createElement('video'); v.src=u.url; v.controls=true; v.autoplay=true; v.playsInline=true; b.appendChild(v); }
  else if(u.kind==='audio'){ const a=document.createElement('audio'); a.src=u.url; a.controls=true; a.autoplay=true; a.style.width='90%'; b.appendChild(a); }
  else if(u.kind==='pdf'){ const ifr=document.createElement('iframe'); ifr.src=u.url; b.appendChild(ifr); }
  else if(u.kind==='3d'){
    const mv=document.createElement('model-viewer');
    mv.setAttribute('src', u.url); mv.setAttribute('camera-controls',''); mv.setAttribute('auto-rotate','');
    b.appendChild(mv);
  }
  else if(u.kind==='text'){
    const pre=document.createElement('pre');
    u.blob.text().then(t=>pre.textContent=t);
    b.appendChild(pre);
  } else {
    b.innerHTML = `<div style="color:#fff;font-size:12px">cannot preview — <a style="color:#aaf" href="${u.url}" download="${esc(u.name)}">download</a></div>`;
  }
  $('#pvOv').classList.add('on');
}
function previewRepoFile(rp, f){
  const url = `${rp.base}/${f.path}`;
  const name = f.name;
  $('#pvTitle').textContent = name;
  const b=$('#pvBody'); b.innerHTML='';
  const ext = name.split('.').pop().toLowerCase();
  if(['html','htm'].includes(ext)){
    const ifr=document.createElement('iframe'); ifr.src=url; b.appendChild(ifr);
  } else if(['png','jpg','jpeg','gif','webp','svg','avif'].includes(ext)){
    const im=new Image(); im.src=url; b.appendChild(im);
  } else if(['mp4','webm','mov','m4v'].includes(ext)){
    const v=document.createElement('video'); v.src=url; v.controls=true; v.autoplay=true; b.appendChild(v);
  } else if(['mp3','m4a','wav','ogg','opus'].includes(ext)){
    const a=document.createElement('audio'); a.src=url; a.controls=true; a.autoplay=true; a.style.width='90%'; b.appendChild(a);
  } else if(ext==='pdf'){
    const ifr=document.createElement('iframe'); ifr.src=url; b.appendChild(ifr);
  } else if(['glb','gltf'].includes(ext)){
    const mv=document.createElement('model-viewer');
    mv.setAttribute('src', url); mv.setAttribute('camera-controls',''); mv.setAttribute('auto-rotate','');
    b.appendChild(mv);
  } else if(['txt','md','json','csv'].includes(ext)){
    fetch(url).then(r=>r.text()).then(t=>{ const pre=document.createElement('pre'); pre.textContent=t; b.appendChild(pre); });
  } else {
    b.innerHTML = `<div style="color:#fff;font-size:12px"><a style="color:#aaf" href="${url}" target="_blank">open externally</a></div>`;
  }
  $('#pvOv').classList.add('on');
}
$('#pvClose').onclick = () => { $('#pvOv').classList.remove('on'); $('#pvBody').innerHTML=''; };
document.querySelectorAll('.ov').forEach(ov=>ov.addEventListener('click',e=>{
  if(e.target===ov && ov.id!=='exOv') ov.classList.remove('on');
}));

$('#bEdit').onclick = () => {
  state.edit=!state.edit; document.body.classList.toggle('edit', state.edit);
  $('#bEdit').classList.toggle('on', state.edit);
  $('#panel').classList.toggle('on', state.edit);
};
$('#bSticker').onclick = () => { state.mode='sticker'; state.edit=true;
  document.body.classList.add('edit'); $('#bEdit').classList.add('on');
  $('#panel').classList.add('on'); toast('tap to drop 🐰'); };
$('#bBubble').onclick = () => { state.mode='bubble'; state.edit=true;
  document.body.classList.add('edit'); $('#bEdit').classList.add('on');
  $('#panel').classList.add('on'); toast('tap for note'); };

$('#stage').addEventListener('pointerdown', e=>{
  if(!state.edit || e.target!==$('#stage')) return;
  const r=$('#stage').getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width*100).toFixed(2);
  const y=((e.clientY-r.top)/r.height*100).toFixed(2);
  if(state.mode==='sticker') addItem({type:'emoji', v:'🐰', x, y, size:16, rot:0});
  if(state.mode==='bubble')  addItem({type:'bubble', v:'note…', x, y, size:14, rot:0});
});
function addItem(o){ o.id='i'+Date.now()+Math.random().toString(36).slice(2,5);
  state.items.push(o); renderItems(); saveAll(); }
function renderItems(){
  const s=$('#stage'); s.innerHTML='';
  state.items.forEach(o=>{
    const d=document.createElement('div'); d.className='item'; d.dataset.id=o.id;
    d.style.left=o.x+'%'; d.style.top=o.y+'%';
    d.style.transform=`translate(-50%,-50%) rotate(${o.rot}deg)`;
    if(o.type==='bubble')
      d.innerHTML=`<div class="bubble" style="font-size:${o.size*0.85}px">${esc(o.v)}</div>`;
    else if(o.src){ d.style.width=o.size+'%'; d.innerHTML=`<img src="${o.src}">`; }
    else d.innerHTML=`<div style="font-size:${o.size*2.4}px;line-height:1">${o.v||'🐰'}</div>`;
    makeItemDraggable(d, o);
    d.onpointerdown = ev => { if(!ev._handled) selectItem(o); };
    s.appendChild(d);
  });
}
function makeItemDraggable(el,o){
  let on=false, sx=0, sy=0, ox=0, oy=0, r=null;
  el.addEventListener('pointerdown',e=>{
    if(!state.edit) return;
    on=true; el.setPointerCapture(e.pointerId);
    r=$('#stage').getBoundingClientRect();
    sx=e.clientX; sy=e.clientY; ox=parseFloat(o.x); oy=parseFloat(o.y);
  });
  el.addEventListener('pointermove',e=>{
    if(!on) return;
    o.x=(ox+(e.clientX-sx)/r.width*100).toFixed(2);
    o.y=(oy+(e.clientY-sy)/r.height*100).toFixed(2);
    el.style.left=o.x+'%'; el.style.top=o.y+'%';
  });
  el.addEventListener('pointerup',()=>{ on=false; saveAll(); });
}
function selectItem(o){
  state.sel=o; $('#panel').classList.add('on');
  $('#psel').textContent = o.type+' '+o.id.slice(-3);
  $('#psize').value=o.size; $('#prot').value=o.rot;
}
['psize','prot'].forEach(id=>{
  $('#'+id).oninput = e => {
    const o=state.sel; if(!o) return;
    const k={psize:'size',prot:'rot'}[id];
    o[k]=parseFloat(e.target.value); renderItems(); selectItem(o); saveAll();
  };
});
$('#pdel').onclick = () => { state.items=state.items.filter(x=>x!==state.sel);
  state.sel=null; $('#panel').classList.remove('on'); renderItems(); saveAll(); };

$('#bQuest').onclick = () => {

  state.uploads.filter(u=>u._char).forEach(c=>{
    const chip=document.createElement('span');

      const t=$('#questScript');

$('#qPlay').onclick = () => {
  const lines = $('#questScript').value.split('\n').filter(Boolean);
  let i=0;
  const next=()=>{
    if(i>=lines.length) return;
    const L = lines[i++];
    if(L.startsWith('@wait')){ setTimeout(next, parseFloat(L.split(' ')[1]||2)*1000); return; }
    if(L.startsWith('@media')){
      const fn = L.slice(7).trim();
      const u = state.uploads.find(x=>x.name===fn);
      if(u) previewMedia(u);
      setTimeout(next, 600); return;
    }
    const m = L.match(/^([^:]+):\s*(.+)$/);
    if(m){
      const ch=m[1].trim(), txt=m[2].trim();
      addItem({type:'bubble', v:ch+': '+txt, x:50, y:20+i*8, size:14, rot:0});
    }
    setTimeout(next, 1400);
  };
  next();
};

/* ---------- FOILS (z-swap on click) ---------- */
function renderFoils(){
  const f=$('#foils'); f.innerHTML='';
  state.foils.forEach((foil,i)=>{
    const d=document.createElement('div'); d.className='foil';
    d.style.left=foil.x+'%'; d.style.top=foil.y+'%';
    d.style.width=foil.w+'%'; d.style.height=foil.h+'%';
    d.style.zIndex = foil.z || (20+i);
    d.innerHTML = `
      <div class="foil-bar">
        <span class="name">📌 ${esc(foil.name)}</span>
        <button class="up" title="raise">▲</button>
        <button class="close" title="close">✕</button>
      </div>
      <div class="foil-body"></div>`;
    const body=d.querySelector('.foil-body');
    if(foil.url){
      if(/\.(mp4|webm|mov)$/i.test(foil.url) || foil.kind==='video'){
        const v=document.createElement('video'); v.src=foil.url; v.controls=true; v.autoplay=true;
        v.muted=true; v.playsInline=true; v.loop=true; body.appendChild(v);
      } else if(/\.(png|jpe?g|gif|webp)$/i.test(foil.url) || foil.kind==='image'){
        const im=new Image(); im.src=foil.url; body.appendChild(im);
      } else {
        const ifr=document.createElement('iframe'); ifr.src=foil.url; ifr.loading='lazy'; body.appendChild(ifr);
      }
    }
    d.querySelector('.close').onclick = e => { e.stopPropagation();
      state.foils.splice(i,1); renderFoils(); saveAll(); };
    d.querySelector('.up').onclick = e => { e.stopPropagation();
      foil.z = ++state.activeFoilZ; renderFoils(); saveAll(); };
    // click anywhere on foil raises it (Disney foil lift)
    d.addEventListener('pointerdown',()=>{ foil.z = ++state.activeFoilZ; saveAll();
      d.style.zIndex = foil.z; });
    makeFoilDraggable(d, foil);
    f.appendChild(d);
  });
}
function makeFoilDraggable(el, foil){
  const bar = el.querySelector('.foil-bar');
  let down=false, sx=0, sy=0, ox=0, oy=0;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.tagName==='BUTTON') return;
    down=true; sx=e.clientX; sy=e.clientY; ox=foil.x; oy=foil.y;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove',e=>{
    if(!down) return;
    const r=$('#screen').getBoundingClientRect();
    foil.x = Math.max(0, Math.min(100-foil.w, ox + (e.clientX-sx)/r.width*100));
    foil.y = Math.max(0, Math.min(100-foil.h, oy + (e.clientY-sy)/r.height*100));
    el.style.left=foil.x+'%'; el.style.top=foil.y+'%';
  });
  bar.addEventListener('pointerup',()=>{ down=false; saveAll(); });
}

/* ---------- DJ PULT ---------- */
const au=$('#au'), vu=$('#vu');
let actx=null, srcNode=null, anNode=null, lowEQ=null, midEQ=null, highEQ=null, volNode=null;
function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  srcNode = actx.createMediaElementSource(au);
  lowEQ = actx.createBiquadFilter(); lowEQ.type='lowshelf'; lowEQ.frequency.value=200;
  midEQ = actx.createBiquadFilter(); midEQ.type='peaking';  midEQ.frequency.value=1000; midEQ.Q.value=1;
  highEQ= actx.createBiquadFilter(); highEQ.type='highshelf'; highEQ.frequency.value=4000;
  anNode = actx.createAnalyser(); anNode.fftSize=128;
  volNode= actx.createGain();
  srcNode.connect(lowEQ).connect(midEQ).connect(highEQ).connect(anNode).connect(volNode).connect(actx.destination);
  pulseLoop();
}
['eqLow','eqMid','eqHigh','vol'].forEach(id=>{
  $('#'+id).oninput = e => {
    if(!actx) initAudio();
    const v = parseFloat(e.target.value);
    if(id==='eqLow')  lowEQ.gain.value=v;
    if(id==='eqMid')  midEQ.gain.value=v;
    if(id==='eqHigh') highEQ.gain.value=v;
    if(id==='vol')    volNode.gain.value=v/100;
  };
});
document.querySelectorAll('#filterRow .chip').forEach(c=>{
  c.onclick = () => {
    document.querySelectorAll('#filterRow .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    state.filter = c.dataset.f;
    if(!actx) initAudio();
    const f = {none:20000, robot:800, ghost:2000, deep:400}[state.filter] || 20000;
    if(state.filter==='none'){ highEQ.frequency.value=4000; midEQ.frequency.value=1000; lowEQ.frequency.value=200; }
    else { highEQ.frequency.value=f; }
    toast('fx: '+state.filter);
  };
});
document.querySelector('#filterRow .chip[data-f="none"]').classList.add('on');

$('#addm').onclick = () => $('#fAudio').click();
$('#fAudio').onchange = e => {
  [...e.target.files].forEach(f=>{
    const kind = f.type.startsWith('video')?'video':'audio';
    state.playlist.push({name:f.name, url:URL.createObjectURL(f), kind, blob:f});
  });
  if(state.playlist.length && !au.src) loadTrack(0);
  toast(state.playlist.length+' tracks');
  e.target.value='';
};
function loadTrack(i){
  if(!state.playlist.length) return;
  state.ti = (i+state.playlist.length)%state.playlist.length;
  const t = state.playlist[state.ti];
  $('#title').textContent = t.name.replace(/\.[^.]+$/,'');
  $('#sub').textContent = (state.ti+1)+' / '+state.playlist.length+' · '+t.kind;
  const cov=$('#cov'); cov.innerHTML='';
  if(t.kind==='video'){
    const v=document.createElement('video'); v.src=t.url; v.muted=true; v.playsInline=true;
    v.autoplay=true; v.loop=true; cov.appendChild(v);
  } else cov.textContent = ['🐰','🧡','✨','🌙','🍊'][state.ti%5];
  if(t.kind==='audio') au.src = t.url;
}
$('#play').onclick = () => {
  if(!actx) initAudio();
  if(au.paused){ au.play(); $('#play').textContent='⏸'; } else { au.pause(); $('#play').textContent='▶'; }
};
$('#next').onclick = () => { loadTrack(state.ti+1); if(actx){ au.play(); $('#play').textContent='⏸'; } };
$('#prev').onclick = () => { loadTrack(state.ti-1); if(actx){ au.play(); $('#play').textContent='⏸'; } };
au.ontimeupdate = () => { if(au.duration) $('#bar').style.width=(au.currentTime/au.duration*100)+'%'; };
au.onended = () => $('#next').click();

let dsk=null;
$('#dock').addEventListener('pointerdown',e=>{ if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return; dsk=e.clientX; });
$('#dock').addEventListener('pointerup',e=>{
  if(dsk===null) return; const d=e.clientX-dsk; dsk=null;
  if(d<-50) $('#next').click(); else if(d>50) $('#prev').click();
});
$('#expand').onclick = () => {
  const d=$('#dock'); d.classList.toggle('expanded');
  $('#expand').textContent = d.classList.contains('expanded')?'⤡':'⤢';
};

/* ---------- VOICE RECORD (FIXED replay) ---------- */
let mediaRec=null, chunks=[];
$('#recBtn').onpointerdown = async e => {
  e.preventDefault();
  if(mediaRec && mediaRec.state==='recording') return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec = new MediaRecorder(stream); chunks=[];
    mediaRec.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
    mediaRec.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type: mediaRec.mimeType||'audio/webm'});
      const url = URL.createObjectURL(blob);   // do NOT revoke — fix for vanish bug
      state.voices.push({ id:'v'+Date.now(), url, blob, filter:state.filter, name:'voice '+(state.voices.length+1) });
      renderVoices();
      toast('voice clip added');
    };
    mediaRec.start();
    $('#recBtn').classList.add('rec');
    $('#recBtn').textContent='🎙 recording…';
  }catch(e){ toast('mic blocked'); }
};
$('#recBtn').onpointerup = () => {
  if(mediaRec && mediaRec.state==='recording'){
    mediaRec.stop();
    $('#recBtn').classList.remove('rec');
    $('#recBtn').textContent='🎙 hold to record voice';
  }
};
function renderVoices(){
  const v=$('#voiceList'); v.innerHTML='';
  if(!state.voices.length){
    v.innerHTML='<div style="opacity:.6;text-align:center;padding:10px 0;font-size:10px">no voice clips yet</div>';
    return;
  }
  state.voices.forEach((vc,i)=>{
    const row=document.createElement('div'); row.className='vrow';
    row.innerHTML = `<span>🎙 ${esc(vc.name)}</span>
      <span style="flex:1"></span>
      <span style="font-size:9px;opacity:.7">${vc.filter}</span>
      <button class="pl" title="play">▶</button>
      <button class="dl" title="download">⤓</button>
      <button class="rm" title="del">✕</button>`;
    row.querySelector('.pl').onclick = () => {
      // FIX: reuse single voice element, reset src, keep blob URL alive
      vu.pause();
      vu.src = vc.url;
      vu.currentTime = 0;
      vu.play().catch(()=>toast('play failed'));
    };
    row.querySelector('.dl').onclick = () => {
      const a=document.createElement('a'); a.href=vc.url; a.download=vc.name+'.webm'; a.click();
    };
    row.querySelector('.rm').onclick = () => { state.voices.splice(i,1); renderVoices(); };
    v.appendChild(row);
  });
}
renderVoices();

/* ---------- AUDIO-REACTIVE LOOP ---------- */
function pulseLoop(){
  const data=new Uint8Array(anNode.frequencyBinCount);
  (function loop(){
    anNode.getByteFrequencyData(data);
    const avg=data.reduce((a,b)=>a+b,0)/data.length/255;
    document.documentElement.style.setProperty('--pulse',(0.15+avg*1.1).toFixed(3));
    requestAnimationFrame(loop);
  })();
}

/* ---------- EXPORT ---------- */
$('#exTrigger').onclick = () => $('#exOv').classList.add('on');
$('#exClose').onclick = () => $('#exOv').classList.remove('on');
function coord(i){ return `X${i%9}Y${Math.floor(i/9)%9}Z${Math.floor(i/81)}`; }
function download(name,data){
  const a=document.createElement('a'); a.href=URL.createObjectURL(data); a.download=name; a.click();
}
$('#exTxt').onclick = () => {
  const lines=['=== HOLO RABBIT LAB v0.4 · TRANSCRIPT ===', 'saved: '+new Date().toISOString(),
    'hue: '+state.hue, 'cardTheme: '+state.currentTheme, '', '--- stage items ---'];
  state.items.forEach((o,i)=>lines.push(
    `${coord(i)} fish=${o.type} x=${o.x} y=${o.y} size=${o.size} rot=${o.rot} v="${(o.v||'').replace(/"/g,"'")}"`));
  lines.push('','--- uploads ---');
  state.uploads.forEach((u,i)=>lines.push(`${coord(i)} rabbit=${u.kind} name="${u.name}"`));
  lines.push('','--- card sets ---');
  Object.entries(state.cardSets).forEach(([k,v])=>lines.push(`${k} = ${JSON.stringify(v)}`));
  download('holo_transcript.txt', new Blob([lines.join('\n')],{type:'text/plain'}));
  toast('txt saved');
};
$('#exJson').onclick = () => {
  const json = {format:'HOLO-RABBIT', version:'0.4', saved:new Date().toISOString(),
    hue: state.hue, cardTheme: state.currentTheme,
    items: state.items, foils: state.foils, cardSets: state.cardSets,
    legend:{rabbit:'app',fish:'sticker',bird:'foil'}};
  download('holo_settings.json', new Blob([JSON.stringify(json,null,1)],{type:'application/json'}));
  toast('json saved');
};
$('#exZip').onclick = async () => {
  if(!window.JSZip) return toast('JSZip offline');
  const zip=new JSZip();
  const json = {format:'HOLO-RABBIT', version:'0.4', saved:new Date().toISOString(),
    hue: state.hue, cardTheme: state.currentTheme,
    items: state.items, foils: state.foils, cardSets: state.cardSets};
  state.playlist.forEach((t,i)=>zip.file(`media/${coord(i)}_${t.name}`, t.blob));
  state.voices.forEach((v,i)=>zip.file(`voices/${coord(i)}_${v.name}.webm`, v.blob));
  state.uploads.forEach((u,i)=>zip.file(`uploads/${coord(i)}_${u.name}`, u.blob));
  zip.file('HOLO.json', JSON.stringify(json,null,1));
  const out = await zip.generateAsync({type:'blob'});
  download('holo_pack.zip', out);
  toast('zip saved');
};

setInterval(()=>{
  const d=new Date();
