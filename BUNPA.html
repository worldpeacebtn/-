<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Holo Hive · v0.8</title>
<style>
:root{
  --hue:0;
  --o:hsl(30 100% 55%); --y:hsl(45 100% 60%);
  --ink:#ffe4c0; --inkSoft:#ffb070;
  --bg0:#0a0400; --bg1:#180800;
  --win:rgba(28,12,0,.72); --winBorder:rgba(255,150,60,.55);
  --winHi:rgba(255,200,120,.18);
  --card:#fff6ea; --cardInk:#3a1e00;
  --gold:#ffcc55;
  --neonA:#ff4dff; --neonB:#4dffff; --neonC:#ffee4d; --neonD:#4dff88;
  --rainbow:conic-gradient(from 0deg,#ff4d4d,#ffb84d,#ffee4d,#4dff88,#4dd2ff,#a64dff,#ff4dd2,#ff4d4d);
  --pulse:.35;
}
body[data-mode="rbg"]{
  --bg0:#080000; --bg1:#180000;
  --win:rgba(18,0,0,.85); --winBorder:rgba(255,204,85,.6);
  --card:#ffe9a8; --cardInk:#1a0000;
  --ink:#ffcc55; --inkSoft:#c98a2a;
  --o:#ffcc55; --y:#ffe9a8; --gold:#ffe9a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);overscroll-behavior:none;touch-action:manipulation;user-select:none;
  background:var(--bg0);transition:background .4s}

/* --- Background layers --- */
#bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(80% 60% at 50% 0%, var(--bg1) 0%, var(--bg0) 70%)}
#spheres{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.sphere{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;
  will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.sphere.s1{width:55vw;height:55vw;left:5%;top:10%;background:radial-gradient(circle,rgba(255,140,60,.55),transparent 70%)}
.sphere.s2{width:45vw;height:45vw;right:5%;top:25%;background:radial-gradient(circle,rgba(160,80,255,.5),transparent 70%)}
.sphere.s3{width:60vw;height:60vw;left:20%;bottom:-10%;background:radial-gradient(circle,rgba(255,220,80,.35),transparent 70%)}
.sphere.s4{width:40vw;height:40vw;right:20%;bottom:0%;background:radial-gradient(circle,rgba(80,255,200,.35),transparent 70%)}
#bgGrid{position:fixed;inset:0;z-index:2;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,150,60,calc(.05 + var(--pulse)*.14)) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,150,60,calc(.05 + var(--pulse)*.14)) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at center,#000 20%,transparent 100%);
  -webkit-mask-image:radial-gradient(circle at center,#000 20%,transparent 100%)}
#hexGrid{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;
  opacity:calc(.35 + var(--pulse)*.5)}
body[data-grid="hex"] #hexGrid{display:block}
body[data-grid="hex"] #bgGrid{opacity:0}
#camBg{position:fixed;inset:0;z-index:3;display:none;overflow:hidden}
#camBg video{width:100%;height:100%;object-fit:cover;filter:hue-rotate(calc(var(--hue)*1deg))}
#camBg.overlay::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle,transparent 30%,rgba(0,0,0,.55) 90%)}
body[data-camBg="on"] #camBg{display:block}
#grain{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.85'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

/* --- Wabe (hex) base --- */
.hex{width:44px;height:44px;position:relative;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(155deg,rgba(255,200,120,.28),rgba(255,120,40,.08));
  border:0;font-size:18px;color:var(--ink);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  transition:transform .15s,filter .15s;
  box-shadow:inset 0 0 0 1.5px rgba(255,180,80,.55);
  backdrop-filter:blur(8px)}
.hex::before{content:"";position:absolute;inset:0;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  background:linear-gradient(155deg,rgba(255,255,255,.35),transparent 60%);
  pointer-events:none;z-index:0}
.hex::after{content:"";position:absolute;inset:0;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);pointer-events:none}
.hex>*{position:relative;z-index:1}
.hex:active{transform:scale(.9)}
.hex.on{background:linear-gradient(155deg,var(--y),var(--o));color:#3a1e00}
.hex svg,.hex img,.hex video{width:65%;height:65%;object-fit:contain;pointer-events:none}
.hex.big{width:56px;height:56px;font-size:22px}
.hex.sm{width:36px;height:36px;font-size:14px}
.hex.glass{background:linear-gradient(155deg,rgba(255,200,120,.4),rgba(255,120,40,.15));
  box-shadow:inset 0 0 0 1.5px rgba(255,220,150,.85),0 0 14px rgba(255,150,60,.4);
  backdrop-filter:blur(12px) saturate(1.3)}
.hex.glass.neon{box-shadow:inset 0 0 0 1.5px rgba(255,220,150,.9),
  inset 0 0 12px rgba(255,140,220,.5),
  0 0 14px rgba(255,150,60,.5),
  0 0 30px rgba(255,100,255,.35)}
.hex.glass.rainbow{position:relative}
.hex.glass.rainbow::after{content:"";position:absolute;inset:0;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  padding:2px;
  background:var(--rainbow);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:rbSpin 8s linear infinite;
  box-shadow:none;
  pointer-events:none}
@keyframes rbSpin{to{filter:hue-rotate(360deg)}}
.hex .badge{position:absolute;top:4px;right:6px;font-size:8px;padding:1px 4px;border-radius:5px;
  background:rgba(0,0,0,.6);color:var(--gold);font-weight:800;z-index:2}
.hex.dragging{opacity:.9;z-index:999;position:fixed;pointer-events:none}

/* --- Corner honeycomb cluster --- */
#hiveCorner{position:fixed;z-index:60;right:max(10px,env(safe-area-inset-right));
  bottom:max(10px,env(safe-area-inset-bottom));width:60px;height:60px}
body[data-lefty="on"] #hiveCorner{right:auto;left:max(10px,env(safe-area-inset-left))}
#hiveToggle{position:absolute;right:0;bottom:0;width:56px;height:56px;z-index:61;
  background:linear-gradient(155deg,rgba(255,200,120,.5),rgba(255,120,40,.25));
  box-shadow:inset 0 0 0 2px rgba(255,220,150,.9),
    0 0 20px rgba(255,150,60,.6),
    inset 0 0 20px rgba(255,140,220,.35)}
#hiveToggle.open{transform:rotate(45deg)}
body[data-lefty="on"] #hiveToggle{right:auto;left:0}
.hiveSlot{position:absolute;right:0;bottom:0;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s;
  opacity:0;pointer-events:none}
#hiveToggle.open ~ .hiveSlot{opacity:1;pointer-events:auto}

/* --- Window edges resize --- */
.win{position:absolute;min-width:150px;min-height:100px;display:flex;flex-direction:column;
  background:var(--win);border:1.5px solid var(--winBorder);border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 1px 0 var(--winHi);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  overflow:hidden;transition:box-shadow .15s;color:var(--ink)}
.win::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:1.5px;background:var(--rainbow);opacity:.35;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:rbSpin 12s linear infinite}
.win.focused{box-shadow:0 16px 44px rgba(0,0,0,.7),inset 0 1px 0 var(--winHi),
  0 0 0 1px rgba(255,180,80,.4),0 0 40px rgba(255,150,60,.25)}
.win.nested{transform:scale(.85);transform-origin:top left}
.win.minimized{display:none}
.win::after{content:attr(data-suit-t);position:absolute;top:2px;left:6px;font-size:11px;
  font-weight:900;color:var(--gold);z-index:2;pointer-events:none;
  text-shadow:0 0 8px var(--gold);opacity:.9}
.win[data-suit="hearts"]::after{content:"♥";color:#ff7ab4;text-shadow:0 0 8px #ff7ab4}
.win[data-suit="diamonds"]::after{content:"♦";color:#ffb450;text-shadow:0 0 8px #ffb450}
.win[data-suit="spades"]::after{content:"♠";color:#a5a5ff;text-shadow:0 0 8px #a5a5ff}
.win[data-suit="clubs"]::after{content:"♣";color:#7edc8c;text-shadow:0 0 8px #7edc8c}
.win[data-suit="gold"]::after{content:"★";color:#ffe9a8;text-shadow:0 0 12px #ffcc55}
.win-head{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:4px;
  padding:0 8px 0 22px;cursor:grab;touch-action:none;
  background:linear-gradient(180deg,rgba(255,180,80,.16),rgba(255,120,40,.04));
  border-bottom:1px solid var(--winBorder)}
.win-head .title{flex:1;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-head .dots{display:flex;gap:5px}
.win-head .dot{width:20px;height:20px;border-radius:6px;cursor:pointer;
  display:grid;place-items:center;font-size:11px;color:#fff;font-weight:900;
  border:1px solid rgba(0,0,0,.4);background:rgba(0,0,0,.4);
  transition:transform .12s}
.win-head .dot:hover{transform:scale(1.15)}
.win-head .dot.center{background:linear-gradient(180deg,#7ed957,#3a8a2a)}
.win-head .dot.min{background:linear-gradient(180deg,#ffd23f,#c98a2a)}
.win-head .dot.max{background:linear-gradient(180deg,#ff8a1f,#c95a00)}
.win-head .dot.cls{background:linear-gradient(180deg,#ff5a5a,#c00)}
.win-head .dot.suit{background:linear-gradient(180deg,#a64dff,#6a1e9f)}
.win-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
/* 8 edge handles */
.eh{position:absolute;z-index:3}
.eh.n{top:-4px;left:8px;right:8px;height:10px;cursor:ns-resize}
.eh.s{bottom:-4px;left:8px;right:8px;height:10px;cursor:ns-resize}
.eh.w{left:-4px;top:8px;bottom:8px;width:10px;cursor:ew-resize}
.eh.e{right:-4px;top:8px;bottom:8px;width:10px;cursor:ew-resize}
.eh.nw{top:-4px;left:-4px;width:16px;height:16px;cursor:nwse-resize}
.eh.ne{top:-4px;right:-4px;width:16px;height:16px;cursor:nesw-resize}
.eh.sw{bottom:-4px;left:-4px;width:16px;height:16px;cursor:nesw-resize}
.eh.se{bottom:-4px;right:-4px;width:16px;height:16px;cursor:nwse-resize}
.eh::after{content:"";position:absolute;inset:3px;border-radius:3px;
  background:radial-gradient(circle,rgba(255,200,120,.6),transparent 70%);
  opacity:0;transition:opacity .15s}
.eh:hover::after{opacity:1}

/* --- Stage / world --- */
#stage{position:fixed;inset:0;z-index:10;overflow:hidden}
#world{position:absolute;inset:0;overflow:hidden}
body[data-play="on"] #stage{cursor:grab}

/* --- Single upload chip on left mid --- */
#uploadChip{position:fixed;left:max(8px,env(safe-area-inset-left));top:50%;
  transform:translateY(-50%);z-index:65}
body[data-lefty="on"] #uploadChip{left:auto;right:max(8px,env(safe-area-inset-right))}

/* --- Token / notes / houses --- */
.token{position:absolute;width:52px;height:52px;border-radius:14px;
  background:linear-gradient(155deg,rgba(255,220,140,.35),rgba(255,140,60,.1));
  border:2px solid var(--gold);display:grid;place-items:center;font-size:28px;
  box-shadow:0 0 0 2px rgba(0,0,0,.3),0 6px 20px rgba(255,150,60,.5),
    inset 0 1px 0 rgba(255,255,255,.5);
  cursor:grab;z-index:20;touch-action:none;transform:translate(-50%,-50%)}
.token.selected{box-shadow:0 0 0 3px var(--gold),0 6px 30px rgba(255,204,85,.9);
  animation:tokPulse 1.4s ease-in-out infinite}
@keyframes tokPulse{50%{box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(255,204,85,.8)}}
.token .tag{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font-size:9px;font-weight:800;color:var(--gold);text-shadow:0 0 6px #000;
  background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px;white-space:nowrap}
.token img{width:100%;height:100%;object-fit:contain;border-radius:12px}

.noteCard{position:absolute;width:130px;min-height:70px;padding:8px 10px 22px 10px;
  border-radius:12px;background:var(--card);color:var(--cardInk);
  font-size:11px;font-weight:700;line-height:1.25;cursor:grab;z-index:15;
  border:1.5px solid rgba(0,0,0,.3);
  box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6);
  touch-action:none;transform:translate(-50%,-50%)}
.noteCard .nTitle{font-size:12px;font-weight:900;margin-bottom:4px}
.noteCard .nPin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:14px}
.noteCard[data-suit="hearts"]{background:linear-gradient(150deg,#ffe4ee,#ff9ec3);color:#7a0a34}
.noteCard[data-suit="spades"]{background:linear-gradient(150deg,#e6e6f5,#9b9bc9);color:#1a1a44}
.noteCard[data-suit="diamonds"]{background:linear-gradient(150deg,#fff0d0,#ffcb85);color:#7a4400}
.noteCard[data-suit="clubs"]{background:linear-gradient(150deg,#e7ffe7,#8fe0a1);color:#0f5a26}
.noteCard[data-suit="gold"]{background:linear-gradient(150deg,#ffe9a8,#c98a2a);color:#2a0a00}
.noteCard textarea{width:100%;border:0;background:transparent;color:inherit;
  font:inherit;font-size:11px;resize:none;outline:none;min-height:36px;font-weight:700}

/* --- Card house waves --- */
.house{position:absolute;z-index:14;pointer-events:none;transform:translate(-50%,-50%)}
.houseCard{position:absolute;width:90px;height:130px;border-radius:12px;
  background:var(--card);color:var(--cardInk);border:1.5px solid rgba(0,0,0,.35);
  box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 0 1px rgba(255,220,150,.5);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  pointer-events:auto;cursor:grab;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;
  background-size:cover;background-position:center;position:absolute}
.houseCard .tag{position:absolute;bottom:2px;left:0;right:0;font-size:9px;font-weight:800;
  text-align:center;background:rgba(0,0,0,.5);color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.houseCard:hover{box-shadow:0 0 24px rgba(255,140,220,.7),0 6px 18px rgba(0,0,0,.5);
  border-color:rgba(255,140,220,.8)}
.houseCard.fusing{animation:burningLove 1.2s ease-out}
@keyframes burningLove{
  0%{filter:brightness(1)}
  30%{filter:brightness(2) hue-rotate(30deg);box-shadow:0 0 40px rgba(255,80,140,.9)}
  100%{filter:brightness(1)}
}
/* house layouts */
.house.wave .houseCard:nth-child(1){transform:rotate(-14deg) translate(-22px,8px) scale(.94)}
.house.wave .houseCard:nth-child(2){transform:rotate(0) translate(0,0);z-index:2}
.house.wave .houseCard:nth-child(3){transform:rotate(14deg) translate(22px,8px) scale(.94)}
.house.tent .houseCard:nth-child(1){transform:rotate(-30deg) translate(-18px,-4px)}
.house.tent .houseCard:nth-child(2){transform:rotate(30deg) translate(18px,-4px)}
.house.tent .houseCard:nth-child(3){transform:translate(0,30px);z-index:3}
.house.stair .houseCard:nth-child(1){transform:rotate(-8deg) translate(-20px,12px)}
.house.stair .houseCard:nth-child(2){transform:rotate(-8deg) translate(0,0);z-index:2}
.house.stair .houseCard:nth-child(3){transform:rotate(-8deg) translate(20px,-12px);z-index:3}

/* --- Preview/Export overlays --- */
.ov{position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:rgba(0,0,0,.78);backdrop-filter:blur(10px);padding:14px}
.ov.on{display:grid}
.ovPanel{width:min(94vw,540px);max-height:82vh;overflow-y:auto;padding:16px;border-radius:18px;
  background:linear-gradient(160deg,rgba(35,15,0,.96),rgba(15,6,0,.96));
  border:1px solid var(--winBorder);box-shadow:0 20px 60px rgba(0,0,0,.7);
  display:flex;flex-direction:column;gap:8px;color:var(--ink);
  position:relative;overflow:hidden}
.ovPanel::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  padding:1.5px;background:var(--rainbow);opacity:.4;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:rbSpin 10s linear infinite}
.ovPanel h3{margin:0;font-size:13px;color:var(--gold);font-weight:800;display:flex;align-items:center;gap:8px}
.ovPanel h3 .spacer{flex:1}
.ovPanel button{border:0;border-radius:10px;padding:10px;font:inherit;font-weight:800;
  font-size:12px;cursor:pointer;background:linear-gradient(180deg,var(--y),var(--o));color:#3a1e00}
.ovPanel button.ghost{background:rgba(255,255,255,.08);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--winBorder)}
.ovPanel .grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pvBox{background:#000;border-radius:12px;overflow:hidden;height:60vh;display:grid;place-items:center}
.pvBox img,.pvBox video,.pvBox iframe,.pvBox model-viewer{max-width:100%;max-height:100%;
  width:100%;height:100%;object-fit:contain;border:0}
.pvBox audio{width:90%}
.pvBox pre{color:var(--ink);font-size:11px;padding:12px;white-space:pre-wrap;text-align:left;
  width:100%;height:100%;overflow:auto;margin:0;background:rgba(0,0,0,.3)}

/* --- Holo pixel --- */
body[data-holopix="on"] #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background-image:
    linear-gradient(rgba(255,200,120,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,200,120,.06) 1px,transparent 1px);
  background-size:3px 3px;mix-blend-mode:screen}

/* --- Cinematic --- */
#cine{position:fixed;inset:0;z-index:100;display:none;background:#000}
#cine.on{display:block}
#cine .bar{position:absolute;left:0;right:0;height:12vh;background:#000;z-index:3;transition:height .6s}
#cine .bar.top{top:0}#cine .bar.bot{bottom:0}
#cine.ready .bar{height:8vh}
#cine .frameBox{position:absolute;inset:8vh 6vw;overflow:hidden;border-radius:8px;background:#000;
  display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(255,204,85,.4),0 0 60px rgba(255,204,85,.25)}
#cine .slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity 1.2s ease}
#cine .slide.on{opacity:1}
#cine .slide img,#cine .slide video{width:100%;height:100%;object-fit:cover;
  animation:ken 8s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.08) translate(-2%,-2%)}}
#cine .slide .txt{color:var(--gold);font-size:20px;font-weight:800;text-align:center;padding:20px;
  text-shadow:0 0 20px rgba(255,204,85,.6);font-family:ui-serif,Georgia,serif;font-style:italic}
#cine .ctrl{position:absolute;bottom:2vh;left:50%;transform:translateX(-50%);z-index:4;
  display:flex;gap:6px}
#cine .ctrl button{border:1px solid rgba(255,204,85,.5);background:rgba(20,8,0,.7);
  color:var(--gold);font:inherit;font-size:11px;font-weight:800;padding:8px 14px;
  border-radius:10px;cursor:pointer;backdrop-filter:blur(10px)}

/* --- Joystick / buttons --- */
#joypad{position:fixed;left:14px;bottom:14px;z-index:54;width:120px;height:120px;display:none}
body[data-play="on"] #joypad{display:block}
body[data-play="on"] #hiveCorner{opacity:.4}
#joypad .stickBg{width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,200,120,.18),rgba(60,20,0,.6));
  border:2px solid var(--winBorder);box-shadow:inset 0 0 20px rgba(255,150,60,.3),0 0 24px rgba(255,150,60,.2)}
#joypad .stick{position:absolute;top:50%;left:50%;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffdc9a,#ff8a1f 70%,#8a3a00);
  border:2px solid var(--gold);transform:translate(-50%,-50%);
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
#actionBtns{position:fixed;right:14px;bottom:14px;z-index:54;display:none;gap:8px}
body[data-play="on"] #actionBtns{display:flex}
#actionBtns button{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);
  background:radial-gradient(circle at 35% 35%,#ffdc9a,#ff8a1f 70%,#8a3a00);
  color:#3a1e00;font-size:18px;font-weight:900;cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}

/* --- Toast --- */

<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
/* ============================================================
   HOLO HIVE v0.8
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const toast = t => { const e=$('#toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1500); };
const USERNAME = 'worldpeacebtn';
const SUITS = {
  hearts:'linear-gradient(150deg,#ffe4ee,#ff9ec3)',
  spades:'linear-gradient(150deg,#e6e6f5,#9b9bc9)',
  diamonds:'linear-gradient(150deg,#fff0d0,#ffcb85)',
  clubs:'linear-gradient(150deg,#e7ffe7,#8fe0a1)',
  gold:'linear-gradient(150deg,#ffe9a8,#c98a2a)'
};
const SUIT_INK = {hearts:'#7a0a34',spades:'#1a1a44',diamonds:'#7a4400',clubs:'#0f5a26',gold:'#2a0a00'};
const SUIT_CHAR = {hearts:'♥',spades:'♠',diamonds:'♦',clubs:'♣',gold:'★'};

const state = {
  hue: parseFloat(localStorage.getItem('holo.hue')||'0'),
  mode: localStorage.getItem('holo.mode') || 'dark',
  grid: localStorage.getItem('holo.grid') || 'hex',
  play: localStorage.getItem('holo.play') || 'off',
  holopix: localStorage.getItem('holo.holopix') || 'off',
  hud: localStorage.getItem('holo.hud') || 'game',
  lefty: localStorage.getItem('holo.lefty') || 'off',
  camBg: localStorage.getItem('holo.camBg') || 'off',
  hiveOpen: localStorage.getItem('holo.hiveOpen') === 'true',
  zTop: 20,
  wins: JSON.parse(localStorage.getItem('holo.wins')||'{}'),
  tokens: JSON.parse(localStorage.getItem('holo.tokens')||'[]'),
  notes: JSON.parse(localStorage.getItem('holo.notes')||'[]'),
  houses: JSON.parse(localStorage.getItem('holo.houses')||'[]'),
  chibis: JSON.parse(localStorage.getItem('holo.chibis')||'[]'),
  uploads: JSON.parse(localStorage.getItem('holo.uploads')||'[]'),
  memories: JSON.parse(localStorage.getItem('holo.memories')||'[]'),
  repos: JSON.parse(localStorage.getItem('holo.repos')||'null'),
  cachedFiles: {},
  playlist: [], ti: 0,
  cineLines: [], cineIdx: 0, cinePlaying: false, cineTimer: null,
  vfMode: 'none',
  // background foil stack (cam views / windows that act as BG)
  bgFoil: localStorage.getItem('holo.bgFoil') || null
};
const blobMap = new Map();
function save(){
  ['hue','mode','grid','play','holopix','hud','lefty','camBg'].forEach(k=>localStorage.setItem('holo.'+k, state[k]));
  localStorage.setItem('holo.hiveOpen', state.hiveOpen);
  localStorage.setItem('holo.tokens', JSON.stringify(state.tokens));
  localStorage.setItem('holo.notes', JSON.stringify(state.notes));
  localStorage.setItem('holo.houses', JSON.stringify(state.houses));
  localStorage.setItem('holo.chibis', JSON.stringify(state.chibis));
  localStorage.setItem('holo.wins', JSON.stringify(state.wins));
  localStorage.setItem('holo.bgFoil', state.bgFoil||'');
  localStorage.setItem('holo.uploads', JSON.stringify(
    state.uploads.map(u=>({id:u.id,name:u.name,kind:u.kind}))));
  localStorage.setItem('holo.memories', JSON.stringify(
    state.memories.map(m=>({id:m.id,kind:m.kind,name:m.name,ts:m.ts,tag:m.tag}))));
  if(state.repos) localStorage.setItem('holo.repos', JSON.stringify(state.repos));
}

/* ---------- APPLY MODES ---------- */
function applyModes(){
  document.documentElement.style.setProperty('--hue', state.hue);
  ['mode','grid','play','holopix','hud','lefty','camBg'].forEach(k=>document.body.dataset[k]=state[k]);
  $('#hiveToggle').classList.toggle('open', state.hiveOpen);
  $('#hiveCorner').classList.toggle('open', state.hiveOpen);
  $('#mCamBg').classList.toggle('on', state.camBg==='on');
  if(state.camBg==='off' && camStream){
    camStream.getTracks().forEach(t=>t.stop());
    camStream = null;
    $('#camBgV').srcObject = null;
  }
  save();
}
applyModes();

/* ---------- HUE CIRCLE (in menu) ---------- */
// (moved: keeps hue from hive toggle rotation)

/* ---------- PARALLAX SPHERES ---------- */
let sphereOff = 0;
addEventListener('pointermove', e=>{
  const cx = e.clientX/innerWidth - .5;
  const cy = e.clientY/innerHeight - .5;
  const s = $$('.sphere');
  s.forEach((el,i)=>{
    const sp = 0.6 + i*0.35;
    el.style.transform = `translate(${cx*30*sp}px, ${cy*30*sp}px)`;
  });
}, {passive:true});
(function sphereIdle(){
  sphereOff += .15;
  const s = $$('.sphere');
  s.forEach((el,i)=>{
    const base = el.dataset.base ? parseFloat(el.dataset.base) : 0;
    if(!el.dataset.base) el.dataset.base = 0;
    el.style.backgroundPosition = `${sphereOff*(1+i*.4)}% 50%`;
  });
  requestAnimationFrame(sphereIdle);
})();

/* ---------- HEX GRID ---------- */
(function drawHex(){
  const c = $('#hexGrid'); const ctx = c.getContext('2d');
  function draw(){
    c.width = innerWidth*devicePixelRatio;
    c.height = innerHeight*devicePixelRatio;
    c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px';
    ctx.scale(devicePixelRatio,devicePixelRatio);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    const s = 32, w = Math.sqrt(3)*s, h = 2*s;
    ctx.strokeStyle = 'rgba(255,150,60,.18)';
    ctx.lineWidth = 1;
    for(let y=0, row=0; y<innerHeight+h; y+=h*0.75, row++){
      for(let x=(row%2? w/2 : 0); x<innerWidth+w; x+=w){
        ctx.beginPath();
        for(let i=0;i<6;i++){
          const a = Math.PI/180*(60*i - 30);
          const px = x + s*Math.cos(a), py = y + s*Math.sin(a);
          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
      }
    }
  }
  draw(); addEventListener('resize', draw);
})();

/* ---------- HUD COLLISION AVOIDANCE ---------- */
// Store token positions on grid; if a token lands within 40px of another, push it aside.
function resolveTokenCollision(t){
  const R = 55;
  for(const o of state.tokens){
    if(o===t) continue;
    const dx = t.x-o.x, dy = t.y-o.y;
    const d = Math.hypot(dx,dy);
    if(d < R && d > 0.1){
      const push = (R-d);
      t.x += (dx/d)*push;
      t.y += (dy/d)*push;
    }
  }
}

/* ---------- Hive HUD ---------- */
$('#hiveToggle').onclick = () => {
  state.hiveOpen = !state.hiveOpen;
  applyModes();
};

const APPS = {
  lab:  ()=>launchLab(),
  cam:  ()=>launchCam(),
  view: ()=>launchPreview(),
  diary:()=>launchDiary(),
  dj:   ()=>launchDJ(),
  char: ()=>launchChar(),
  quest:()=>launchQuest(),
  lib:  ()=>launchLib()
};
$$('.hiveSlot .hex').forEach(el=>{
  const app = el.dataset.app;
  el.onclick = () => {
    if(APPS[app]) APPS[app]();
    state.hiveOpen = false; applyModes();
  };
});

/* ---------- Upload chip ---------- */
$('#uploadHex').onclick = ()=>$('#fUp').click();

/* ---------- WINDOW MANAGER (8-edge resize) ---------- */
const world = $('#world');
const wins = {};
function makeWin(id, title, icon, opts={}){
  if(wins[id]){ focusWin(wins[id]); return wins[id]; }
  const el = document.createElement('div');
  el.className = 'win'; el.dataset.id = id;
  const suit = opts.suit || ['hearts','spades','diamonds','clubs','gold'][Math.floor(Math.random()*5)];
  el.dataset.suit = suit;
  el.dataset.suitT = SUIT_CHAR[suit];
  const s = state.wins[id] || {};
  const W = opts.w || s.w || 300, H = opts.h || s.h || 240;
  const X = s.x ?? opts.x ?? (innerWidth/2 - W/2 + (Math.random()*60-30));
  const Y = s.y ?? opts.y ?? (60 + (Math.random()*80-40));
  el.style.width = W+'px'; el.style.height = H+'px';
  el.style.left = Math.max(2, Math.min(innerWidth-60, X))+'px';
  el.style.top  = Math.max(2, Math.min(innerHeight-100, Y))+'px';
  el.style.zIndex = ++state.zTop;
  el.innerHTML = `
    <div class="win-head">
      <span style="font-size:13px">${icon}</span>
      <span class="title">${esc(title)}</span>
      <div class="dots">
        <div class="dot suit" title="cycle suit">${SUIT_CHAR[suit]}</div>
        <div class="dot center" title="center">◎</div>
        <div class="dot min" title="min">−</div>
        <div class="dot max" title="max">▢</div>
        <div class="dot cls" title="close">✕</div>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="eh n"></div><div class="eh s"></div>
    <div class="eh w"></div><div class="eh e"></div>
    <div class="eh nw"></div><div class="eh ne"></div>
    <div class="eh sw"></div><div class="eh se"></div>`;
  world.appendChild(el);
  const w_ = {el, id, opts, title};
  wins[id] = w_;
  wireWin(w_); focusWin(w_);
  if(opts.content) opts.content(el.querySelector('.win-body'), w_);
  return w_;
}
function wireWin(w_){
  const {el, id} = w_;
  const head = el.querySelector('.win-head');
  el.addEventListener('pointerdown', ()=>focusWin(w_), {capture:true});
  // drag
  let dg=false, sx=0, sy=0, ox=0, oy=0;
  head.addEventListener('pointerdown', e=>{
    if(e.target.classList.contains('dot')) return;
    dg=true; sx=e.clientX; sy=e.clientY;
    ox=parseFloat(el.style.left); oy=parseFloat(el.style.top);
    head.setPointerCapture(e.pointerId); focusWin(w_);
  });
  head.addEventListener('pointermove', e=>{
    if(!dg) return;
    el.style.left = Math.max(-40, Math.min(innerWidth-60, ox+(e.clientX-sx)))+'px';
    el.style.top  = Math.max(0,   Math.min(innerHeight-80, oy+(e.clientY-sy)))+'px';
  });
  head.addEventListener('pointerup', ()=>{ dg=false; saveWin(w_); });
  // 8-edge resize
  ['n','s','w','e','nw','ne','sw','se'].forEach(dir=>{
    const h = el.querySelector('.eh.'+dir);
    let rs=false, rx=0, ry=0, rw=0, rh=0, rl=0, rt=0;
    h.addEventListener('pointerdown', e=>{
      e.stopPropagation(); rs=true;
      rx=e.clientX; ry=e.clientY;
      rw=el.offsetWidth; rh=el.offsetHeight;
      rl=parseFloat(el.style.left); rt=parseFloat(el.style.top);
      h.setPointerCapture(e.pointerId); focusWin(w_);
    });
    h.addEventListener('pointermove', e=>{
      if(!rs) return;
      const dx = e.clientX-rx, dy = e.clientY-ry;
      if(dir.includes('e')) el.style.width = Math.max(150, rw+dx)+'px';
      if(dir.includes('s')) el.style.height= Math.max(100, rh+dy)+'px';
      if(dir.includes('w')){
        const nw = Math.max(150, rw-dx);
        el.style.width = nw+'px';
        el.style.left = (rl + (rw-nw))+'px';
      }
      if(dir.includes('n')){
        const nh = Math.max(100, rh-dy);
        el.style.height = nh+'px';
        el.style.top = (rt + (rh-nh))+'px';
      }
    });
    h.addEventListener('pointerup', ()=>{ rs=false; saveWin(w_); });
  });
  // dots
  el.querySelector('.dot.cls').onclick = e=>{ e.stopPropagation(); el.remove(); delete wins[id]; };
  el.querySelector('.dot.min').onclick = e=>{ e.stopPropagation(); el.classList.toggle('minimized'); };
  el.querySelector('.dot.max').onclick = e=>{
    e.stopPropagation();
    if(el.dataset.maxed){
      el.style.left=el.dataset.mx; el.style.top=el.dataset.my;
      el.style.width=el.dataset.mw; el.style.height=el.dataset.mh;
      delete el.dataset.maxed;
    } else {
      el.dataset.mx=el.style.left; el.dataset.my=el.style.top;
      el.dataset.mw=el.style.width; el.dataset.mh=el.style.height;
      el.style.left='4px'; el.style.top='4px';
      el.style.width=(innerWidth-8)+'px'; el.style.height=(innerHeight-8)+'px';
      el.dataset.maxed='1';
    }
    saveWin(w_);
  };
  el.querySelector('.dot.center').onclick = e=>{
    e.stopPropagation();
    el.style.left = (innerWidth/2 - el.offsetWidth/2)+'px';
    el.style.top  = (innerHeight/2 - el.offsetHeight/2)+'px';
    saveWin(w_);
  };
  el.querySelector('.dot.suit').onclick = e=>{
    e.stopPropagation();
    const order = ['hearts','diamonds','spades','clubs','gold'];
    const i = order.indexOf(el.dataset.suit);
    const ns = order[(i+1)%order.length];
    el.dataset.suit = ns;
    el.querySelector('.dot.suit').textContent = SUIT_CHAR[ns];
    if(w_.opts?.content) w_.opts.content(el.querySelector('.win-body'), w_);
    toast('suit: '+SUIT_CHAR[ns]);
  };
}
function focusWin(w_){
  Object.values(wins).forEach(x=>x.el.classList.remove('focused'));
  w_.el.classList.add('focused');
  w_.el.style.zIndex = ++state.zTop;
  w_.el.classList.remove('minimized');
}
function saveWin(w_){
  state.wins[w_.id] = {x:parseFloat(w_.el.style.left)||0, y:parseFloat(w_.el.style.top)||0,
    w:w_.el.offsetWidth, h:w_.el.offsetHeight};
  save();
}

/* ---------- TOKENS ---------- */
function addToken({x, y, emoji='🐰', src, name=''}){
  const t = {id:uid('t'), x, y, emoji, src, name};
  state.tokens.push(t); save(); renderTokens();
}
function addTokenAtCenter(){
  const r = $('#stage').getBoundingClientRect();
  addToken({x:r.width/2, y:r.height/2, emoji:'🐰', name:'new'});
}
function renderTokens(){
  $$('.token').forEach(e=>e.remove());
  state.tokens.forEach(t=>{
    const el = document.createElement('div');
    el.className='token'; el.dataset.id = t.id;
    el.style.left = t.x+'px'; el.style.top = t.y+'px';
    if(t.src){ const im=document.createElement('img'); im.src=t.src; el.appendChild(im); }
    else el.textContent = t.emoji || '🐰';
    if(t.name){ const tg=document.createElement('div'); tg.className='tag'; tg.textContent=t.name; el.appendChild(tg); }
    makeTokenDraggable(el, t);
    el.onclick = e => {
      if(el._dragged) return;
      $$('.token').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    };
    world.appendChild(el);
  });
}
function makeTokenDraggable(el, t){
  let dg=false, sx=0, sy=0, ox=0, oy=0;
  el.addEventListener('pointerdown', e=>{
    dg=true; sx=e.clientX; sy=e.clientY; ox=t.x; oy=t.y;
    el._dragged=false; el.setPointerCapture(e.pointerId); el.style.zIndex=999;
  });
  el.addEventListener('pointermove', e=>{
    if(!dg) return;
    const nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    if(Math.hypot(nx-ox, ny-oy)>6) el._dragged=true;
    t.x=nx; t.y=ny;
    el.style.left=t.x+'px'; el.style.top=t.y+'px';
  });
  el.addEventListener('pointerup', ()=>{
    if(!dg) return; dg=false; el.style.zIndex='';
    // honeycomb snap
    t.x = Math.round(t.x/60)*60; t.y = Math.round(t.y/60)*60;
    // collision avoid
    resolveTokenCollision(t);
    el.style.left=t.x+'px'; el.style.top=t.y+'px';
    save();
    setTimeout(()=>el._dragged=false, 100);
  });
}

function makeNoteDraggable(el, n){
  let dg=false, sx=0, sy=0, ox=0, oy=0, onId=null;
  el.addEventListener('pointerdown', e=>{
    if(e.target.tagName==='TEXTAREA') return;
    dg=true; sx=e.clientX; sy=e.clientY; ox=n.x; oy=n.y;
    el.setPointerCapture(e.pointerId); el.style.zIndex=999;
  });
  el.addEventListener('pointermove', e=>{
    if(!dg) return;
    n.x=ox+(e.clientX-sx); n.y=oy+(e.clientY-sy);
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
    onId = null;
    $$('.noteCard').forEach(o=>{
      if(o===el) return;
      const r1 = el.getBoundingClientRect(), r2 = o.getBoundingClientRect();
      const ix = Math.max(0, Math.min(r1.right,r2.right) - Math.max(r1.left,r2.left));
      const iy = Math.max(0, Math.min(r1.bottom,r2.bottom) - Math.max(r1.top,r2.top));
      if(ix*iy > (r1.width*r1.height)*0.3) onId = o.dataset.id;
    });
    el.style.outline = onId ? '2px solid var(--gold)' : '';
  });
  el.addEventListener('pointerup', ()=>{
    if(!dg) return; dg=false; el.style.zIndex=''; el.style.outline='';
    n.x = Math.round(n.x/30)*30; n.y = Math.round(n.y/30)*30;
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
    if(onId){
      const other = state.notes.find(x=>x.id===onId);
      if(other) makeHouse([n, other]);
    } else save();
  });
}

/* ---------- CARD HOUSE (wave layouts + burning love) ---------- */
function makeHouse(cards){
  if(!cards || cards.length<2) return;
  const cx = cards.reduce((a,c)=>a+c.x, 0)/cards.length;
  const cy = cards.reduce((a,c)=>a+c.y, 0)/cards.length;
  const layouts = ['wave','tent','stair'];
  const house = {
    id: uid('h'),
    x: cx, y: cy,
    layout: layouts[Math.floor(Math.random()*layouts.length)],
    cards: cards.map(c=>({title:c.title, body:c.body, suit:c.suit}))
  };
  // pad to 3 cards if only 2
  if(house.cards.length === 2){
    house.cards.splice(1, 0, {title:'·', body:'fused', suit:'gold'});
  }
  state.houses.push(house);
  state.notes = state.notes.filter(n => !cards.find(c=>c.id===n.id));
  save(); renderNotes(); renderHouses();
  // burning-love flash
  setTimeout(()=>{
    document.querySelectorAll('.houseCard').forEach(hc=>{
      hc.classList.add('fusing');
      setTimeout(()=>hc.classList.remove('fusing'), 1300);
    });
  }, 80);
  toast('🏠 '+house.layout+' · '+house.cards.length+' cards');
}

/* ---------- JOYSTICK ---------- */
const stick = $('#stick'), joypad = $('#joypad');
let stickActive=false, origin={x:0,y:0};
joypad.addEventListener('pointerdown', e=>{
  stickActive=true; joypad.setPointerCapture(e.pointerId);
  const r = joypad.getBoundingClientRect();
  origin = {x: r.left+r.width/2, y: r.top+r.height/2};
});
joypad.addEventListener('pointermove', e=>{
  if(!stickActive) return;
  const dx = e.clientX-origin.x, dy = e.clientY-origin.y;
  const mag = Math.min(40, Math.hypot(dx,dy));
  const ang = Math.atan2(dy,dx);
  const nx = Math.cos(ang)*mag, ny = Math.sin(ang)*mag;
  stick.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
  const sel = document.querySelector('.token.selected');
  if(sel){
    const t = state.tokens.find(x=>x.id===sel.dataset.id);
    if(t){ t.x += nx*0.25; t.y += ny*0.25; sel.style.left = t.x+'px'; sel.style.top = t.y+'px'; }
  }
});
joypad.addEventListener('pointerup', ()=>{
  stickActive=false; stick.style.transform = 'translate(-50%,-50%)';
  const sel = document.querySelector('.token.selected');
  if(sel){
    const t = state.tokens.find(x=>x.id===sel.dataset.id);
    if(t){
      t.x = Math.round(t.x/60)*60; t.y = Math.round(t.y/60)*60;
      resolveTokenCollision(t);
      sel.style.left = t.x+'px'; sel.style.top = t.y+'px'; save();
    }
  }
});

/* ---------- Voice FX (live filter chain) ---------- */
let vfCtx=null, vfStream=null, vfFilter=null, vfAnalyser=null, vfRecorder=null, vfChunks=[];
function vfSetMode(mode){
  state.vfMode = mode;
  if(!vfCtx) return;
  const f = vfFilter;
  switch(mode){
    case 'none':  f.type='allpass'; f.frequency.value=1000; f.Q.value=1; break;
    case 'robot': f.type='bandpass'; f.frequency.value=1200; f.Q.value=6; break;
    case 'ghost': f.type='highpass'; f.frequency.value=800; f.Q.value=8; break;
    case 'deep':  f.type='lowpass'; f.frequency.value=400; f.Q.value=2; break;
    case 'alien': f.type='peaking'; f.frequency.value=2400; f.Q.value=10; break;
    case 'tunnel':f.type='bandpass'; f.frequency.value=600; f.Q.value=12; break;
  }
}
async function vfOpen(){
  try{
    vfStream = await navigator.mediaDevices.getUserMedia({audio:true});
    vfCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = vfCtx.createMediaStreamSource(vfStream);
    vfFilter = vfCtx.createBiquadFilter();
    const dest = vfCtx.createMediaStreamDestination();
    src.connect(vfFilter);
    vfFilter.connect(vfCtx.destination); // monitor
    vfFilter.connect(dest);
    vfSetMode(state.vfMode);
    vfRecorder = new MediaRecorder(dest.stream);
    vfRecorder.ondataavailable = e => { if(e.data.size) vfChunks.push(e.data); };
    vfRecorder.onstop = ()=>{
      const blob = new Blob(vfChunks, {type:'audio/webm'});
      const url = URL.createObjectURL(blob);
      state.memories.push({id:uid('m'), kind:'audio', name:'voice-'+Date.now()+'.webm', ts:Date.now(), tag:'voice', blob});
      blobMap.set(state.memories[state.memories.length-1].id, blob);
      save(); toast('voice saved');
    };
    vfChunks=[];
    vfRecorder.start();
    toast('🎙 recording live FX…');
  }catch(e){ toast('mic blocked'); }
}
$$('[data-vf]').forEach(b=>{
  b.onclick = ()=>{ vfSetMode(b.dataset.vf); toast('fx: '+b.dataset.vf); };
});
$('#vfClose').onclick = ()=>{
  if(vfRecorder && vfRecorder.state==='recording') vfRecorder.stop();
  if(vfStream){ vfStream.getTracks().forEach(t=>t.stop()); vfStream=null; }
  if(vfCtx){ vfCtx.close(); vfCtx=null; }
  $('#vfOv').classList.remove('on');
};
$('#vfRec').onpointerdown = e=>{ e.preventDefault(); if(!vfCtx) vfOpen(); };
$('#vfRec').onpointerup = ()=>{ if(vfRecorder && vfRecorder.state==='recording') vfRecorder.stop(); };

/* ---------- AUDIO (music) ---------- */
const au = $('#au');
let actx=null, srcNode=null, anNode=null, lowEQ=null, midEQ=null, highEQ=null, volNode=null;
function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  srcNode = actx.createMediaElementSource(au);
  lowEQ = actx.createBiquadFilter(); lowEQ.type='lowshelf'; lowEQ.frequency.value=200;
  midEQ = actx.createBiquadFilter(); midEQ.type='peaking'; midEQ.frequency.value=1000; midEQ.Q.value=1;
  highEQ= actx.createBiquadFilter(); highEQ.type='highshelf'; highEQ.frequency.value=4000;
  anNode = actx.createAnalyser(); anNode.fftSize=128;
  volNode= actx.createGain();
  srcNode.connect(lowEQ).connect(midEQ).connect(highEQ).connect(anNode).connect(volNode).connect(actx.destination);
  pulseLoop();
}
function pulseLoop(){
  if(!anNode) return;
  const data = new Uint8Array(anNode.frequencyBinCount);
  (function loop(){
    if(document.hidden){ setTimeout(loop, 300); return; }
    anNode.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0)/data.length/255;
    document.documentElement.style.setProperty('--pulse',(0.15+avg*1.1).toFixed(3));
    requestAnimationFrame(loop);
  })();
}

function previewMedia(u){
  if(!wins.view) launchPreview();
  focusWin(wins.view);
  const box = wins.view.el.querySelector('#pvBody');
  box.innerHTML = '';
  const src = u.url || (blobMap.get(u.id) ? URL.createObjectURL(blobMap.get(u.id)) : null);
  if(!src) return;
  const k = u.kind;
  if(k==='image'){ const im=new Image(); im.src=src; box.appendChild(im); }
  else if(k==='video'){ const v=document.createElement('video'); v.src=src; v.controls=true; v.autoplay=true; v.playsInline=true; box.appendChild(v); }
  else if(k==='audio'){ const a=document.createElement('audio'); a.src=src; a.controls=true; a.autoplay=true; box.appendChild(a); }
  else if(k==='pdf'){ const i=document.createElement('iframe'); i.src=src; box.appendChild(i); }
  else if(k==='3d'){ const mv=document.createElement('model-viewer'); mv.setAttribute('src',src);
    mv.setAttribute('camera-controls',''); mv.setAttribute('auto-rotate','');
    mv.style.cssText='width:100%;height:100%'; box.appendChild(mv); }
  else if(k==='html'){ const i=document.createElement('iframe'); i.src=src; box.appendChild(i); }
  else if(k==='text'){ fetch(src).then(r=>r.text()).then(t=>{ const p=document.createElement('pre'); p.textContent=t; box.appendChild(p); }).catch(()=>{}); }
  else { box.innerHTML = `<a style="color:var(--gold)" href="${src}" download>download</a>`; }
}

/* ---------- CAMERA full-screen ---------- */
async function launchCam(){
  const full = document.createElement('div');
  full.style.cssText = 'position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column';
  full.innerHTML = `
    <div style="flex:1;position:relative;overflow:hidden">
      <video id="camV" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;inset:8%;border:2px dashed rgba(255,204,85,.7);border-radius:14px;box-shadow:0 0 24px rgba(255,204,85,.3);pointer-events:none"></div>
    </div>
    <div style="padding:10px;display:flex;gap:6px;justify-content:center;background:rgba(0,0,0,.7)">
      <button id="cfShot" class="hex glass" style="width:auto;padding:0 14px;height:40px;font-size:11px;font-weight:800;color:inherit;display:inline-flex;align-items:center;gap:4px">📸 shot</button>
      <button id="cfRec"  class="hex glass" style="width:auto;padding:0 14px;height:40px;font-size:11px;font-weight:800;color:inherit;display:inline-flex;align-items:center;gap:4px">🎥 rec</button>
      <button id="cfClose"class="hex glass" style="width:auto;padding:0 14px;height:40px;font-size:11px;font-weight:800;color:inherit;display:inline-flex;align-items:center;gap:4px">✕</button>
    </div>`;
  document.body.appendChild(full);
  const v = full.querySelector('#camV');
  let localStream=null;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    v.srcObject = localStream;
  }catch(e){ toast('camera blocked'); }
  let rec=null, recChunks=[];
  full.querySelector('#cfShot').onclick = ()=>{
    if(!localStream) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    c.toBlob(b=>{
      const m = {id:uid('m'), kind:'image', name:'scan-'+Date.now()+'.png', ts:Date.now(), tag:'scan', blob:b};
      state.memories.push(m); blobMap.set(m.id, b); save(); toast('📸 saved');
    },'image/png');
  };
  full.querySelector('#cfRec').onclick = ()=>{
    if(!localStream) return;
    if(rec && rec.state==='recording') return;
    recChunks = [];
    try{
      rec = new MediaRecorder(localStream);
      rec.ondataavailable = e=>{ if(e.data.size) recChunks.push(e.data); };
      rec.onstop = ()=>{
        const b = new Blob(recChunks, {type:rec.mimeType});
        const m = {id:uid('m'), kind:'video', name:'clip-'+Date.now()+'.webm', ts:Date.now(), tag:'clip', blob:b};
        state.memories.push(m); blobMap.set(m.id, b); save(); toast('🎥 saved');
      };
      rec.start();
      full.querySelector('#cfRec').textContent = '⏹ stop';
      full.querySelector('#cfRec').onclick = ()=>{ rec.stop(); full.querySelector('#cfRec').textContent='🎥 rec'; };
    }catch(e){ toast('rec failed'); }
  };
  full.querySelector('#cfClose').onclick = ()=>{
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); }
    full.remove();
  };
}

/* ---------- CINEMATIC ---------- */
const cine = $('#cine'), cineBox = $('#cineBox');
function openCine(){
  cine.classList.add('on'); cine.classList.remove('ready');
  setTimeout(()=>cine.classList.add('ready'), 400);
  state.cineIdx = 0; renderCineSlide(); cinePlay();
}
function closeCine(){ cine.classList.remove('on'); cinePlay(false); cineBox.innerHTML=''; }
function renderCineSlide(){
  const L = state.cineLines[state.cineIdx]; if(!L) return;
  cineBox.innerHTML = '';
  if(L.startsWith('@media')){
    const fn = L.slice(7).trim();
    const u = state.uploads.find(x=>x.name===fn) || state.memories.find(x=>x.name===fn);
    const s = document.createElement('div'); s.className='slide on';
    if(u){
      const b = u.blob || blobMap.get(u.id);
      const url = u.url || (b ? URL.createObjectURL(b) : null);
      if(url && u.kind==='video'){ const v=document.createElement('video'); v.src=url; v.muted=true; v.playsInline=true; v.loop=true; v.autoplay=true; s.appendChild(v); }
      else if(url){ const im=new Image(); im.src=url; s.appendChild(im); }
      else s.innerHTML = `<div class="txt">${esc(u.name)}</div>`;
    } else {
      s.innerHTML = `<div class="txt">@media ${esc(fn)}</div>`;
    }
    cineBox.appendChild(s);
  } else {
    cineBox.innerHTML = `<div class="slide on"><div class="txt">${esc(L)}</div></div>`;
  }
}
function cinePlay(on){
  if(on===false || state.cinePlaying){
    clearTimeout(state.cineTimer); state.cinePlaying=false;
    $('#cinePlay').textContent='▶'; return;
  }
  state.cinePlaying = true; $('#cinePlay').textContent='⏸';
  cineStep();
}
function cineStep(){
  if(!state.cinePlaying) return;
  state.cineTimer = setTimeout(()=>{
    state.cineIdx++;
    if(state.cineIdx >= state.cineLines.length){
      state.cinePlaying=false; $('#cinePlay').textContent='▶'; return;
    }
    renderCineSlide(); cineStep();
  }, 2400);
}
$('#cinePlay').onclick = ()=>cinePlay();
$('#cineNext').onclick = ()=>{ state.cineIdx = Math.min(state.cineLines.length-1, state.cineIdx+1); renderCineSlide(); };
$('#cinePrev').onclick = ()=>{ state.cineIdx = Math.max(0, state.cineIdx-1); renderCineSlide(); };
$('#cineExit').onclick = closeCine;

/* ---------- EXPORT ---------- */
$('#pvClose').onclick = ()=>$('#pvOv').classList.remove('on');
$('#exClose').onclick = ()=>$('#exOv').classList.remove('on');
function coord(i){ return `X${i%9}Y${Math.floor(i/9)%9}Z${Math.floor(i/81)}`; }
function download(name, data){ const a=document.createElement('a'); a.href=URL.createObjectURL(data); a.download=name; a.click(); }
$('#exTxt').onclick = ()=>{
  const lines=['=== HOLO HIVE v0.8 ===','saved: '+new Date().toISOString(),
    'mode: '+state.mode+' grid: '+state.grid,'','--- tokens ---'];
  state.tokens.forEach((t,i)=>lines.push(`${coord(i)} token x=${t.x|0} y=${t.y|0} name="${t.name}"`));
  lines.push('','--- notes ---');
  state.notes.forEach((n,i)=>lines.push(`${coord(i)} note suit=${n.suit} x=${n.x|0} y=${n.y|0} title="${n.title}"`));
  lines.push('','--- houses ---');
  state.houses.forEach((h,i)=>lines.push(`${coord(i)} house=${h.layout} cards=${h.cards.length}`));
  download('holo_transcript.txt', new Blob([lines.join('\n')],{type:'text/plain'}));
  toast('txt saved');
};
$('#exJson').onclick = ()=>{
  download('holo_settings.json', new Blob([JSON.stringify({
    format:'HOLO-HIVE', version:'0.8',
    state:{mode:state.mode, grid:state.grid, hue:state.hue, lefty:state.lefty},
    tokens:state.tokens, notes:state.notes, houses:state.houses,
    chibis:state.chibis, wins:state.wins
  },null,1)],{type:'application/json'}));
  toast('json saved');
};
$('#exZip').onclick = async ()=>{
  if(!window.JSZip) return toast('JSZip offline');
  const zip = new JSZip();
  zip.file('HOLO.json', JSON.stringify({
    format:'HOLO-HIVE', version:'0.8',
    state:{mode:state.mode, grid:state.grid, hue:state.hue},
    tokens:state.tokens, notes:state.notes, houses:state.houses, chibis:state.chibis
  },null,1));
  for(const u of state.uploads){ const b=blobMap.get(u.id); if(b) zip.file(`uploads/${u.name}`, b); }
  for(const m of state.memories){ const b=blobMap.get(m.id); if(b) zip.file(`memories/${m.name}`, b); }
  const out = await zip.generateAsync({type:'blob'});
  download('holo_pack.zip', out); toast('zip saved');
};

/* ---------- FILE UPLOAD (single chip, all formats) ---------- */
$('#fUp').onchange = e => {
  [...e.target.files].forEach(f=>{
    const k = kindOf(f); const url = URL.createObjectURL(f);
    const u = {id:uid('u'), name:f.name, kind:k, url, blob:f};
    state.uploads.push(u); blobMap.set(u.id, f);
  });
  save(); toast(state.uploads.length+' uploads');
  e.target.value='';
};
$('#fChibi').onchange = e => {
  [...e.target.files].forEach(f=>{
    const src = URL.createObjectURL(f);
    const c = {id:uid('c'), src, name:f.name.replace(/\.[^.]+$/,'').slice(0,8)};
    state.chibis.push(c);
  });
  save(); toast('chibi added');
  e.target.value='';
};
$('#fAudio').onchange = e => {
  [...e.target.files].forEach(f=>{
    const kind = f.type.startsWith('video')?'video':'audio';
    state.playlist.push({name:f.name, url:URL.createObjectURL(f), kind, blob:f});
  });
  save(); toast(state.playlist.length+' tracks');
  e.target.value='';
};
function kindOf(file){
  const n = file.name.toLowerCase(); const t = file.type||'';
  if(t.startsWith('image/')||/\.(png|jpe?g|gif|webp|heic|avif|svg)$/.test(n)) return 'image';
  if(t.startsWith('video/')||/\.(mp4|webm|mov|m4v)$/.test(n)) return 'video';
  if(t.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|opus|aac)$/.test(n)) return 'audio';
  if(/\.(glb|gltf)$/.test(n)) return '3d';
  if(/\.pdf$/.test(n)) return 'pdf';
  if(t.startsWith('text/')||/\.(txt|md|json|csv|html?|css|js|xml)$/.test(n)) return 'text';
  return 'file';
}

/* ---------- KEYBOARD SHORTCUTS ---------- */
addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    $$('.ov.on').forEach(o=>o.classList.remove('on'));
    state.hiveOpen = false; applyModes();
  }
  if(e.key==='g'){ state.grid = state.grid==='hex'?'flat':'hex'; applyModes(); }
  if(e.key==='m'){ state.mode = state.mode==='dark'?'rbg':'dark'; applyModes(); }
  if(e.key==='c'){ state.camBg = state.camBg==='on'?'off':'on'; applyModes(); startCamBg(); }
  if(e.key==='h'){ state.hiveOpen = !state.hiveOpen; applyModes(); }
});

/* ---------- BOOT ---------- */
(async function boot(){
  if(!state.repos){
    try{
      const r = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
      if(r.ok){
        const repos = await r.json();
        state.repos = repos.map(rp=>{
          let base = rp.homepage;
          if(!base || !base.startsWith('http')) base = `https://${USERNAME}.github.io/${rp.name}`;
          return {name:rp.name, base:base.replace(/\/+$/,''), desc:rp.description||''};
        });
        save();
      } else state.repos = [];
    }catch(e){ state.repos = []; }
  }
  renderTokens();
  renderNotes();
  renderHouses();
  if(!state.tokens.length){
    const r = $('#stage').getBoundingClientRect();
    addToken({x:r.width/2, y:r.height/2, emoji:'🐰', name:'hero'});
  }
  if(state.camBg==='on') startCamBg();
})();
