<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0400">
<title>Holo Hive</title>
<style>
:root{
  --o:#ff8a1f; --y:#ffd23f; --gold:#ffcc55;
  --ink:#ffe4c0; --ink2:#ffb070;
  --bg0:#0a0400; --bg1:#180800;
  --glass:rgba(28,12,0,.72);
  --border:rgba(255,150,60,.55);
  --pulse:.35;
  --rainbow:conic-gradient(from 0deg,#ff4d4d,#ffb84d,#ffee4d,#4dff88,#4dd2ff,#a64dff,#ff4dd2,#ff4d4d);
  --hex:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
}
body[data-mode="rbg"]{
  --bg0:#080000; --bg1:#180000;
  --card:#ffe9a8; --cardInk:#1a0000;
  --ink:#ffcc55; --ink2:#c98a2a;
  --o:#ffcc55; --y:#ffe9a8; --gold:#ffe9a8;
  --border:rgba(255,204,85,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;
  font:500 14px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--bg0);overscroll-behavior:none;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* ============ BACKGROUND ============ */
#bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(80% 60% at 50% 0%,var(--bg1) 0%,var(--bg0) 70%)}
#spheres{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sphere{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;
  transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.s1{width:55vw;height:55vw;left:5%;top:10%;background:radial-gradient(circle,rgba(255,140,60,.55),transparent 70%)}
.s2{width:45vw;height:45vw;right:5%;top:25%;background:radial-gradient(circle,rgba(160,80,255,.5),transparent 70%)}
.s3{width:60vw;height:60vw;left:20%;bottom:-10%;background:radial-gradient(circle,rgba(255,220,80,.35),transparent 70%)}
.s4{width:40vw;height:40vw;right:20%;bottom:0%;background:radial-gradient(circle,rgba(80,255,200,.35),transparent 70%)}
#bgGrid{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,150,60,calc(.05 + var(--pulse)*.14)) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,150,60,calc(.05 + var(--pulse)*.14)) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at center,#000 20%,transparent 100%);
  -webkit-mask-image:radial-gradient(circle at center,#000 20%,transparent 100%)}
#hexGrid{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;
  opacity:calc(.35 + var(--pulse)*.5)}
body[data-grid="hex"] #hexGrid{display:block}
body[data-grid="hex"] #bgGrid{opacity:0}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.08;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.85'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

/* ============ STAGE ============ */
#stage{position:fixed;inset:0;z-index:10;overflow:hidden;touch-action:none}
#world{position:absolute;inset:0;overflow:hidden;touch-action:none}

/* ============ HEX CHIP (base) ============ */
.hex{
  position:relative;width:52px;height:52px;display:grid;place-items:center;
  font-size:20px;color:var(--ink);cursor:pointer;border:0;padding:0;
  background:linear-gradient(155deg,rgba(255,200,120,.42),rgba(255,120,40,.16));
  clip-path:var(--hex);
  box-shadow:inset 0 0 0 1.5px rgba(255,220,150,.85),
    0 0 14px rgba(255,150,60,.5),
    inset 0 0 12px rgba(255,140,220,.28);
  backdrop-filter:blur(10px) saturate(1.2);
  -webkit-backdrop-filter:blur(10px) saturate(1.2);
  touch-action:none;
  transition:transform .12s;
  font-family:inherit;font-weight:700}
.hex:active{transform:scale(.9)}
.hex svg,.hex img{width:60%;height:60%;object-fit:contain;pointer-events:none}
.hex.rainbow::after{
  content:"";position:absolute;inset:0;clip-path:var(--hex);
  padding:2px;background:var(--rainbow);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:rbSpin 8s linear infinite;pointer-events:none}
@keyframes rbSpin{to{filter:hue-rotate(360deg)}}
.hex.big{width:60px;height:60px;font-size:24px}

/* ============ HIVE (bottom-right) ============ */
#hiveToggle{
  position:fixed;
  right:max(14px,env(safe-area-inset-right));
  bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));
  width:60px;height:60px;z-index:82;
  background:linear-gradient(155deg,rgba(255,200,120,.6),rgba(255,120,40,.35));
  box-shadow:inset 0 0 0 2px rgba(255,220,150,.95),
    0 0 26px rgba(255,150,60,.75),
    inset 0 0 22px rgba(255,140,220,.4)}
#hiveToggle.rot{transform:rotate(45deg) scale(.9)}

#hive{
  position:fixed;
  right:max(14px,env(safe-area-inset-right));
  bottom:calc(max(26px,env(safe-area-inset-bottom) + 14px) + 74px);
  display:flex;flex-direction:column-reverse;gap:6px;
  z-index:81;
  opacity:0;pointer-events:none;transform:translateY(16px);
  transition:opacity .25s,transform .25s;
  max-height:64vh}
#hive.open{opacity:1;pointer-events:auto;transform:translateY(0)}
#hive .hex{margin:0 auto}

#hivePages{display:flex;flex-direction:column-reverse;gap:6px}
.hivePage{display:none;flex-direction:column-reverse;gap:6px}
.hivePage.active{display:flex}

#hiveSwitch{
  position:fixed;
  right:calc(max(14px,env(safe-area-inset-right)) + 66px);
  bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));
  width:44px;height:44px;z-index:82;
  opacity:0;pointer-events:none;transition:opacity .2s;
  font-size:16px}
#hiveSwitch.on{opacity:1;pointer-events:auto}

/* ============ UPLOAD (left mid) ============ */
#uploadBtn{
  position:fixed;
  left:max(14px,env(safe-area-inset-left));
  top:50%;transform:translateY(-50%);
  z-index:76}
#uploadBtn:active{transform:translateY(-50%) scale(.9)}

/* ============ AUDIO HINT ============ */
#audioHint{
  position:fixed;
  left:max(14px,env(safe-area-inset-left));
  bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));
  width:52px;height:52px;z-index:76;
  background:linear-gradient(155deg,rgba(255,120,200,.55),rgba(180,80,255,.35));
  animation:pulseHint 1.6s ease-in-out infinite}
#audioHint.off{opacity:0;pointer-events:none;transform:scale(.4);transition:.5s}
@keyframes pulseHint{50%{box-shadow:inset 0 0 0 2px rgba(255,200,240,.95),
  0 0 30px rgba(255,120,220,.7),inset 0 0 22px rgba(255,120,220,.5)}}

/* ============ TOKEN ============ */
.token{
  position:absolute;width:54px;height:54px;border-radius:14px;
  background:linear-gradient(155deg,rgba(255,220,140,.4),rgba(255,140,60,.12));
  border:2px solid var(--gold);
  display:grid;place-items:center;font-size:28px;
  box-shadow:0 0 0 2px rgba(0,0,0,.3),0 6px 20px rgba(255,150,60,.5),
    inset 0 1px 0 rgba(255,255,255,.5);
  cursor:grab;z-index:20;transform:translate(-50%,-50%);
  touch-action:none;-webkit-user-drag:none;user-select:none}
.token.selected{
  box-shadow:0 0 0 3px var(--gold),0 6px 30px rgba(255,204,85,.9);
  animation:tokPulse 1.4s ease-in-out infinite}
@keyframes tokPulse{50%{box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(255,204,85,.8)}}
.token .tag{
  position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font-size:9px;font-weight:800;color:var(--gold);text-shadow:0 0 6px #000;
  background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px;
  white-space:nowrap;pointer-events:none}
.token img{width:100%;height:100%;object-fit:contain;border-radius:12px;pointer-events:none}

/* ============ NOTE ============ */
.noteCard{
  position:absolute;width:132px;min-height:74px;
  padding:8px 10px 22px;border-radius:12px;
  background:#ffe9a8;color:#2a0a00;font-size:11px;font-weight:700;line-height:1.25;
  cursor:grab;z-index:15;transform:translate(-50%,-50%);
  border:1.5px solid rgba(0,0,0,.32);
  box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6);
  touch-action:none}
.noteCard[data-suit="hearts"]{background:linear-gradient(150deg,#ffe4ee,#ff9ec3);color:#7a0a34}
.noteCard[data-suit="spades"]{background:linear-gradient(150deg,#e6e6f5,#9b9bc9);color:#1a1a44}
.noteCard[data-suit="diamonds"]{background:linear-gradient(150deg,#fff0d0,#ffcb85);color:#7a4400}
.noteCard[data-suit="clubs"]{background:linear-gradient(150deg,#e7ffe7,#8fe0a1);color:#0f5a26}
.noteCard[data-suit="gold"]{background:linear-gradient(150deg,#ffe9a8,#c98a2a);color:#2a0a00}
.noteCard .head{font-size:12px;font-weight:900;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noteCard textarea{
  width:100%;border:0;background:transparent;color:inherit;
  font:inherit;font-size:11px;resize:none;outline:none;min-height:36px;
  touch-action:auto;-webkit-user-select:text;user-select:text;padding:0}

/* ============ HOUSE ============ */
.house{position:absolute;z-index:14;pointer-events:none;transform:translate(-50%,-50%)}
.houseCard{
  position:absolute;width:92px;height:132px;border-radius:12px;
  background:#ffe9a8;color:#2a0a00;border:1.5px solid rgba(0,0,0,.35);
  box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 0 1px rgba(255,220,150,.5);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  pointer-events:auto;cursor:grab;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.houseCard .tag{
  position:absolute;bottom:2px;left:0;right:0;font-size:9px;font-weight:800;
  text-align:center;background:rgba(0,0,0,.5);color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 0 12px 12px}
.houseCard:hover{box-shadow:0 0 26px rgba(255,140,220,.75),0 6px 18px rgba(0,0,0,.5)}
.houseCard.fuse{animation:burningLove 1.3s ease-out}
@keyframes burningLove{
  0%{filter:brightness(1)}
  25%{filter:brightness(2.2) hue-rotate(30deg);
    box-shadow:0 0 46px rgba(255,80,140,.95),0 0 80px rgba(255,80,140,.5)}
  100%{filter:brightness(1)}
}
.house.wave .houseCard:nth-child(1){transform:rotate(-14deg) translate(-22px,8px) scale(.94)}
.house.wave .houseCard:nth-child(2){transform:rotate(0) translate(0,0);z-index:2}
.house.wave .houseCard:nth-child(3){transform:rotate(14deg) translate(22px,8px) scale(.94)}
.house.tent .houseCard:nth-child(1){transform:rotate(-30deg) translate(-18px,-4px)}
.house.tent .houseCard:nth-child(2){transform:rotate(30deg) translate(18px,-4px)}
.house.tent .houseCard:nth-child(3){transform:translate(0,32px);z-index:3}
.house.stair .houseCard:nth-child(1){transform:rotate(-8deg) translate(-22px,12px)}
.house.stair .houseCard:nth-child(2){transform:rotate(-8deg) translate(0,0);z-index:2}
.house.stair .houseCard:nth-child(3){transform:rotate(-8deg) translate(22px,-12px);z-index:3}

/* ============ WINDOW ============ */
.win{
  position:absolute;min-width:160px;min-height:110px;
  display:flex;flex-direction:column;
  background:var(--glass);
  border:1.5px solid var(--border);border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,200,120,.18);
  backdrop-filter:blur(18px) saturate(1.3);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  overflow:hidden;color:var(--ink);z-index:30;
  transition:box-shadow .15s}
.win::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:1.5px;background:var(--rainbow);opacity:.35;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:rbSpin 12s linear infinite}
.win.focused{
  box-shadow:0 16px 44px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,200,120,.2),
    0 0 0 1px rgba(255,180,80,.4),
    0 0 40px rgba(255,150,60,.25)}
.win.suit-hearts::after{content:"♥";position:absolute;top:2px;left:6px;font-size:13px;
  color:#ff7ab4;text-shadow:0 0 8px #ff7ab4;z-index:2;pointer-events:none}
.win.suit-diamonds::after{content:"♦";position:absolute;top:2px;left:6px;font-size:13px;
  color:#ffb450;text-shadow:0 0 8px #ffb450;z-index:2;pointer-events:none}
.win.suit-spades::after{content:"♠";position:absolute;top:2px;left:6px;font-size:13px;
  color:#a5a5ff;text-shadow:0 0 8px #a5a5ff;z-index:2;pointer-events:none}
.win.suit-clubs::after{content:"♣";position:absolute;top:2px;left:6px;font-size:13px;
  color:#7edc8c;text-shadow:0 0 8px #7edc8c;z-index:2;pointer-events:none}
.win.suit-gold::after{content:"★";position:absolute;top:2px;left:6px;font-size:13px;
  color:#ffe9a8;text-shadow:0 0 12px #ffcc55;z-index:2;pointer-events:none}
.winHead{
  flex:0 0 auto;height:34px;display:flex;align-items:center;gap:4px;
  padding:0 6px 0 22px;cursor:grab;touch-action:none;
  background:linear-gradient(180deg,rgba(255,180,80,.16),rgba(255,120,40,.04));
  border-bottom:1px solid var(--border)}
.winHead .title{flex:1;font-size:11px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.winHead .btns{display:flex;gap:4px}
.winHead .wbtn{
  width:26px;height:24px;border:0;border-radius:6px;cursor:pointer;
  display:grid;place-items:center;font:inherit;font-size:12px;font-weight:900;
  color:var(--ink);background:rgba(255,255,255,.08);
  touch-action:none;transition:transform .12s}
.winHead .wbtn:active{transform:scale(.85)}
.winHead .wbtn.center{background:linear-gradient(180deg,#7ed957,#3a8a2a);color:#fff}
.winHead .wbtn.max{background:linear-gradient(180deg,#ff8a1f,#c95a00);color:#fff}
.winHead .wbtn.cls{background:linear-gradient(180deg,#ff5a5a,#c00);color:#fff}
.winBody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;
  touch-action:auto}
.winBody iframe,.winBody video,.winBody img,.winBody model-viewer{
  width:100%;height:100%;border:0;object-fit:contain;background:#000}
.winBody pre{color:var(--ink);font-size:11px;padding:10px;
  white-space:pre-wrap;text-align:left;margin:0;overflow:auto;
  background:rgba(0,0,0,.3);flex:1}
.winBody audio{width:90%;margin:auto}
.eh{position:absolute;z-index:3;touch-action:none}
.eh.n{top:-6px;left:14px;right:14px;height:12px;cursor:ns-resize}
.eh.s{bottom:-6px;left:14px;right:14px;height:12px;cursor:ns-resize}
.eh.w{left:-6px;top:14px;bottom:14px;width:12px;cursor:ew-resize}
.eh.e{right:-6px;top:14px;bottom:14px;width:12px;cursor:ew-resize}
.eh.nw{top:-6px;left:-6px;width:22px;height:22px;cursor:nwse-resize}
.eh.ne{top:-6px;right:-6px;width:22px;height:22px;cursor:nesw-resize}
.eh.sw{bottom:-6px;left:-6px;width:22px;height:22px;cursor:nesw-resize}
.eh.se{bottom:-6px;right:-6px;width:22px;height:22px;cursor:nwse-resize}
.eh::after{content:"";position:absolute;inset:2px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,120,.75),transparent 70%);
  opacity:0;transition:opacity .15s;pointer-events:none}
.eh:active::after{opacity:1}

/* ============ TOAST ============ */
#toast{
  position:fixed;z-index:200;
  left:50%;bottom:100px;transform:translateX(-50%);
  padding:10px 16px;border-radius:14px;
  background:rgba(20,8,0,.95);color:var(--gold);
  font-size:12px;font-weight:800;
  opacity:0;transition:opacity .25s;pointer-events:none;
  border:1px solid var(--border);max-width:80vw;text-align:center}
#toast.on{opacity:1}

/* ============ HOLO PIXELS ============ */
body[data-pix="on"] #stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background-image:
    linear-gradient(rgba(255,200,120,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,200,120,.06) 1px,transparent 1px);
  background-size:3px 3px;mix-blend-mode:screen}

/* ============ CINEMA ============ */
#cine{position:fixed;inset:0;z-index:100;display:none;background:#000}
#cine.on{display:block}
#cine .bar{position:absolute;left:0;right:0;height:12vh;background:#000;
  z-index:3;transition:height .6s}
#cine .bar.top{top:0} #cine .bar.bot{bottom:0}
#cine.ready .bar{height:8vh}
#cine .frame{position:absolute;inset:8vh 6vw;overflow:hidden;border-radius:8px;
  background:#000;display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(255,204,85,.4),0 0 60px rgba(255,204,85,.25)}
#cine .slide{position:absolute;inset:0;display:grid;place-items:center;
  opacity:0;transition:opacity 1.2s ease}
#cine .slide.on{opacity:1}
#cine .slide img,#cine .slide video{width:100%;height:100%;object-fit:cover;
  animation:ken 8s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.08) translate(-2%,-2%)}}
#cine .slide .txt{color:var(--gold);font-size:20px;font-weight:800;
  text-align:center;padding:22px;text-shadow:0 0 20px rgba(255,204,85,.6);
  font-family:ui-serif,Georgia,serif;font-style:italic}
#cine .ctrl{position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);
  z-index:4;display:flex;gap:8px}
#cine .ctrl button{border:1px solid rgba(255,204,85,.5);
  background:rgba(20,8,0,.8);color:var(--gold);
  font:inherit;font-size:11px;font-weight:800;padding:10px 16px;
  border-radius:10px;cursor:pointer;backdrop-filter:blur(10px);
  touch-action:none}
#cine .ctrl button:active{transform:scale(.94)}

/* ============ JOYSTICK + A/B ============ */
#joypad{position:fixed;left:14px;bottom:100px;z-index:70;
  width:120px;height:120px;display:none;touch-action:none}
body[data-play="on"] #joypad{display:block}
#joypad .bg{width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,200,120,.18),rgba(60,20,0,.6));
  border:2px solid var(--border);
  box-shadow:inset 0 0 20px rgba(255,150,60,.3),0 0 24px rgba(255,150,60,.2)}
#joypad .stick{position:absolute;top:50%;left:50%;width:52px;height:52px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffdc9a,#ff8a1f 70%,#8a3a00);
  border:2px solid var(--gold);transform:translate(-50%,-50%);
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6);
  pointer-events:none}
#actions{position:fixed;right:14px;bottom:100px;z-index:70;display:none;gap:10px}
body[data-play="on"] #actions{display:flex}
#actions .abtn{width:58px;height:58px;border-radius:50%;
  border:2px solid var(--gold);color:#3a1e00;font-size:18px;font-weight:900;
  background:radial-gradient(circle at 35% 35%,#ffdc9a,#ff8a1f 70%,#8a3a00);
  box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6);
  touch-action:none;cursor:pointer}
#actions .abtn:active{transform:scale(.9)}

/* ============ CAM FULL ============ */
#camFull{position:fixed;inset:0;z-index:95;background:#000;
  display:none;flex-direction:column;touch-action:none}
#camFull.on{display:flex}
#camFull video{flex:1;width:100%;object-fit:cover}
#camFull .frame{position:absolute;inset:8%;
  border:2px dashed rgba(255,204,85,.7);border-radius:14px;
  box-shadow:0 0 24px rgba(255,204,85,.3);pointer-events:none}
#camFull .bar{padding:14px;display:flex;gap:8px;justify-content:center;
  background:rgba(0,0,0,.85)}

input[type=file]{display:none}
</style>
</head>
<body data-mode="dark" data-grid="hex" data-play="off" data-pix="off">

<div id="bg"></div>
<div id="spheres">
  <div class="sphere s1"></div><div class="sphere s2"></div>
  <div class="sphere s3"></div><div class="sphere s4"></div>
</div>
<div id="bgGrid"></div>
<canvas id="hexGrid"></canvas>
<div id="grain"></div>

<div id="stage"><div id="world"></div></div>

<!-- Upload chip (left mid) -->
<button class="hex big" id="uploadBtn" aria-label="upload">⬆</button>

<!-- Audio unlock hint (bottom-left) -->
<button class="hex big" id="audioHint" aria-label="enable sound">🔊</button>

<!-- Hive (bottom-right) -->
<div id="hive">
  <div id="hivePages">
    <div class="hivePage active" data-page="apps">
      <button class="hex" data-app="lab">🔬</button>

<div id="toast"></div>

<script>
/* ============================================================
   HOLO HIVE — mobile-first, no popups, audio unlocked
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const toast = t => {
  const e = $('#toast'); e.textContent = t; e.classList.add('on');
  clearTimeout(e._t); e._t = setTimeout(()=>e.classList.remove('on'), 1600);
};
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const USERNAME = 'worldpeacebtn';
const SUITS = {
  hearts:   'linear-gradient(150deg,#ffe4ee,#ff9ec3)',
  spades:   'linear-gradient(150deg,#e6e6f5,#9b9bc9)',
  diamonds: 'linear-gradient(150deg,#fff0d0,#ffcb85)',
  clubs:    'linear-gradient(150deg,#e7ffe7,#8fe0a1)',
  gold:     'linear-gradient(150deg,#ffe9a8,#c98a2a)'
};
const SUIT_CHAR = {hearts:'♥',spades:'♠',diamonds:'♦',clubs:'♣',gold:'★'};
const SUIT_INK  = {hearts:'#7a0a34',spades:'#1a1a44',diamonds:'#7a4400',clubs:'#0f5a26',gold:'#2a0a00'};

/* ===================== STATE ===================== */
const state = {
  mode: localStorage.getItem('hive.mode') || 'dark',
  grid: localStorage.getItem('hive.grid') || 'hex',
  play: localStorage.getItem('hive.play') || 'off',
  pix:  localStorage.getItem('hive.pix')  || 'off',
  hue:  parseFloat(localStorage.getItem('hive.hue') || '0'),
  tokens: JSON.parse(localStorage.getItem('hive.tokens') || '[]'),
  notes:  JSON.parse(localStorage.getItem('hive.notes')  || '[]'),
  houses: JSON.parse(localStorage.getItem('hive.houses') || '[]'),
  wins:   JSON.parse(localStorage.getItem('hive.wins')   || '{}'),
  playlist: [],
  ti: 0,
  zTop: 40,
  hiveOpen: false,
  hivePage: 'apps',
  cineLines: [], cineIdx: 0, cinePlaying: false, cineTimer: null
};
function save(){
  localStorage.setItem('hive.mode', state.mode);
  localStorage.setItem('hive.grid', state.grid);
  localStorage.setItem('hive.play', state.play);
  localStorage.setItem('hive.pix',  state.pix);
  localStorage.setItem('hive.hue',  state.hue);
  localStorage.setItem('hive.tokens', JSON.stringify(state.tokens));
  localStorage.setItem('hive.notes',  JSON.stringify(state.notes));
  localStorage.setItem('hive.houses', JSON.stringify(state.houses));
  localStorage.setItem('hive.wins',   JSON.stringify(state.wins));
}
function applyModes(){
  document.body.dataset.mode = state.mode;
  document.body.dataset.grid = state.grid;
  document.body.dataset.play = state.play;
  document.body.dataset.pix  = state.pix;
  document.documentElement.style.setProperty('--hue', state.hue);
}
applyModes();

/* ===================== AUDIO ENGINE (unlocked on first tap) ===================== */
let actx = null;
let musicEl = null, musicSrc = null, musicAnalyser = null, musicGain = null;
let audioUnlocked = false;

function unlockAudio(){
  if(audioUnlocked) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    actx.resume().then(() => {
      audioUnlocked = true;
      $('#audioHint').classList.add('off');
      // init music chain now that context is running
      musicEl = new Audio();
      musicEl.crossOrigin = 'anonymous';
      musicEl.playsInline = true;
      musicSrc = actx.createMediaElementSource(musicEl);
      musicAnalyser = actx.createAnalyser();
      musicAnalyser.fftSize = 128;
      musicGain = actx.createGain();
      musicGain.gain.value = 0.85;
      musicSrc.connect(musicAnalyser);
      musicAnalyser.connect(musicGain);
      musicGain.connect(actx.destination);
      pulseLoop();
      // hook time update
      musicEl.addEventListener('ended', () => nextTrack());
    });
  } catch(e){ console.warn('audio unlock failed', e); }
}
document.addEventListener('pointerdown', unlockAudio, {passive:true});
document.addEventListener('touchstart', unlockAudio, {passive:true});
document.addEventListener('click', unlockAudio, {passive:true});

function pulseLoop(){
  if(!musicAnalyser) return;
  const data = new Uint8Array(musicAnalyser.frequencyBinCount);
  (function loop(){
    if(document.hidden){ setTimeout(loop, 300); return; }
    musicAnalyser.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0) / data.length / 255;
    document.documentElement.style.setProperty('--pulse', (0.15 + avg*1.1).toFixed(3));
    requestAnimationFrame(loop);
  })();
}

function loadTrack(i){
  if(!state.playlist.length) return;
  state.ti = (i + state.playlist.length) % state.playlist.length;
  const t = state.playlist[state.ti];
  if(!musicEl) return;
  musicEl.src = t.url;
  musicEl.play().catch(()=>{});
  toast('♪ ' + t.name.replace(/\.[^.]+$/, ''));
}
function nextTrack(){ loadTrack(state.ti + 1); }
function prevTrack(){ loadTrack(state.ti - 1); }

/* ===================== HUE CIRCLE (moved to hive switch long-press) ===================== */
// Hue controlled by long-pressing the hive switch
let hueStart = null;
$('#hiveSwitch').addEventListener('pointerdown', e => {
  e.preventDefault();
  hueStart = { x: e.clientX, y: e.clientY, hue: state.hue };
  $('#hiveSwitch').setPointerCapture(e.pointerId);
});
$('#hiveSwitch').addEventListener('pointermove', e => {
  if(!hueStart) return;
  const dx = e.clientX - hueStart.x;
  state.hue = (hueStart.hue + dx * 1.2) % 360;
  if(state.hue < 0) state.hue += 360;
  applyModes(); save();
});
$('#hiveSwitch').addEventListener('pointerup', () => {
  if(hueStart && Math.abs(state.hue - hueStart.hue) < 1){
    switchHivePage();
  }
  hueStart = null;
});

/* ===================== HIVE ===================== */
$('#hiveToggle').addEventListener('pointerdown', e => {
  e.preventDefault();
  state.hiveOpen = !state.hiveOpen;
  $('#hive').classList.toggle('open', state.hiveOpen);
  $('#hiveToggle').classList.toggle('rot', state.hiveOpen);
  $('#hiveToggle').textContent = state.hiveOpen ? '✕' : '◈';
  $('#hiveSwitch').classList.toggle('on', state.hiveOpen);
});

function switchHivePage(){
  state.hivePage = state.hivePage === 'apps' ? 'tools' : 'apps';
  $$('.hivePage').forEach(p => p.classList.toggle('active', p.dataset.page === state.hivePage));
  $('#hiveSwitch').textContent = state.hivePage === 'apps' ? '›' : '‹';
  toast(state.hivePage === 'apps' ? 'apps' : 'tools');
}

$$('#hive .hex').forEach(el => {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    const app  = el.dataset.app;
    const tool = el.dataset.tool;
    if(app)  runApp(app);
    if(tool) runTool(tool);
    // auto-close hive after selection
    state.hiveOpen = false;
    $('#hive').classList.remove('open');
    $('#hiveToggle').classList.remove('rot');
    $('#hiveToggle').textContent = '◈';
    $('#hiveSwitch').classList.remove('on');
  });
});

function runApp(app){
  if(app === 'lab')   launchLab();
  if(app === 'cam')   openCam();
  if(app === 'view')  launchViewer();
  if(app === 'diary') launchDiary();
  if(app === 'dj')    launchDJ();
  if(app === 'char')  launchChar();
  if(app === 'quest') launchQuest();
  if(app === 'lib')   launchLib();
}

function runTool(tool){
  if(tool === 'token')  addTokenAtCenter('🐰', 'new');
  if(tool === 'note')   addNoteAtCenter();
  if(tool === 'house')  makeHouseTemplate();
  if(tool === 'grid'){  state.grid = state.grid === 'hex' ? 'flat' : 'hex'; applyModes(); save(); toast(state.grid); }
  if(tool === 'mode'){  state.mode = state.mode === 'dark' ? 'rbg' : 'dark'; applyModes(); save(); toast(state.mode); }
  if(tool === 'pix'){   state.pix  = state.pix  === 'on'   ? 'off' : 'on';   applyModes(); save(); toast('holo pixels'); }
  if(tool === 'play'){  state.play = state.play === 'on'   ? 'off' : 'on';   applyModes(); save(); toast(state.play); }
  if(tool === 'cine')   playCinematic();
}

/* ===================== UPLOAD ===================== */
$('#uploadBtn').addEventListener('pointerdown', e => { e.preventDefault(); $('#fUp').click(); });
$('#fUp').addEventListener('change', e => {
  const files = [...e.target.files];
  if(!files.length) return;
  // Preview first file in a new Viewer window
  const f = files[0];
  const url = URL.createObjectURL(f);
  const kind = kindOf(f);
  previewFile({ id: uid('u'), name: f.name, kind, url });
  toast(files.length + ' file' + (files.length>1?'s':''));
  e.target.value = '';
});
$('#fAudio').addEventListener('change', e => {
  const files = [...e.target.files];
  files.forEach(f => {
    const kind = f.type.startsWith('video/') ? 'video' : 'audio';
    state.playlist.push({ name: f.name, url: URL.createObjectURL(f), kind });
  });
  if(state.playlist.length && !musicEl?.src) loadTrack(0);
  toast(files.length + ' track' + (files.length>1?'s':''));
  e.target.value = '';
});

function kindOf(file){
  const n = file.name.toLowerCase(); const t = file.type || '';
  if(t.startsWith('image/') || /\.(png|jpe?g|gif|webp|heic|avif|svg)$/.test(n)) return 'image';
  if(t.startsWith('video/') || /\.(mp4|webm|mov|m4v)$/.test(n)) return 'video';
  if(t.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|opus|aac)$/.test(n)) return 'audio';
  if(/\.(glb|gltf)$/.test(n)) return '3d';
  if(/\.pdf$/.test(n)) return 'pdf';
  if(t.startsWith('text/') || /\.(txt|md|json|csv|html?|css|js|xml)$/.test(n)) return 'text';
  return 'file';
}

/* ===================== VIEWER ===================== */
function previewFile(u){
  const win = makeWin('view-' + u.id, u.name.slice(0, 18), '🖼', {
    w: Math.min(340, window.innerWidth - 40),
    h: Math.min(400, window.innerHeight - 120),
    suit: 'diamonds',
    content: body => {
      body.innerHTML = '';
      const src = u.url;
      if(u.kind === 'image'){
        const im = new Image(); im.src = src; body.appendChild(im);
      } else if(u.kind === 'video'){
        const v = document.createElement('video');
        v.src = src; v.controls = true; v.autoplay = true; v.playsInline = true; v.muted = false;
        body.appendChild(v);
      } else if(u.kind === 'audio'){
        const a = document.createElement('audio'); a.src = src; a.controls = true; a.autoplay = true;
        body.appendChild(a);
      } else if(u.kind === 'pdf'){
        const i = document.createElement('iframe'); i.src = src; body.appendChild(i);
      } else if(u.kind === '3d'){
        const mv = document.createElement('model-viewer');
        mv.setAttribute('src', src);
        mv.setAttribute('camera-controls', '');
        mv.setAttribute('auto-rotate', '');
        body.appendChild(mv);
      } else if(u.kind === 'html'){
        const i = document.createElement('iframe'); i.src = src; body.appendChild(i);
      } else if(u.kind === 'text'){
        fetch(src).then(r => r.text()).then(t => {
          const p = document.createElement('pre'); p.textContent = t; body.appendChild(p);
        }).catch(()=>{});
      } else {
        body.innerHTML = `<a style="color:var(--gold);padding:20px" href="${src}" download>download ${esc(u.name)}</a>`;
      }
    }
  });
  return win;
}
function launchViewer(){
  const win = makeWin('viewer', 'Viewer', '🖼', {
    w: 320, h: 360, suit: 'diamonds',
    content: body => {
      body.innerHTML = `<div style="color:var(--ink2);padding:20px;font-size:12px;text-align:center">
        tap ⬆ to upload a file<br><br>or open a memory from the Diary</div>`;
    }
  });
  // allow drop-in replacement of content by making this window a preview target
  win.previewTarget = true;
}

/* ===================== WINDOW MANAGER ===================== */
const wins = {};
function makeWin(id, title, icon, opts={}){
  if(wins[id]){
    focusWin(wins[id]);
    if(opts.content) opts.content(wins[id].el.querySelector('.winBody'), wins[id]);
    return wins[id];
  }
  const el = document.createElement('div');
  el.className = 'win';
  const suit = opts.suit || ['hearts','spades','diamonds','clubs','gold'][Math.floor(Math.random()*5)];
  el.classList.add('suit-' + suit);
  const s = state.wins[id] || {};
  const W = opts.w || s.w || 300;
  const H = opts.h || s.h || 240;
  const X = s.x ?? (window.innerWidth/2 - W/2 + (Math.random()*60-30));
  const Y = s.y ?? (70 + (Math.random()*80-40));
  el.style.width = W + 'px';
  el.style.height = H + 'px';
  el.style.left = clamp(X, 8, window.innerWidth - 60) + 'px';
  el.style.top  = clamp(Y, 8, window.innerHeight - 100) + 'px';
  el.style.zIndex = ++state.zTop;
  el.innerHTML = `
    <div class="winHead">
      <span style="font-size:14px">${icon}</span>
      <span class="title">${esc(title)}</span>
      <div class="btns">
        <button class="wbtn center" title="center">◎</button>
        <button class="wbtn max" title="max">▢</button>
        <button class="wbtn cls" title="close">✕</button>
      </div>
    </div>
    <div class="winBody"></div>
    <div class="eh n"></div><div class="eh s"></div>
    <div class="eh w"></div><div class="eh e"></div>
    <div class="eh nw"></div><div class="eh ne"></div>
    <div class="eh sw"></div><div class="eh se"></div>`;
  $('#world').appendChild(el);
  const w_ = { el, id, title, opts };
  wins[id] = w_;
  wireWin(w_);
  focusWin(w_);
  if(opts.content) opts.content(el.querySelector('.winBody'), w_);
  return w_;
}
function wireWin(w_){
  const { el, id } = w_;
  el.addEventListener('pointerdown', () => focusWin(w_), { capture:true });

  // drag by header
  const head = el.querySelector('.winHead');
  let dg = false, sx=0, sy=0, ox=0, oy=0;
  head.addEventListener('pointerdown', e => {
    if(e.target.classList.contains('wbtn')) return;
    e.preventDefault();
    dg = true;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
    head.setPointerCapture(e.pointerId);
    focusWin(w_);
  });
  head.addEventListener('pointermove', e => {
    if(!dg) return;
    el.style.left = clamp(ox + (e.clientX - sx), -40, window.innerWidth - 60) + 'px';
    el.style.top  = clamp(oy + (e.clientY - sy), 0, window.innerHeight - 80) + 'px';
  });
  head.addEventListener('pointerup', () => { dg = false; saveWin(w_); });

  // 8-edge resize
  ['n','s','w','e','nw','ne','sw','se'].forEach(dir => {
    const h = el.querySelector('.eh.' + dir);
    let rs = false, rx=0, ry=0, rw=0, rh=0, rl=0, rt=0;
    h.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      rs = true;
      rx = e.clientX; ry = e.clientY;
      rw = el.offsetWidth; rh = el.offsetHeight;
      rl = parseFloat(el.style.left); rt = parseFloat(el.style.top);
      h.setPointerCapture(e.pointerId);
      focusWin(w_);
    });
    h.addEventListener('pointermove', e => {
      if(!rs) return;
      const dx = e.clientX - rx, dy = e.clientY - ry;
      if(dir.includes('e')) el.style.width  = Math.max(160, rw + dx) + 'px';
      if(dir.includes('s')) el.style.height = Math.max(110, rh + dy) + 'px';
      if(dir.includes('w')){
        const nw = Math.max(160, rw - dx);
        el.style.width = nw + 'px';
        el.style.left  = (rl + (rw - nw)) + 'px';
      }
      if(dir.includes('n')){
        const nh = Math.max(110, rh - dy);
        el.style.height = nh + 'px';
        el.style.top    = (rt + (rh - nh)) + 'px';
      }
    });
    h.addEventListener('pointerup', () => { rs = false; saveWin(w_); });
  });

  // window controls
  el.querySelector('.wbtn.cls').addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    el.remove(); delete wins[id];
  });
  el.querySelector('.wbtn.max').addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    if(el.dataset.maxed){
      el.style.left = el.dataset.mx; el.style.top = el.dataset.my;
      el.style.width = el.dataset.mw; el.style.height = el.dataset.mh;
      delete el.dataset.maxed;
    } else {
      el.dataset.mx = el.style.left; el.dataset.my = el.style.top;
      el.dataset.mw = el.style.width; el.dataset.mh = el.style.height;
      el.style.left = '6px'; el.style.top = '6px';
      el.style.width = (window.innerWidth - 12) + 'px';
      el.style.height = (window.innerHeight - 12) + 'px';
      el.dataset.maxed = '1';
    }
    saveWin(w_);
  });
  el.querySelector('.wbtn.center').addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    el.style.left = (window.innerWidth/2  - el.offsetWidth/2)  + 'px';
    el.style.top  = (window.innerHeight/2 - el.offsetHeight/2) + 'px';
    saveWin(w_);
  });
}
function focusWin(w_){
  Object.values(wins).forEach(x => x.el.classList.remove('focused'));
  w_.el.classList.add('focused');
  w_.el.style.zIndex = ++state.zTop;
}
function saveWin(w_){
  state.wins[w_.id] = {
    x: parseFloat(w_.el.style.left) || 0,
    y: parseFloat(w_.el.style.top)  || 0,
    w: w_.el.offsetWidth,
    h: w_.el.offsetHeight
  };
  save();
}

/* ===================== APP LAUNCHERS ===================== */
function launchLab(){
  makeWin('lab', 'Lab · Decks', '🔬', {
    w: 320, h: 400, suit: 'spades',
    content: body => {
      body.innerHTML = '<div id="labGrid" style="flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px"></div>';
      const g = body.querySelector('#labGrid');
      if(!state.repos || !state.repos.length){
        g.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;font-size:11px;color:var(--ink2)">⏳ loading repos…</div>';
        fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=60&sort=updated`)
          .then(r => r.json()).then(repos => {
            state.repos = (repos || []).map(rp => {
              let base = rp.homepage;
              if(!base || !base.startsWith('http')) base = `https://${USERNAME}.github.io/${rp.name}`;
              return { name: rp.name, base: base.replace(/\/+$/, '') };
            });
            save();
            launchLabRefresh(body);
          }).catch(() => { g.innerHTML = '<div style="grid-column:1/-1;color:#f0883e">failed to load</div>'; });
      } else {
        launchLabRefresh(body);
      }
    }
  });
}
function launchLabRefresh(body){
  const g = body.querySelector('#labGrid');
  if(!g) return;
  g.innerHTML = '';
  (state.repos || []).forEach(rp => {
    const c = document.createElement('div');
    c.style.cssText = `background:${SUITS.gold};color:${SUIT_INK.gold};border-radius:12px;aspect-ratio:1;display:grid;place-items:center;padding:8px;cursor:pointer;font-weight:800;font-size:10px;text-align:center;border:1px solid var(--border);touch-action:none`;
    c.innerHTML = `<div style="font-size:22px">📁</div><div>${esc(rp.name.slice(0,14))}</div>`;
    c.addEventListener('pointerdown', e => {
      e.preventDefault();
      openRepoInLab(rp);
    });
    g.appendChild(c);
  });
  if(!state.repos?.length){
    g.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;font-size:11px;color:var(--ink2)">no repos</div>';
  }
}
async function openRepoInLab(rp){
  makeWin('stage-' + rp.name, rp.name.slice(0, 18), '🎴', {
    w: 300, h: 340, suit: 'hearts',
    content: body => {
      body.innerHTML = '<div style="color:var(--ink2);padding:20px;font-size:11px;text-align:center">⏳ loading files…</div>';
      fetch(`https://api.github.com/repos/${USERNAME}/${rp.name}/contents/`)
        .then(r => r.ok ? r.json() : [])
        .then(files => {
          const htmls = (Array.isArray(files) ? files : []).filter(f =>
            f.type === 'file' && /\.(html?|png|jpe?g|gif|mp4|mp3|m4a|pdf|glb|txt)$/i.test(f.name));
          if(!htmls.length){ body.innerHTML = '<div style="padding:20px;font-size:11px;text-align:center;color:var(--ink2)">no previewable files</div>'; return; }

/* ===================== CAMERA (full screen) ===================== */
let camStream = null;
async function openCam(){
  const c = $('#camFull');
  c.classList.add('on');
  const v = $('#camVideo');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    v.srcObject = camStream;
  } catch(e){ toast('camera blocked: ' + e.message); }
}
$('#camClose').addEventListener('pointerdown', e => {
  e.preventDefault();
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('#camFull').classList.remove('on');
});
$('#camShot').addEventListener('pointerdown', e => {
  e.preventDefault();
  if(!camStream) return;
  const v = $('#camVideo');
  const cv = document.createElement('canvas');
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext('2d').drawImage(v, 0, 0);
  cv.toBlob(b => {
    const url = URL.createObjectURL(b);
    state.playlist.push({ name: 'scan-' + Date.now() + '.png', url, kind: 'image' });
    toast('📸 saved to memories');
  }, 'image/png');
});
$('#camRec').addEventListener('pointerdown', e => {
  e.preventDefault();
  if(!camStream) return;
  try {
    const rec = new MediaRecorder(camStream);
    const chunks = [];
    rec.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
    rec.onstop = () => {
      const b = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
      const url = URL.createObjectURL(b);
      state.playlist.push({ name: 'clip-' + Date.now() + '.webm', url, kind: 'video' });
      toast('🎥 saved to memories');
    };
    rec.start();
    toast('🎥 recording… tap again to stop');
    setTimeout(() => { if(rec.state === 'recording') rec.stop(); }, 5000);
  } catch(err){ toast('rec failed'); }
});

/* ===================== CINEMA ===================== */
const cine = $('#cine');
const cineFrame = $('#cineFrame');
function openCine(){
  cine.classList.add('on'); cine.classList.remove('ready');
  setTimeout(() => cine.classList.add('ready'), 350);
  state.cineIdx = 0;
  renderCineSlide(); cinePlay();
}
function closeCine(){
  cine.classList.remove('on');
  cinePlay(false);
  cineFrame.innerHTML = '';
}
function renderCineSlide(){
  const L = state.cineLines[state.cineIdx];
  if(!L) return;
  cineFrame.innerHTML = '';
  if(L.startsWith('@media')){
    const fn = L.slice(6).trim();
    const u = state.playlist.find(t => t.name === fn);
    const s = document.createElement('div'); s.className = 'slide on';
    if(u && u.kind === 'video'){
      const v = document.createElement('video'); v.src = u.url; v.muted = true; v.playsInline = true;
      v.loop = true; v.autoplay = true; s.appendChild(v);
    } else if(u){
      const im = new Image(); im.src = u.url; s.appendChild(im);
    } else {
      s.innerHTML = `<div class="txt">@media ${esc(fn)}</div>`;
    }
    cineFrame.appendChild(s);
  } else {
    cineFrame.innerHTML = `<div class="slide on"><div class="txt">${esc(L)}</div></div>`;
  }
}
function cinePlay(on){
  if(on === false || state.cinePlaying){
    clearTimeout(state.cineTimer); state.cinePlaying = false;
    $('#cinePlay').textContent = '▶'; return;
  }
  state.cinePlaying = true;
  $('#cinePlay').textContent = '⏸';
  cineStep();
}
function cineStep(){
  if(!state.cinePlaying) return;
  state.cineTimer = setTimeout(() => {
    state.cineIdx++;
    if(state.cineIdx >= state.cineLines.length){
      state.cinePlaying = false;
      $('#cinePlay').textContent = '▶';
      return;
    }
    renderCineSlide(); cineStep();
  }, 2400);
}
$('#cinePlay').addEventListener('pointerdown', e => { e.preventDefault(); cinePlay(); });
$('#cineNext').addEventListener('pointerdown', e => {
  e.preventDefault();
  state.cineIdx = Math.min(state.cineLines.length - 1, state.cineIdx + 1);
  renderCineSlide();
});
$('#cineExit').addEventListener('pointerdown', e => { e.preventDefault(); closeCine(); });

function playCinematic(){
  if(!state.cineLines.length){
    state.cineLines = ['◈ Holo Hive ready', 'Drop a token on the stage', 'Save a note — then press A'];
  }
  openCine();
}

function addTokenAtCenter(emoji, name){

function addToken({ x, y, emoji = '🐰', src, name = '' }){
  const t = { id: uid('t'), x, y, emoji, src, name };
  state.tokens.push(t); save(); renderTokens();
}
function renderTokens(){
  $$('.token').forEach(e => e.remove());
  state.tokens.forEach(t => {
    const el = document.createElement('div');
    el.className = 'token'; el.dataset.id = t.id;
    el.style.left = t.x + 'px'; el.style.top = t.y + 'px';
    if(t.src){ const im = document.createElement('img'); im.src = t.src; el.appendChild(im); }
    else el.textContent = t.emoji || '🐰';
    if(t.name){
      const tg = document.createElement('div'); tg.className = 'tag';
      tg.textContent = t.name; el.appendChild(tg);
    }
    wireTokenDrag(el, t);
    el.addEventListener('pointerdown', e => { e.stopPropagation(); }, { capture:true });
    el.addEventListener('pointerup', () => {
      if(!el._dragged){
        $$('.token').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
      }
    });
    $('#world').appendChild(el);
  });
}
function wireTokenDrag(el, t){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    dragging = true;
    el._dragged = false;
    el.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY;
    ox = t.x; oy = t.y;
    el.style.zIndex = 999;
  });
  el.addEventListener('pointermove', e => {
    if(!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.hypot(dx, dy) > 5) el._dragged = true;
    t.x = ox + dx; t.y = oy + dy;
    el.style.left = t.x + 'px'; el.style.top = t.y + 'px';
  });
  el.addEventListener('pointerup', () => {
    if(!dragging) return;
    dragging = false;
    el.style.zIndex = '';
    // snap to honeycomb grid
    t.x = Math.round(t.x / 30) * 30;
    t.y = Math.round(t.y / 30) * 30;
    // collision avoid
    resolveTokenCollision(t);
    el.style.left = t.x + 'px'; el.style.top = t.y + 'px';
    save();
    setTimeout(() => { el._dragged = false; }, 80);
  });
  el.addEventListener('pointercancel', () => { dragging = false; el.style.zIndex = ''; });
}
function resolveTokenCollision(t){
  const R = 58;
  for(const o of state.tokens){
    if(o === t) continue;
    const dx = t.x - o.x, dy = t.y - o.y;
    const d = Math.hypot(dx, dy);
    if(d < R && d > 0.1){
      const push = (R - d);
      t.x += (dx / d) * push;
      t.y += (dy / d) * push;
    }
  }
}

function addNoteAtCenter(){
  const r = $('#stage').getBoundingClientRect();
  addNote({ x: r.width/2, y: r.height/2, title: 'note', body: 'tap to edit', suit: 'gold' });
}
function addNote({ x, y, title = 'note', body = '…', suit }){
  const s = suit || ['hearts','diamonds','spades','clubs','gold'][Math.floor(Math.random()*5)];
  const n = { id: uid('n'), x, y, title, body, suit: s };
  state.notes.push(n); save(); renderNotes();
}
function renderNotes(){
  $$('.noteCard').forEach(e => e.remove());
  state.notes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'noteCard';
    el.dataset.id = n.id; el.dataset.suit = n.suit;
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    el.innerHTML = `
      <div class="head">${SUIT_CHAR[n.suit]} ${esc(n.title)}</div>
      <textarea rows="2">${esc(n.body)}</textarea>`;
    const ta = el.querySelector('textarea');
    ta.addEventListener('input', () => { n.body = ta.value; save(); });
    wireNoteDrag(el, n);
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      state.notes = state.notes.filter(x => x.id !== n.id);
      save(); renderNotes();
    });
    $('#world').appendChild(el);
  });
}
function wireNoteDrag(el, n){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener('pointerdown', e => {
    if(e.target.tagName === 'TEXTAREA') return;
    e.preventDefault(); e.stopPropagation();
    dragging = true;
    el.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY;
    ox = n.x; oy = n.y;
    el.style.zIndex = 999;
  });
  el.addEventListener('pointermove', e => {
    if(!dragging) return;
    n.x = ox + (e.clientX - sx);
    n.y = oy + (e.clientY - sy);
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    // detect overlap
    let over = null;
    $$('.noteCard').forEach(other => {
      if(other === el) return;
      const r1 = el.getBoundingClientRect(), r2 = other.getBoundingClientRect();
      const ix = Math.max(0, Math.min(r1.right, r2.right) - Math.max(r1.left, r2.left));
      const iy = Math.max(0, Math.min(r1.bottom, r2.bottom) - Math.max(r1.top, r2.top));
      if(ix * iy > r1.width * r1.height * 0.3) over = other.dataset.id;
    });
    el.style.outline = over ? '2px solid var(--gold)' : '';
    el._overId = over;
  });
  el.addEventListener('pointerup', () => {
    if(!dragging) return;
    dragging = false;
    el.style.zIndex = ''; el.style.outline = '';
    if(el._overId){
      const other = state.notes.find(x => x.id === el._overId);
      if(other) makeHouse([n, other]);
    }
    save();
  });
  el.addEventListener('pointercancel', () => { dragging = false; el.style.zIndex = ''; });
}

/* ===================== CARD HOUSES ===================== */
function makeHouse(cards){
  if(!cards || cards.length < 2) return;
  const cx = cards.reduce((a, c) => a + c.x, 0) / cards.length;
  const cy = cards.reduce((a, c) => a + c.y, 0) / cards.length;
  const layouts = ['wave', 'tent', 'stair'];
  const house = {
    id: uid('h'),
    x: cx, y: cy,
    layout: layouts[Math.floor(Math.random() * layouts.length)],
    cards: cards.map(c => ({ title: c.title, body: c.body, suit: c.suit }))
  };
  if(house.cards.length === 2){
    house.cards.splice(1, 0, { title: '·', body: 'fused', suit: 'gold' });
  }
  state.houses.push(house);
  state.notes = state.notes.filter(n => !cards.find(c => c.id === n.id));
  save(); renderNotes(); renderHouses();
  setTimeout(() => {
    $$('.houseCard').forEach(hc => {
      hc.classList.add('fuse');
      setTimeout(() => hc.classList.remove('fuse'), 1400);
    });
  }, 80);
  toast('🏠 ' + house.layout + ' · ' + house.cards.length + ' cards');
}
function makeHouseTemplate(){
  const r = $('#stage').getBoundingClientRect();
  state.houses.push({
    id: uid('h'), x: r.width/2, y: r.height/2, layout: 'wave',
    cards: [
      { title: 'A', body: 'left', suit: 'hearts' },
      { title: 'K', body: 'king', suit: 'gold' },
      { title: 'Q', body: 'queen', suit: 'spades' }
    ]
  });
  save(); renderHouses();
  toast('🏠 house template');
}
function renderHouses(){
  $$('.house').forEach(e => e.remove());
  state.houses.forEach(h => {
    const wrap = document.createElement('div');
    wrap.className = 'house ' + h.layout;
    wrap.style.left = h.x + 'px'; wrap.style.top = h.y + 'px';
    h.cards.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'houseCard';
      el.style.background = SUITS[c.suit] || SUITS.gold;
      el.style.color = SUIT_INK[c.suit] || SUIT_INK.gold;
      el.innerHTML = `<div style="text-align:center">
        <div style="font-size:14px">${SUIT_CHAR[c.suit] || '★'}</div>
        <div style="font-size:11px;font-weight:900;margin-top:4px">${esc(c.title||'')}</div></div>
        <div class="tag">${esc((c.body||'').slice(0,20))}</div>`;
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        state.notes.push({ id: uid('n'), x: h.x + (i - 1) * 60, y: h.y, title: c.title, body: c.body, suit: c.suit });
        state.houses = state.houses.filter(x => x.id !== h.id);
        save(); renderHouses(); renderNotes();
        toast('house dissolved');
      });
      wrap.appendChild(el);
    });
    $('#world').appendChild(wrap);
  });
}

/* ===================== JOYSTICK + A/B ===================== */
const stick = document.createElement('div');
const joypad = document.createElement('div');
joypad.id = 'joypad';
joypad.innerHTML = '<div class="bg"></div><div class="stick" id="stick"></div>';
document.body.appendChild(joypad);
const actions = document.createElement('div');
actions.id = 'actions';
actions.innerHTML = '<button class="abtn" id="btnB">B</button><button class="abtn" id="btnA">A</button>';
document.body.appendChild(actions);

let stickActive = false, origin = {x:0, y:0};
const stickEl = joypad.querySelector('#stick');
joypad.addEventListener('pointerdown', e => {
  e.preventDefault();
  stickActive = true;
  joypad.setPointerCapture(e.pointerId);
  const r = joypad.getBoundingClientRect();
  origin = { x: r.left + r.width/2, y: r.top + r.height/2 };
});
joypad.addEventListener('pointermove', e => {
  if(!stickActive) return;
  const dx = e.clientX - origin.x, dy = e.clientY - origin.y;
  const mag = Math.min(40, Math.hypot(dx, dy));
  const ang = Math.atan2(dy, dx);
  const nx = Math.cos(ang) * mag, ny = Math.sin(ang) * mag;
  stickEl.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
  const sel = document.querySelector('.token.selected');
  if(sel){
    const t = state.tokens.find(x => x.id === sel.dataset.id);
    if(t){ t.x += nx * 0.25; t.y += ny * 0.25; sel.style.left = t.x + 'px'; sel.style.top = t.y + 'px'; }
  }
});
joypad.addEventListener('pointerup', () => {
  stickActive = false;
  stickEl.style.transform = 'translate(-50%,-50%)';
  const sel = document.querySelector('.token.selected');
  if(sel){
    const t = state.tokens.find(x => x.id === sel.dataset.id);
    if(t){
      t.x = Math.round(t.x / 30) * 30; t.y = Math.round(t.y / 30) * 30;
      resolveTokenCollision(t);
      sel.style.left = t.x + 'px'; sel.style.top = t.y + 'px'; save();
    }
  }
});
document.getElementById('btnA').addEventListener('pointerdown', e => {
  e.preventDefault();
  const sel = document.querySelector('.token.selected');
  if(!sel){ toast('select a token first'); return; }
  const t = state.tokens.find(x => x.id === sel.dataset.id);
  if(!t) return;
  const near = state.notes.find(n => Math.hypot(n.x - t.x, n.y - t.y) < 120);
  if(near){
    state.cineLines = (near.body || near.title).split('\n').filter(Boolean);
    openCine();
  } else {
    toast('✦ nothing nearby');
  }
});
document.getElementById('btnB').addEventListener('pointerdown', e => {
  e.preventDefault();
  $$('.token').forEach(x => x.classList.remove('selected'));
});

/* ===================== HEX GRID BACKGROUND ===================== */
(function drawHex(){
  const c = $('#hexGrid'); const ctx = c.getContext('2d');
  function draw(){
    c.width = window.innerWidth * devicePixelRatio;
    c.height = window.innerHeight * devicePixelRatio;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.scale(devicePixelRatio, devicePixelRatio);
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const s = 32, w = Math.sqrt(3) * s, h = 2 * s;
    ctx.strokeStyle = 'rgba(255,150,60,.18)';
    ctx.lineWidth = 1;
    for(let y = 0, row = 0; y < window.innerHeight + h; y += h * 0.75, row++){
      for(let x = (row % 2 ? w/2 : 0); x < window.innerWidth + w; x += w){
        ctx.beginPath();
        for(let i = 0; i < 6; i++){
          const a = Math.PI / 180 * (60 * i - 30);
          const px = x + s * Math.cos(a), py = y + s * Math.sin(a);
          if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      }
    }
  }
  draw();
  window.addEventListener('resize', draw);
})();

/* ===================== PARALLAX SPHERES ===================== */
window.addEventListener('pointermove', e => {
  const cx = e.clientX / window.innerWidth - .5;
  const cy = e.clientY / window.innerHeight - .5;
  $$('.sphere').forEach((el, i) => {
    const sp = 0.6 + i * 0.35;
    el.style.transform = `translate(${cx * 30 * sp}px, ${cy * 30 * sp}px)`;
  });
}, { passive: true });

/* ===================== BOOT ===================== */
window.addEventListener('load', () => {
  // Ensure something visible on first run
  if(!state.tokens.length){
    const r = $('#stage').getBoundingClientRect();
    addToken({ x: r.width/2, y: r.height/2, emoji: '🐰', name: 'hero' });
  }
  if(!state.notes.length){
    const r = $('#stage').getBoundingClientRect();
    addNote({
      x: r.width/2 + 100, y: r.height/2 - 40,
      title: 'welcome',
      body: 'Drag tokens.\nPress A to trigger scenes.',
      suit: 'gold'
    });
  }
  renderTokens();
  renderNotes();
  renderHouses();

  // Detect first user interaction to unlock audio
  const onFirst = () => { unlockAudio(); };
  document.addEventListener('pointerdown', onFirst, { once: true, passive: true });

  toast('◈ tap 🔊 to enable sound');
});

/* ===================== PREVENT PULL-TO-REFRESH ===================== */
document.addEventListener('touchmove', e => {
  if(e.target.closest('textarea') || e.target.closest('input')) return;
  if(e.target.closest('.winBody')) return;
  e.preventDefault();
}, { passive: false });
