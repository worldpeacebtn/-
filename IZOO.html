<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0400">
<title>St. Pauli Zauberwald</title>
<style>
:root{
  --o:#ff8a1f; --y:#ffd23f; --gold:#ffcc55;
  --ink:#ffe4c0; --ink2:#ffb070;
  --bg0:#0a0400;
  --glass:rgba(28,12,0,.75);
  --border:rgba(255,150,60,.5);
  --glitter:conic-gradient(from 0deg,#ff4dd2,#ffb84d,#4dffaa,#4dd2ff,#a64dff,#ff4dd2);
  --water:#4dc4ff; --water2:#1a5a8a;
  --grass:#7ae0a8; --grass2:#3f9d6a;
  --sand:#ffe4a8; --sand2:#c9a55a;
  --wood:#7a4d2a; --wood2:#3a2410;
  --stone:#a8b8c8; --stone2:#5a6a7a;
  --hex:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;
  font:500 14px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:radial-gradient(80% 60% at 50% 0%,#1a0a04 0%,#0a0400 70%);
  overscroll-behavior:none;touch-action:manipulation;
  user-select:none;-webkit-user-select:none}

/* ================= TOP ZONE BAR ================= */
#zoneBar{
  position:fixed;top:max(8px,env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);
  display:flex;gap:6px;padding:6px;z-index:80;
  background:rgba(20,8,0,.75);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:20px;
  max-width:96vw;overflow-x:auto;scrollbar-width:none}
#zoneBar::-webkit-scrollbar{display:none}
.zb{
  flex:0 0 auto;padding:8px 12px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--ink);font:inherit;font-size:11px;font-weight:800;
  cursor:pointer;touch-action:none;white-space:nowrap;
  transition:transform .12s, background .2s}
.zb:active{transform:scale(.94)}
.zb.on{background:linear-gradient(180deg,var(--y),var(--o));color:#1a0000;border-color:transparent}

/* ================= VIEWS ================= */
.view{
  position:fixed;inset:0;z-index:10;
  opacity:0;pointer-events:none;
  transition:opacity .3s}
.view.on{opacity:1;pointer-events:auto}

/* ================= ISLAND (2.5D) ================= */
#view-island{
  perspective:1200px;
  perspective-origin:50% 60%;
  background:
    radial-gradient(120% 100% at 50% 0%, #ffe9a8 0%, #ff8a1f 30%, #1a5a8a 70%, #0a2a44 100%)}
#islandStage{
  position:absolute;left:50%;top:55%;
  width:520px;height:520px;
  transform-style:preserve-3d;
  transform:translate(-50%,-50%) rotateX(58deg) rotateZ(-45deg) translateZ(-40px);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
body[data-view="2d"] #islandStage{
  transform:translate(-50%,-50%) rotateX(0deg) rotateZ(0deg) translateZ(0);}

#islandGrid{
  position:absolute;inset:0;
  display:grid;
  grid-template-columns:repeat(13,1fr);
  grid-template-rows:repeat(13,1fr);
  gap:1px;
  transform-style:preserve-3d}
.tile{
  position:relative;
  border-radius:3px;
  transition:filter .15s}
.tile.water{background:linear-gradient(155deg,var(--water),var(--water2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);animation:waterShift 4s ease-in-out infinite alternate}
.tile.water::after{content:"";position:absolute;inset:10%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),transparent 60%);
  border-radius:50%;opacity:.5;animation:waterShift 3s ease-in-out infinite alternate}
@keyframes waterShift{
  0%{filter:brightness(1)}
  100%{filter:brightness(1.15) saturate(1.15)}}
.tile.sand{background:linear-gradient(155deg,var(--sand),var(--sand2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.tile.grass{background:linear-gradient(155deg,var(--grass),var(--grass2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tile.grass.flower::after{content:"🌸";position:absolute;font-size:14px;
  top:50%;left:50%;transform:translate(-50%,-50%) rotateZ(45deg) rotateX(-58deg)}
.tile.grass.high::after{content:"🌿";position:absolute;font-size:18px;
  top:50%;left:50%;transform:translate(-50%,-50%) rotateZ(45deg) rotateX(-58deg)}
.tile.wood{background:linear-gradient(155deg,var(--wood),var(--wood2));
  box-shadow:inset 0 1px 0 rgba(255,200,120,.3)}
.tile.wood.tree::after{content:"🌳";position:absolute;font-size:34px;
  top:50%;left:50%;transform:translate(-50%,-75%) rotateZ(45deg) rotateX(-58deg);
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));
  animation:treeSway 5s ease-in-out infinite alternate}
@keyframes treeSway{
  from{transform:translate(-50%,-75%) rotateZ(45deg) rotateX(-58deg) rotate(-2deg)}
  to{transform:translate(-50%,-75%) rotateZ(45deg) rotateX(-58deg) rotate(2deg)}}
.tile.stone{background:linear-gradient(155deg,var(--stone),var(--stone2))}

/* deck (floors) */
#islandStage::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,.4) 100%);
  transform:translateZ(-10px);pointer-events:none}

/* Entities on the island */
.entity{
  position:absolute;
  width:38px;height:38px;
  display:grid;place-items:center;
  font-size:30px;line-height:1;
  transform:translate(-50%,-75%) rotateZ(45deg) rotateX(-58deg);
  transform-origin:center bottom;
  z-index:5;cursor:pointer;touch-action:none;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));
  transition:left .25s cubic-bezier(.34,1.56,.64,1),
    top .25s cubic-bezier(.34,1.56,.64,1),
    transform .2s}
body[data-view="2d"] .entity{transform:translate(-50%,-75%)}
.entity.player{
  z-index:20;
  animation:playerIdle 1.6s ease-in-out infinite}
@keyframes playerIdle{
  0%,100%{filter:drop-shadow(0 6px 8px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(255,220,150,.5))}
  50%{filter:drop-shadow(0 4px 6px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,220,150,.85))}}
.entity.player.facing-left{transform:translate(-50%,-75%) rotateZ(45deg) rotateX(-58deg) scaleX(-1)}
body[data-view="2d"] .entity.player.facing-left{transform:translate(-50%,-75%) scaleX(-1)}
.entity.player.hop{animation:hop .3s ease}
@keyframes hop{
  0%{transform:translate(-50%,-75%) rotateZ(45deg) rotateX(-58deg) scale(1)}
  45%{transform:translate(-50%,-115%) rotateZ(45deg) rotateX(-58deg) scaleY(.9)}
  100%{transform:translate(-50%,-75%) rotateZ(45deg) rotateX(-58deg)}}
.entity .lbl{
  position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
  font-size:8px;font-weight:800;color:var(--gold);
  text-shadow:0 0 6px #000;white-space:nowrap;
  padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.5);
  pointer-events:none}

/* Floating decorations */
.floatIcon{
  position:absolute;font-size:20px;pointer-events:none;
  animation:floatUp 4s ease-in-out infinite;
  filter:drop-shadow(0 0 6px rgba(255,220,150,.9));
  z-index:15}
@keyframes floatUp{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}}

/* Tower glow */
.towerGlow{
  position:absolute;width:140px;height:140px;border-radius:50%;
  pointer-events:none;z-index:3;
  background:radial-gradient(circle, rgba(255,180,80,.5), transparent 70%);
  transform:translate(-50%,-50%);
  animation:glowPulse 3s ease-in-out infinite alternate}
@keyframes glowPulse{
  from{transform:translate(-50%,-50%) scale(.7);opacity:.5}
  to{transform:translate(-50%,-50%) scale(1.3);opacity:.85}}

/* Sky sparkles overlay */
#skySparkles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.sparkle{
  position:absolute;font-size:14px;pointer-events:none;
  animation:sparkleFall linear infinite;opacity:.85}
@keyframes sparkleFall{
  0%{transform:translateY(-10vh) rotate(0);opacity:0}
  20%{opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ================= JOYSTICK ================= */
#joy{
  position:fixed;left:16px;bottom:max(16px,env(safe-area-inset-bottom));
  width:130px;height:130px;z-index:60;touch-action:none}
#joy .jbg{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,200,120,.15),rgba(60,20,0,.55));
  border:2px solid var(--border);
  box-shadow:inset 0 0 24px rgba(255,150,60,.3),
    0 0 30px rgba(255,150,60,.25)}
#joy .stick{
  position:absolute;left:50%;top:50%;
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe9a8,#ff8a1f 70%,#8a3a00);
  border:2px solid var(--gold);
  transform:translate(-50%,-50%);
  box-shadow:0 4px 14px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.6);
  pointer-events:none}

/* action buttons */
#actions{
  position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));
  z-index:60;display:flex;gap:10px}
#actions button{
  width:60px;height:60px;border-radius:50%;
  border:2px solid var(--gold);cursor:pointer;touch-action:none;
  color:#1a0000;font-size:16px;font-weight:900;
  background:radial-gradient(circle at 35% 30%,#ffe9a8,#ff8a1f 70%,#8a3a00);
  box-shadow:0 6px 16px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .12s}
#actions button:active{transform:scale(.9)}
#actions button.b{background:radial-gradient(circle at 35% 30%,#ffd0a8,#c95a2e 70%,#5a1a10);color:#fff}

/* upload chip */
#uploadChip{
  position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:60;width:60px;height:60px;
  display:grid;place-items:center;font-size:24px;color:var(--ink);
  background:linear-gradient(155deg,rgba(255,200,120,.5),rgba(255,120,40,.22));
  clip-path:var(--hex);border:0;cursor:pointer;touch-action:none;
  box-shadow:inset 0 0 0 2px rgba(255,220,150,.9),
    0 0 20px rgba(255,150,60,.55)}
#uploadChip:active{transform:translateX(-50%) scale(.92)}

/* ================= BUBBLE (npc dialogue) ================= */
#bubble{
  position:fixed;left:50%;top:clamp(80px,20vh,200px);
  transform:translateX(-50%);
  z-index:70;max-width:82vw;
  padding:12px 18px;border-radius:16px;
  background:linear-gradient(160deg,#fff6ea,#ffe4c0);
  color:#3a1e00;
  border:2px solid #3a1e00;
  box-shadow:0 8px 24px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.7);
  font-size:13px;font-weight:700;line-height:1.35;
  text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s}
#bubble.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
#bubble::after{
  content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:10px solid #3a1e00}

/* ================= LIBRARY (4 rooms) ================= */
#view-library{
  background:linear-gradient(160deg,#2a1a08 0%,#0a0604 100%);
  overflow:auto;padding-top:calc(60px + env(safe-area-inset-top));
  padding-bottom:100px}
#libraryGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;padding:20px;max-width:760px;margin:0 auto}
@media (min-width:700px){#libraryGrid{grid-template-columns:repeat(4,1fr)}}
.roomCard{
  aspect-ratio:1;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,200,120,.18),rgba(120,60,20,.12));
  border:1.5px solid var(--border);
  cursor:pointer;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,220,150,.4);
  transition:transform .2s, box-shadow .3s;
  position:relative;overflow:hidden}
.roomCard::before{
  content:"";position:absolute;inset:0;border-radius:18px;
  background:radial-gradient(circle at 50% 0%,rgba(255,200,120,.2),transparent 60%);
  pointer-events:none}
.roomCard:active{transform:scale(.96)}
.roomCard:hover{box-shadow:0 10px 30px rgba(0,0,0,.5),
  inset 0 1px 0 rgba(255,220,150,.5),
  0 0 40px rgba(255,180,80,.5)}
.roomCard .rEmoji{font-size:52px;line-height:1;
  filter:drop-shadow(0 0 14px rgba(255,180,80,.7));
  margin-bottom:8px}
.roomCard .rName{font-size:14px;font-weight:900;color:var(--gold);
  letter-spacing:.5px;text-transform:uppercase}
.roomCard .rDesc{font-size:10px;color:var(--ink2);margin-top:6px;
  line-height:1.3}
.roomCard .rCount{position:absolute;top:10px;right:12px;
  font-size:9px;font-weight:800;color:#1a0000;
  padding:3px 8px;border-radius:10px;
  background:linear-gradient(180deg,var(--y),var(--o))}

/* Room detail (opens like a card deck) */
#roomView{
  position:fixed;inset:0;z-index:85;
  background:linear-gradient(160deg,#1a0c04 0%,#0a0400 100%);
  display:none;overflow:hidden}
#roomView.on{display:flex;flex-direction:column}
#roomHead{
  flex:0 0 auto;padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
  background:rgba(20,8,0,.7);backdrop-filter:blur(12px)}
#roomHead .rHIcon{font-size:22px}
#roomHead .rHTitle{flex:1;font-size:15px;font-weight:900;color:var(--gold)}
#roomHead button{
  padding:8px 14px;border-radius:12px;
  border:1px solid var(--border);background:rgba(255,255,255,.06);
  color:var(--ink);font:inherit;font-size:11px;font-weight:800;
  cursor:pointer;touch-action:none}
#roomHead button.primary{background:linear-gradient(180deg,var(--y),var(--o));color:#1a0000;border:0}
#roomBody{
  flex:1;overflow-y:auto;padding:20px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  align-content:start}
@media (min-width:520px){#roomBody{grid-template-columns:repeat(3,1fr)}}
@media (min-width:820px){#roomBody{grid-template-columns:repeat(4,1fr)}}
.assetCard{
  aspect-ratio:3/4;border-radius:14px;
  background:#ffe9a8;color:#2a0a00;
  cursor:pointer;touch-action:none;
  position:relative;overflow:hidden;
  border:1.5px solid rgba(0,0,0,.35);
  box-shadow:0 6px 20px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.6);
  display:flex;flex-direction:column;
  transition:transform .15s}
.assetCard:active{transform:scale(.95)}
.assetCard .aThumb{
  flex:1;overflow:hidden;display:grid;place-items:center;
  background:rgba(0,0,0,.06);font-size:44px}
.assetCard .aThumb img,.assetCard .aThumb video{
  width:100%;height:100%;object-fit:cover}
.assetCard .aName{
  padding:6px 8px;font-size:10px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(0,0,0,.12);text-align:center}
.assetCard .aSuit{
  position:absolute;top:6px;left:8px;font-size:14px;
  font-weight:900;opacity:.85;z-index:2}
.assetCard .aPin{
  position:absolute;top:6px;right:8px;
  font-size:10px;font-weight:900;color:#7a4400;
  padding:2px 6px;border-radius:6px;
  background:rgba(255,255,255,.6);opacity:.8}
.assetCard.suit-h{background:linear-gradient(150deg,#ffe4ee,#ff9ec3);color:#7a0a34}
.assetCard.suit-h .aSuit{color:#7a0a34}
.assetCard.suit-d{background:linear-gradient(150deg,#fff0d0,#ffcb85);color:#7a4400}
.assetCard.suit-d .aSuit{color:#7a4400}
.assetCard.suit-s{background:linear-gradient(150deg,#e6e6f5,#9b9bc9);color:#1a1a44}
.assetCard.suit-s .aSuit{color:#1a1a44}
.assetCard.suit-c{background:linear-gradient(150deg,#e7ffe7,#8fe0a1);color:#0f5a26}
.assetCard.suit-c .aSuit{color:#0f5a26}

/* ================= TOWER (360 sphere) ================= */
#view-tower{
  background:#000;overflow:hidden}
#towerCanvas{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 30%,
      #fff3d0 0%,
      #ffcc55 20%,
      #4dc4ff 45%,
      #1a5a8a 75%,
      #0a2a44 100%);
  transition:transform 6s ease-in-out;
  transform:scale(1)}
#towerCanvas.bloom{animation:bloom 3s ease-out}
@keyframes bloom{
  0%{filter:brightness(1) saturate(1)}
  40%{filter:brightness(2) saturate(2) hue-rotate(30deg);
    transform:scale(1.05)}
  100%{filter:brightness(1) saturate(1.2);transform:scale(1)}}
#towerSun{
  position:absolute;top:18%;left:50%;
  transform:translateX(-50%);
  font-size:80px;
  filter:drop-shadow(0 0 40px rgba(255,220,120,.9));
  animation:sunFloat 8s ease-in-out infinite alternate}
@keyframes sunFloat{
  from{transform:translate(-50%,0) scale(1)}
  to{transform:translate(-50%,-20px) scale(1.06)}}
#towerSky{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 0%, transparent 30%, rgba(0,0,0,.3) 100%)}
#towerWater{
  position:absolute;bottom:0;left:0;right:0;height:45%;
  background:
    linear-gradient(180deg,
      transparent 0%,
      rgba(77,196,255,.6) 30%,
      rgba(26,90,138,.85) 70%,
      rgba(10,42,68,.95) 100%);
  pointer-events:none}
#towerWater::before,#towerWater::after{
  content:"";position:absolute;left:0;right:0;height:6px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:waveSlide 4s linear infinite}
#towerWater::before{top:20%}
#towerWater::after{top:40%;animation-duration:6s}
@keyframes waveSlide{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}}

#towerDrones{position:absolute;inset:0;pointer-events:none;z-index:4}
.drone{
  position:absolute;font-size:26px;
  filter:drop-shadow(0 0 10px rgba(255,220,150,.8));
  transition:left 2s linear, top 2s linear}
#towerInfo{
  position:absolute;
  left:50%;transform:translateX(-50%);
  bottom:110px;z-index:5;
  padding:14px 20px;border-radius:16px;
  background:rgba(20,8,0,.72);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  font-size:12px;font-weight:800;color:var(--gold);
  text-align:center;max-width:82vw}
#towerInfo b{display:block;font-size:14px;margin-bottom:4px;color:var(--ink)}
#towerActions{
  position:absolute;
  left:50%;transform:translateX(-50%);
  bottom:max(20px,env(safe-area-inset-bottom));
  z-index:5;display:flex;gap:8px}
#towerActions button{
  padding:10px 16px;border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.08);color:var(--ink);
  font:inherit;font-size:11px;font-weight:800;
  cursor:pointer;touch-action:none;backdrop-filter:blur(10px)}
#towerActions button.primary{
  background:linear-gradient(180deg,var(--y),var(--o));color:#1a0000;border:0}

/* ================= CARDS (Skat puzzle) ================= */
#view-cards{
  background:linear-gradient(160deg,#3a1e08 0%,#0a0400 100%);
  overflow:auto;padding:calc(60px + env(safe-area-inset-top)) 14px 120px}
#cardsHeader{
  max-width:820px;margin:0 auto 16px;
  padding:14px 18px;border-radius:16px;
  background:rgba(20,8,0,.7);backdrop-filter:blur(10px);
  border:1px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#cardsHeader .chInfo{flex:1;min-width:160px}
#cardsHeader .chTitle{font-size:14px;font-weight:900;color:var(--gold);
  letter-spacing:.5px;text-transform:uppercase}
#cardsHeader .chSub{font-size:10px;color:var(--ink2);margin-top:3px}
#cardsHeader .chStat{
  font-size:11px;font-weight:800;color:var(--ink);
  padding:6px 12px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border)}
#cardsHeader button{
  padding:8px 14px;border-radius:10px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--y),var(--o));color:#1a0000;
  font:inherit;font-size:11px;font-weight:800;
  cursor:pointer;touch-action:none}
#cardsGrid{
  max-width:900px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:560px){#cardsGrid{grid-template-columns:repeat(6,1fr)}}
@media (min-width:760px){#cardsGrid{grid-template-columns:repeat(8,1fr)}}
.skatCard{
  aspect-ratio:2/3;border-radius:10px;
  background:linear-gradient(150deg,#fff6ea,#ffe4c0);
  color:#3a1e00;
  border:1.5px solid rgba(0,0,0,.35);
  box-shadow:0 6px 14px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.7);
  cursor:pointer;touch-action:none;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .2s, box-shadow .2s}
.skatCard:active{transform:scale(.93)}
.skatCard.flipped{
  background:linear-gradient(150deg,#3a1e08,#1a0a04);
  color:var(--gold)}
.skatCard.matched{
  opacity:.35;pointer-events:none;
  filter:saturate(.5)}
.skatCard.wrong{
  animation:wrongShake .4s}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-4px) rotate(-2deg)}
  75%{transform:translateX(4px) rotate(2deg)}}
.skatCard .scCorner{
  position:absolute;font-size:10px;font-weight:900;
  line-height:1;
  padding:4px 5px;
  z-index:2}
.skatCard .scCorner.tl{top:2px;left:4px}
.skatCard .scCorner.br{bottom:2px;right:4px;transform:rotate(180deg)}
.skatCard .scFace{
  flex:1;display:grid;place-items:center;
  font-size:34px;line-height:1;
  position:relative;overflow:hidden}
.skatCard .scFace img,.skatCard .scFace video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.skatCard .scFace .scGlyph{
  position:relative;z-index:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.skatCard.flipped .scFace .scGlyph{
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))
    drop-shadow(0 0 12px rgba(255,220,120,.9))}

/* ================= TOAST ================= */
#toast{
  position:fixed;z-index:200;
  left:50%;top:max(70px,calc(env(safe-area-inset-top) + 56px));
  transform:translateX(-50%);
  padding:10px 16px;border-radius:14px;
  background:rgba(20,8,0,.95);color:var(--gold);
  font-size:12px;font-weight:800;
  opacity:0;transition:opacity .25s;
  pointer-events:none;border:1px solid var(--border);
  max-width:82vw;text-align:center}
#toast.on{opacity:1}

/* ================= GLITTER OVERLAY ================= */
#glitter{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(2px 2px at 70% 60%, rgba(255,200,120,.6), transparent),
    radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.5), transparent),
    radial-gradient(3px 3px at 85% 15%, rgba(255,180,220,.5), transparent),
    radial-gradient(2px 2px at 15% 70%, rgba(200,220,255,.5), transparent);
  animation:glitterTwinkle 3s ease-in-out infinite alternate;
  mix-blend-mode:screen}
@keyframes glitterTwinkle{
  from{opacity:.4}
  to{opacity:1}}

input[type=file]{display:none}
</style>
</head>
<body data-view="3d">

<!-- Zone bar -->

  <button class="zb" id="viewToggle">◐ 2D</button>

</div>

<!-- ISLAND VIEW -->
<div class="view on" id="view-island">

    <div id="islandGrid"></div>

  </div>
</div>

<div class="view" id="view-library">

</div>

<!-- ROOM DETAIL -->
<div id="roomView">
  <div id="roomHead">
    <span class="rHIcon">📚</span>
    <span class="rHTitle">Room</span>

</div>

<!-- TOWER VIEW -->
<div class="view" id="view-tower">

  <div id="towerWater"></div>

  <div id="towerSky"></div>
  <div id="towerDrones"></div>

    <b>🗼 Fernsehturm · Bloom</b>
    Panorama of sky, sea, and sun
  </div>
  <div id="towerActions">

    <button id="cardsNew">New Deck</button>

  <div id="cardsGrid"></div>
</div>

<!-- Joystick -->

  <div class="jbg"></div>

</div>

  <button class="b" id="actB">B</button>
  <button id="actA">A</button>
</div>

<!-- Upload -->
<button id="uploadChip" aria-label="upload">⬆</button>

<!-- Bubble -->
<div id="bubble"></div>

<input id="fUp" type="file" multiple accept="*/*">
<div id="toast"></div>

<script>
/* ==========================================================================
   ST. PAULI ZAUBERWALD
   ========================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const toast = t => {
  const e = $('#toast'); e.textContent = t; e.classList.add('on');
  clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 1800);
};

/* ===================== STATE ===================== */
const SUITS = ['h','d','s','c'];
const SUIT_CHAR = { h:'♥', d:'♦', s:'♠', c:'♣' };
const RANKS = ['7','8','9','10','J','Q','K','A'];

const state = {
  view: '3d',
  zone: 'island',
  player: { x: 6, y: 8, facing: 'right' },
  entities: [],       // {id, kind, x, y, emoji, name, talk}
  assets: JSON.parse(localStorage.getItem('zw.assets') || '[]'), // {id, name, kind, url, room, suit}
  skatDeck: JSON.parse(localStorage.getItem('zw.deck') || 'null'),
  skatFlipped: [],
  skatMatched: 0,
  libraryRoom: null,
  towerSpin: 0,
  droneTimer: null
};
function save(){
  localStorage.setItem('zw.assets', JSON.stringify(state.assets.map(a => ({
    id: a.id, name: a.name, kind: a.kind, room: a.room, suit: a.suit
  }))));
}

/* ===================== ISLAND MAP ===================== */
/* W=water S=sand G=grass (some flowers/high) T=tower D=farm F=wood L=lily */
const ISLAND_MAP = [
  'W W W S S S S S S S W W W',
  'W W S S G G G G G S S W W',
  'W S S G G F F G G G S W W',
  'W S G G G F T T G G S W W',
  'S S G G G G T T T G G S W',
  'S G G G F F T T G G G S W',
  'S G G G G G G G F F G S W',
  'S G G G D D D G G F G S W',
  'S S G G D D G G G G S W W',
  'W S S G G G G G S S W W W',
  'W W S S S S S S S W W W W',
  'W W W W S S S W W W W W W',
  'W W W W W W W W W W W W W'
];

function tileType(ch){
  if(ch === 'W') return 'water';
  if(ch === 'S') return 'sand';
  if(ch === 'G') return 'grass';
  if(ch === 'F') return 'wood';
  if(ch === 'T') return 'stone';
  if(ch === 'D') return 'grass';   // farm plot
  if(ch === 'L') return 'water';
  return 'grass';
}
function renderIsland(){
  const g = $('#islandGrid');
  g.innerHTML = '';
  const rows = ISLAND_MAP;
  rows.forEach((line, y) => {
    const cells = line.trim().split(/\s+/);
    cells.forEach((ch, x) => {
      const t = document.createElement('div');
      t.className = 'tile ' + tileType(ch);
      t.dataset.x = x; t.dataset.y = y;
      // decorate
      if(ch === 'G' && Math.random() < 0.16) t.classList.add('flower');
      if(ch === 'G' && Math.random() < 0.10) t.classList.add('high');
      if(ch === 'F') t.classList.add('tree');
      g.appendChild(t);
    });
  });

  // tower glow
  const glow = document.createElement('div');
  glow.className = 'towerGlow';
  glow.style.left = (6.5 / 13 * 100) + '%';
  glow.style.top  = (5.5 / 13 * 100) + '%';
  g.parentElement.appendChild(glow);

  // Entities
  state.entities = [
    { id:'tower',  kind:'tower',  x:6, y:4, emoji:'🗼', name:'Fernsehturm', talk:'🗼 The tower. Tap to ascend.' },
    { id:'a1',     kind:'animal', x:4, y:8, emoji:'🦊', name:'Fuchs',   talk:'🦊 The fox knows every path.' },
    { id:'a2',     kind:'animal', x:9, y:3, emoji:'🐰', name:'Hase',    talk:'🐰 A rabbit — it hops when you sing.' },
    { id:'a3',     kind:'animal', x:10,y:8, emoji:'🐦', name:'Vogel',   talk:'🐦 She carries seeds between islands.' },
    { id:'a4',     kind:'animal', x:3, y:5, emoji:'🦌', name:'Reh',     talk:'🦌 Gentle deer. She will let you ride.' },
    { id:'garlic1',kind:'garlic', x:5, y:7, emoji:'🧄', name:'Garlic I', talk:'🧄 A garlic patch. It needs a drone.' },
    { id:'garlic2',kind:'garlic', x:7, y:7, emoji:'🧄', name:'Garlic II',talk:'🧄 Almost ripe. Blooms at dawn.' },
    { id:'drone1', kind:'drone',  x:2, y:9, emoji:'🚁', name:'Drone A',  talk:'🚁 Drone A waters the fields.' },
    { id:'drone2', kind:'drone',  x:11,y:7, emoji:'🛸', name:'Drone B',  talk:'🛸 Drone B harvests the garlic.' },
    { id:'lib',    kind:'lib',    x:6, y:10,emoji:'📚', name:'Library',  talk:'📚 Four rooms of memory.' }
  ];
  renderEntities();
  positionPlayer();
}
function renderEntities(){
  $$('.entity').forEach(e => e.remove());
  const stage = $('#islandStage');
  state.entities.forEach(e => {
    const el = document.createElement('div');
    el.className = 'entity';
    el.dataset.id = e.id;
    el.style.left = ((e.x + 0.5) / 13 * 100) + '%';
    el.style.top  = ((e.y + 0.5) / 13 * 100) + '%';
    el.textContent = e.emoji;
    const lbl = document.createElement('div');
    lbl.className = 'lbl'; lbl.textContent = e.name;
    el.appendChild(lbl);
    el.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ev.stopPropagation();
      interactWith(e);
    });
    stage.appendChild(el);
  });
}
function positionPlayer(){
  let p = document.getElementById('player-sprite');
  if(!p){
    p = document.createElement('div');
    p.id = 'player-sprite';
    p.className = 'entity player';
    p.textContent = '🧝‍♀️';
    const lbl = document.createElement('div');
    lbl.className = 'lbl'; lbl.textContent = 'Steward';
    p.appendChild(lbl);
    $('#islandStage').appendChild(p);
  }
  p.style.left = ((state.player.x + 0.5) / 13 * 100) + '%';
  p.style.top  = ((state.player.y + 0.5) / 13 * 100) + '%';
  p.classList.toggle('facing-left', state.player.facing === 'left');
}

/* ===================== INTERACTION ===================== */
function interactWith(e){
  showBubble(e.talk || '…');
  if(e.kind === 'tower'){
    setTimeout(() => switchZone('tower'), 600);
  }
  if(e.kind === 'lib'){
    setTimeout(() => switchZone('library'), 600);
  }
  if(e.kind === 'garlic'){
    setTimeout(() => {
      showBubble('🧄 *watered* — bloomed in gold ✨');
      toast('🧄 garlic bloomed');
    }, 500);
  }
  if(e.kind === 'animal'){
    // hop animation on player
    const p = document.getElementById('player-sprite');
    if(p){ p.classList.remove('hop'); void p.offsetWidth; p.classList.add('hop'); }
  }
  if(e.kind === 'drone'){
    // send drone to nearest garlic
    flyDroneTo(e);
  }
}
function flyDroneTo(drone){
  // pick a garlic
  const garlic = state.entities.find(x => x.kind === 'garlic');
  if(!garlic) return;
  const el = document.querySelector(`.entity[data-id="${drone.id}"]`);
  if(!el) return;
  el.style.transition = 'left 1.6s ease-in-out, top 1.6s ease-in-out';
  el.style.left = ((garlic.x + 0.5) / 13 * 100) + '%';
  el.style.top  = ((garlic.y + 0.5) / 13 * 100) + '%';
  setTimeout(() => {
    el.textContent = '✨';
    const lbl = document.createElement('div');
    lbl.className = 'lbl'; lbl.textContent = 'working';
    el.appendChild(lbl);
    setTimeout(() => {
      el.textContent = drone.emoji;
      const l2 = document.createElement('div');
      l2.className = 'lbl'; l2.textContent = drone.name;
      el.appendChild(l2);
    }, 1400);
  }, 1600);
}

/* ===================== BUBBLE ===================== */
let bubbleTimer = null;
function showBubble(text, ms = 3200){
  const b = $('#bubble');
  b.textContent = text;
  b.classList.add('on');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove('on'), ms);
}

/* ===================== PLAYER MOVEMENT ===================== */
function tryMove(dx, dy){
  const nx = clamp(state.player.x + dx, 0, 12);
  const ny = clamp(state.player.y + dy, 0, 12);
  const rows = ISLAND_MAP;
  const ch = rows[ny].trim().split(/\s+/)[nx];
  if(ch === 'W' || ch === 'L') return false; // cannot walk on water
  state.player.x = nx;
  state.player.y = ny;
  state.player.facing = dx < 0 ? 'left' : dx > 0 ? 'right' : state.player.facing;
  positionPlayer();
  const p = document.getElementById('player-sprite');
  if(p){ p.classList.remove('hop'); void p.offsetWidth; p.classList.add('hop'); }
  return true;
}

/* ===================== JOYSTICK ===================== */
const stick = $('#stick');
const joy = $('#joy');
let stickActive = false, joyOrigin = {x:0, y:0};
let moveInterval = null, moveDir = {dx:0, dy:0};
joy.addEventListener('pointerdown', e => {
  e.preventDefault();
  stickActive = true;
  joy.setPointerCapture(e.pointerId);
  const r = joy.getBoundingClientRect();
  joyOrigin = { x: r.left + r.width/2, y: r.top + r.height/2 };
});
joy.addEventListener('pointermove', e => {
  if(!stickActive) return;
  const dx = e.clientX - joyOrigin.x;
  const dy = e.clientY - joyOrigin.y;
  const mag = Math.min(44, Math.hypot(dx, dy));
  const ang = Math.atan2(dy, dx);
  const nx = Math.cos(ang) * mag, ny = Math.sin(ang) * mag;
  stick.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
  // Determine dominant direction
  if(mag < 12){ moveDir = {dx:0, dy:0}; }
  else {
    // isometric directions: up on screen = -y - x in grid, etc.
    // Simpler: dominant axis
    if(Math.abs(nx) > Math.abs(ny)){
      moveDir = { dx: nx > 0 ? 1 : -1, dy: 0 };
    } else {
      moveDir = { dx: 0, dy: ny > 0 ? 1 : -1 };
    }
  }
  if(!moveInterval && (moveDir.dx || moveDir.dy)){
    moveInterval = setInterval(() => {
      if(moveDir.dx || moveDir.dy){
        tryMove(moveDir.dx, moveDir.dy);
      }
    }, 260);
  }
});
joy.addEventListener('pointerup', () => {
  stickActive = false;
  stick.style.transform = 'translate(-50%,-50%)';
  moveDir = {dx:0, dy:0};
  if(moveInterval){ clearInterval(moveInterval); moveInterval = null; }
});

/* ===================== ACTION BUTTONS ===================== */
$('#actA').addEventListener('pointerdown', e => {
  e.preventDefault();
  // interact with whatever entity is on current tile or nearest
  let nearest = null, bestD = Infinity;
  state.entities.forEach(en => {
    const d = Math.abs(en.x - state.player.x) + Math.abs(en.y - state.player.y);
    if(d < bestD){ bestD = d; nearest = en; }
  });
  if(nearest && bestD <= 2){ interactWith(nearest); }
  else { showBubble('🌱 Nothing to interact with here.'); }
});
$('#actB').addEventListener('pointerdown', e => {
  e.preventDefault();
  // hop in current facing direction
  const dx = state.player.facing === 'left' ? -1 : 1;
  tryMove(dx, 0);
});

/* ===================== ZONES / VIEWS ===================== */
$$('#zoneBar .zb').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    const z = b.dataset.zone;
    if(z) switchZone(z);
  });
});
function switchZone(z){
  state.zone = z;
  $$('.view').forEach(v => v.classList.remove('on'));
  document.getElementById('view-' + z).classList.add('on');
  $$('#zoneBar .zb').forEach(b => b.classList.toggle('on', b.dataset.zone === z));
  if(z === 'library') renderLibrary();
  if(z === 'tower') enterTower();
  if(z === 'cards') renderCards();
  if(z === 'island'){ positionPlayer(); }
}

/* 2D / 3D toggle */
$('#viewToggle').addEventListener('pointerdown', e => {
  e.preventDefault();
  state.view = state.view === '3d' ? '2d' : '3d';
  document.body.dataset.view = state.view;
  $('#viewToggle').textContent = state.view === '3d' ? '◐ 2D' : '◑ 3D';
  toast(state.view === '3d' ? '🎮 isometric' : '🗺 top-down');
});

/* ===================== LIBRARY ===================== */
const ROOMS = [
  { id:'nature',  emoji:'🌿', name:'Room of Nature',   desc:'Plants, animals, weather' },
  { id:'machine', emoji:'⚙️', name:'Room of Machines', desc:'Drones, gears, signals' },
  { id:'story',   emoji:'📖', name:'Room of Story',    desc:'Notes, letters, memory' },
  { id:'craft',   emoji:'🎨', name:'Room of Craft',    desc:'Stickers, textures, fun' }
];
function renderLibrary(){
  const g = $('#libraryGrid');
  g.innerHTML = '';
  ROOMS.forEach(r => {
    const c = document.createElement('div');
    c.className = 'roomCard';
    const count = state.assets.filter(a => a.room === r.id).length;
    c.innerHTML = `
      <div class="rEmoji">${r.emoji}</div>
      <div class="rName">${r.name}</div>
      <div class="rDesc">${r.desc}</div>
      <div class="rCount">${count}</div>
    `;
    c.addEventListener('pointerdown', e => {
      e.preventDefault();
      openRoom(r);
    });
    g.appendChild(c);
  });
}
function openRoom(room){
  state.libraryRoom = room;
  $('#roomView').classList.add('on');
  $('#roomHead .rHIcon').textContent = room.emoji;
  $('#roomHead .rHTitle').textContent = room.name;
  renderRoom(room);
}
$('#roomBack').addEventListener('pointerdown', e => {
  e.preventDefault();
  $('#roomView').classList.remove('on');
  state.libraryRoom = null;
});
$('#roomUp').addEventListener('pointerdown', e => {
  e.preventDefault();
  $('#fUp').click();
});
function renderRoom(room){
  const b = $('#roomBody');
  b.innerHTML = '';
  const assets = state.assets.filter(a => a.room === room.id);
  if(!assets.length){
    b.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;font-size:12px;color:var(--ink2)">
      No assets yet.<br>Tap ⬆ to upload to this room.
    </div>`;
    return;
  }
  assets.forEach(a => {
    const el = document.createElement('div');
    el.className = 'assetCard suit-' + (a.suit || 'h');
    el.innerHTML = `
      <div class="aSuit">${SUIT_CHAR[a.suit || 'h']}</div>
      <div class="aPin">${a.kind || 'file'}</div>
      <div class="aThumb"></div>
      <div class="aName">${esc(a.name)}</div>`;
    const thumb = el.querySelector('.aThumb');
    if(a.kind === 'image'){ const im = new Image(); im.src = a.url; thumb.appendChild(im); }
    else if(a.kind === 'video'){ const v = document.createElement('video'); v.src = a.url; v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true; thumb.appendChild(v); }
    else if(a.kind === 'audio'){ thumb.textContent = '🎵'; }
    else if(a.kind === '3d'){ thumb.textContent = '🧊'; }
    else if(a.kind === 'pdf'){ thumb.textContent = '📄'; }
    else if(a.kind === 'text'){ thumb.textContent = '📝'; }
    else { thumb.textContent = '📦'; }
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      openAssetViewer(a);
    });
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      const i = state.assets.findIndex(x => x.id === a.id);
      if(i >= 0){ state.assets.splice(i, 1); save(); renderRoom(room); }
    });
    b.appendChild(el);
  });
}
function openAssetViewer(a){
  // inline full screen preview
  const ov = document.createElement('div');
  ov.style.cssText = `position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.85);
    display:flex;flex-direction:column;touch-action:none`;
  const url = a.url;
  let content = '';
  if(a.kind === 'image') content = `<img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain">`;
  else if(a.kind === 'video') content = `<video src="${url}" controls autoplay playsinline style="max-width:100%;max-height:100%"></video>`;
  else if(a.kind === 'audio') content = `<audio src="${url}" controls autoplay style="width:80%"></audio>`;
  else if(a.kind === 'pdf' || a.kind === 'html') content = `<iframe src="${url}" style="width:100%;height:100%;border:0"></iframe>`;
  else if(a.kind === '3d') content = `<model-viewer src="${url}" camera-controls auto-rotate style="width:100%;height:100%"></model-viewer>`;
  else if(a.kind === 'text') content = `<pre style="color:#ffe4c0;padding:20px;font-size:12px;white-space:pre-wrap">${esc(a.name)}</pre>`;
  else content = `<div style="color:#ffe4c0;padding:20px">${esc(a.name)}</div>`;
  ov.innerHTML = `
    <div style="flex:1;display:grid;place-items:center;overflow:hidden">${content}</div>
    <div style="padding:14px;display:flex;gap:8px;justify-content:center;background:rgba(0,0,0,.8)">
      <button style="padding:12px 20px;border-radius:12px;border:0;background:linear-gradient(180deg,#ffd23f,#ff8a1f);color:#1a0000;font:inherit;font-size:13px;font-weight:800;cursor:pointer">✕ close</button>
    </div>`;
  ov.querySelector('button').onclick = () => ov.remove();
  document.body.appendChild(ov);
}

/* ===================== TOWER ===================== */

/* ===================== SKAT CARD PUZZLE ===================== */
function buildDeck(){
  // choose 16 random cards from the 32 Skat deck
  const all = [];
  SUITS.forEach(s => RANKS.forEach(r => all.push({ suit: s, rank: r })));
  // shuffle
  for(let i = all.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  // take 8 pairs by suit — each suit twice (16 cards, 8 pairs)
  const deck = [];
  const suitBuckets = { h: [], d: [], s: [], c: [] };
  all.forEach(c => { if(suitBuckets[c.suit].length < 4) suitBuckets[c.suit].push(c); });
  // For matching: we need pairs of SAME SUIT. So take 4 suits × 2 pairs each = 8 pairs = 16 cards.
  SUITS.forEach(su => {
    const bucket = suitBuckets[su].slice(0, 4); // 4 cards of this suit
    // pair them: bucket[0]+bucket[1], bucket[2]+bucket[3]
    deck.push({ suit: su, rank: bucket[0].rank, pair: su + '_1' });
    deck.push({ suit: su, rank: bucket[1].rank, pair: su + '_1' });
    deck.push({ suit: su, rank: bucket[2].rank, pair: su + '_2' });
    deck.push({ suit: su, rank: bucket[3].rank, pair: su + '_2' });
  });
  // shuffle deck
  for(let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}
function renderCards(){
  if(!state.skatDeck) state.skatDeck = buildDeck();
  const g = $('#cardsGrid');
  g.innerHTML = '';
  state.skatFlipped = [];
  state.skatMatched = 0;
  state.skatDeck.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'skatCard';
    el.dataset.idx = i;
    el.dataset.pair = c.pair;
    el.innerHTML = `
      <div class="scCorner tl">${SUIT_CHAR[c.suit]}${c.rank}</div>
      <div class="scFace"><span class="scGlyph">🎴</span></div>
      <div class="scCorner br">${SUIT_CHAR[c.suit]}${c.rank}</div>
    `;
    // attach a media asset if available (round-robin)
    const media = state.assets[i % Math.max(1, state.assets.length)];
    if(media && media.url){
      const face = el.querySelector('.scFace');
      if(media.kind === 'image'){
        const im = new Image(); im.src = media.url; face.insertBefore(im, face.firstChild);
      } else if(media.kind === 'video'){
        const v = document.createElement('video');
        v.src = media.url; v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true;
        face.insertBefore(v, face.firstChild);
      }
    }
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      flipCard(el);
    });
    g.appendChild(el);
  });
  updateCardsStat();
}
function flipCard(el){
  if(el.classList.contains('matched') || el.classList.contains('flipped')) return;
  el.classList.add('flipped');
  state.skatFlipped.push(el);
  if(state.skatFlipped.length === 2){
    const [a, b] = state.skatFlipped;
    if(a.dataset.pair === b.dataset.pair){
      setTimeout(() => {
        a.classList.add('matched'); b.classList.add('matched');
        state.skatMatched++;
        updateCardsStat();
        toast('✔ matched');
        state.skatFlipped = [];
        if(state.skatMatched === 8){
          setTimeout(() => {
            toast('🏆 Deck solved');
            showBubble('🎉 All suits matched — you unlocked the archive.');
          }, 400);
        }
      }, 420);
    } else {
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(() => {
        a.classList.remove('flipped', 'wrong');
        b.classList.remove('flipped', 'wrong');
        state.skatFlipped = [];
      }, 800);
    }
  }
}
function updateCardsStat(){
  $('#cardsStat').textContent = state.skatMatched + ' / 8';
}
$('#cardsNew').addEventListener('pointerdown', e => {
  e.preventDefault();
  state.skatDeck = buildDeck();
  renderCards();
  toast('🃏 new deck');
});

$('#uploadChip').addEventListener('pointerdown', e => {

$('#fUp').addEventListener('change', e => {
  const files = [...e.target.files];
  if(!files.length) return;
  // Target room: if library room is open, use it. Otherwise pick a random room.
  const room = state.libraryRoom?.id || ROOMS[Math.floor(Math.random() * ROOMS.length)].id;
  files.forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const kind = kindOf(f);
    const suit = SUITS[Math.floor(Math.random() * 4)];
    state.assets.push({
      id: uid('a'),
      name: f.name.slice(0, 24),
      kind, url, room, suit
    });
  });
  save();
  toast(files.length + ' file' + (files.length > 1 ? 's' : '') + ' → ' + room);
  if(state.zone === 'library' && state.libraryRoom) renderRoom(state.libraryRoom);
  else if(state.zone === 'library') renderLibrary();
  // refresh cards
  state.skatDeck = buildDeck();
  e.target.value = '';
});
function kindOf(file){
  const n = file.name.toLowerCase(); const t = file.type || '';
  if(t.startsWith('image/') || /\.(png|jpe?g|gif|webp|heic|avif|svg)$/.test(n)) return 'image';
  if(t.startsWith('video/') || /\.(mp4|webm|mov|m4v)$/.test(n)) return 'video';
  if(t.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|opus|aac)$/.test(n)) return 'audio';
  if(/\.(glb|gltf)$/.test(n)) return '3d';
  if(/\.pdf$/.test(n)) return 'pdf';
  if(t.startsWith('text/') || /\.(txt|md|json|csv|html?|css|js|xml)$/.test(n)) return 'text';
  return 'file';
}

/* ===================== SOUND (unlock on first tap) ===================== */
let actx = null, audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    actx.resume().then(() => {
      audioUnlocked = true;
      $('#soundBtn').textContent = '🔇';
      // gentle ambient pad
      startAmbient();
    });
  } catch(e){}
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
$('#soundBtn').addEventListener('pointerdown', e => {
  e.preventDefault();
  if(!audioUnlocked){ unlockAudio(); return; }
  if(ambientNodes){
    ambientNodes.forEach(n => n.stop());
    ambientNodes = null;
    $('#soundBtn').textContent = '🔊';
  } else {
    startAmbient();
    $('#soundBtn').textContent = '🔇';
  }
});
let ambientNodes = null;
function startAmbient(){
  if(!actx) return;
  ambientNodes = [];
  const freqs = [110, 164, 220, 330];
  freqs.forEach((f, i) => {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = i % 2 ? 'triangle' : 'sine';
    o.frequency.value = f;
    g.gain.value = 0.02;
    o.connect(g); g.connect(actx.destination);
    o.start();
    ambientNodes.push(o);
    // slow LFO
    const lfo = actx.createOscillator();
    const lg = actx.createGain();
    lfo.frequency.value = 0.1 + Math.random() * 0.3;
    lg.gain.value = 0.015;
    lfo.connect(lg); lg.connect(g.gain);
    lfo.start();
    ambientNodes.push(lfo);
  });
}
